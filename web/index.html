    var est=['booked','active'].indexOf(j.status)>=0?estLine(j):'';
    if(fold){var hk='h:'+j.id,fin=['done','paid'].indexOf(j.status)>=0,dayW=j.d.moveDate===t?'Today':fmtDate(j.d.moveDate);
      // finished (Richie, Oct 21: "the customer name, date and time on job"): the day and how long the job took
      var took=j.startedAt&&j.finishedAt>j.startedAt?j.finishedAt-j.startedAt:(j.actualHours>0?j.actualHours*36e5:0);
      var owe=fin&&asLead&&j.status==='done'?(balOf(j)>0&&canCollect()?money(balOf(j))+' due':formsPending(j).length?'forms to sign':''):'';
      var day=fin?esc(dayW+(took?' · '+fmtDur(took)+' on the job':'')):esc(fmtDate(j.d.moveDate)+(j.d.time?' · '+fmtTime(j.d.time):'')+(est?' · '+est:''));
      return '<details class="acc card crewcard hcard" data-job="'+j.id+'" data-k="'+hk+'"'+(ui.open[hk]?' open':'')+'><summary><span class="hsum"><b>'+esc(j.d.name||'A job')+testTag+'</b><small>'+day+'</small>'+(owe?'<small class="money-due hdue">'+esc(owe)+'</small>':'')+'</span><span class="hmore">Details</span><span class="hpill">'+pill(j.status)+'</span></summary><div class="hbody">'+body+'</div></details>'}
    return '<section class="card crewcard" data-job="'+j.id+'"><div class="cc-head"><div class="grow"><h3>'+esc(j.d.name)+testTag+'</h3></div>'+pill(j.status)+'</div>'+
      '<div class="cc-sub cc-date">'+(j.d.moveDate===t?'<b>Today</b>':esc(fmtDate(j.d.moveDate)))+(j.d.time?' · '+fmtTime(j.d.time):'')+(est?' · '+est:'')+'</div>'+body+'</section>';
  }
  return {card:card,asLead:asLead};
}
/* The crew's Jobs screen (Richie's drawing, Oct 21): good morning and the date, the big Clock In, then
   Today | History. Today: jobs to confirm, today's jobs, then the ones coming up, then (leads) finished
   jobs still to bill. History: jobs finished lately, then every past job they worked, with a search.
   Every job is a full card in the same order (crewKit), before and after the job. The office sees the
   same screen as Field view, with Working as. */
function renderCrew(){
  var role=state.ui.role,office=canEditJobs();
  if(ui.tab==='history'&&office){renderHistory();return}   // the office's Job history opens a field card there
  var a0=document.activeElement;if(a0&&a0.id==='hSearch'&&$('#hBody')&&ui.crewView==='history'){histFill();return}   // keep typing in the search box
  var v=$('#view'),roster=fieldRoster(),me=fieldMe(),t=todayISO();
  var picker=roster.length>1?'<label class="row" style="margin-bottom:8px;gap:8px;flex-wrap:nowrap;font-size:13px;color:var(--muted)"><span>Working as</span><select id="meSel" class="inline-sel">'+roster.map(function(n){return '<option value="'+esc(n)+'"'+(n===me?' selected':'')+'>'+esc(n)+(office?whoTag(n):'')+'</option>'}).join('')+'</select></label>':'';
  if(!me){v.innerHTML='<div class="card empty"><h3>No one here yet</h3><p>'+(office?'Add crew members in Setup.':'Ask the office to add you to the crew list.')+'</p></div>';return}
  var kit=crewKit(me),card=kit.card,asLead=kit.asLead,view=ui.crewView==='history'?'history':'today';
  var when=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  var head=picker+'<div class="hero-day"><h1>'+esc(greet()+', '+me.split(' ')[0])+'</h1><div class="sub">'+esc(when)+'</div></div>';
  var sv=sosToday(),clock=clockCardHtml(me,'home');
  var pills='<div class="crewtabs" role="tablist" aria-label="Your jobs">'+[['today','Today'],['history','History']].map(function(x){var on=x[0]===view;return '<button role="tab" aria-selected="'+on+'"'+(on?' class="on"':'')+' data-act="cr:view" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
  var billNeed=function(j){return j.status==='done'&&((balOf(j)>0&&canCollect())||formsPending(j).length>0)};
  if(view==='history'){
    var since=Date.now()-60*864e5,sinceDay=iso(new Date(since));
    // every finished job is here, also one still waiting on billing (a lead has that on Today too)
    var recent=state.jobs.filter(function(j){return ['done','paid'].indexOf(j.status)>=0&&j.assign.crew.indexOf(me)>=0&&!isHistory(j,t)&&(j.finishedAt?j.finishedAt>since:(j.d.moveDate||'')>=sinceDay)})
      .sort(function(x,y){return (y.finishedAt||0)-(x.finishedAt||0)});
    ui.histAs=me;
    v.innerHTML=head+sv+clock+pills+
      (recent.length?'<div class="secline"><h2>Finished lately</h2><small>'+recent.length+'</small></div><p class="hint" style="margin:-3px 2px 9px">Tap a job to see all of it. Photos and notes can still be added.</p>'+recent.map(function(j){return card(j,true)}).join(''):'')+
      '<div class="secline"><h2>Past jobs</h2></div><label class="f hist-search"><span>Search your past jobs</span><input id="hSearch" type="search" enterkeyhint="search" placeholder="Name, address or month" autocomplete="off" value="'+esc(ui.hq||'')+'"></label><div id="hBody"></div>';
    histFill();return;
  }
  ui.histAs='';
  var mine=state.jobs.filter(function(j){return ['booked','active'].indexOf(j.status)>=0&&j.assign.crew.indexOf(me)>=0}).sort(function(x,y){return ((x.d.moveDate||'9999')+x.d.time)<((y.d.moveDate||'9999')+y.d.time)?-1:1});
  var todays=mine.filter(function(j){return j.status==='active'||!j.d.moveDate||j.d.moveDate<=t}),later=mine.filter(function(j){return todays.indexOf(j)<0});
  // a job finished today stays on Today (after the open ones) until the day is over, then it is in History
  var doneToday=state.jobs.filter(function(j){return ['done','paid'].indexOf(j.status)>=0&&j.assign.crew.indexOf(me)>=0&&j.d.moveDate===t}).sort(function(x,y){return (x.finishedAt||0)-(y.finishedAt||0)});
  todays=todays.concat(doneToday);
  var billJobs=asLead?state.jobs.filter(function(j){return j.assign.crew.indexOf(me)>=0&&billNeed(j)&&todays.indexOf(j)<0}):[];
  var toConfirm=jobMsgs(me).filter(function(j){return needsConfirm(j)&&!isConfirmed(j,me)});
  var cfm=toConfirm.length?'<div class="secline"><h2>Confirm your jobs</h2><small>'+toConfirm.length+'</small></div><div class="card cfmlist">'+toConfirm.map(function(j){var rd=relDay(j.d.moveDate);
    return '<div class="cfmrow"><span class="grow"><b>'+esc(j.d.name||'A job')+'</b><small>'+esc((rd==='today'||rd==='tomorrow'?rd.charAt(0).toUpperCase()+rd.slice(1):rd)+' at '+fmtTime(j.d.time))+(j.confirm&&j.confirm[me]?' · the day or time changed':'')+'</small></span><button class="btn primary sm" data-act="jm:confirm" data-id="'+j.id+'" data-who="'+esc(me)+'">Confirm</button></div>'}).join('')+'</div>':'';
  v.innerHTML=head+sv+clock+pills+cfm+
    '<div class="secline"><h2>Today</h2>'+(todays.length?'<small>'+todays.length+'</small>':'')+'</div>'+
    (todays.length?todays.map(function(j){return card(j,['done','paid'].indexOf(j.status)>=0)}).join(''):'<div class="card empty"><h3>No jobs today</h3><p>'+(mine.length?'Your next job is below.':'The office assigns crews. New jobs show here, and finished ones are in History.')+'</p></div>')+
    (later.length?'<div class="secline"><h2>Coming up</h2><small>'+later.length+'</small></div>'+later.map(function(j){return card(j,true)}).join(''):'')+   // folded, with the time and the estimate (Richie, Oct 21)
    (billJobs.length?'<div class="secline"><h2>Finished, needs billing</h2><small>'+billJobs.length+'</small></div>'+billJobs.map(function(j){return card(j,true)}).join(''):'');
}

/* ---------- JOB HISTORY ---------- */
/* Everything that left the working screens (see isHistory). The office sees every company job and
   opens it in the job sheet as before; a crew member or lead sees the jobs they worked and opens
   the same field card as the Field view, to add photos and notes after the fact. */
function histJobs(){
  var t=todayISO(),me=ui.histAs||(canEditJobs()?'':fieldMe()),office=!me;
  return state.jobs.filter(function(j){
    if(!isHistory(j,t))return false;
    return office||(j.status!=='lost'&&j.assign.crew.indexOf(me)>=0);
  }).sort(function(a,b){
    var x=jobDay(a)+' '+(a.d.time||''),y=jobDay(b)+' '+(b.d.time||'');
    return x<y?1:x>y?-1:(b.finishedAt||0)-(a.finishedAt||0);
  });
}
function histMatch(j,q){
  if(!q)return true;
  var d=j.d||{},ph=String(d.phone||'').replace(/\D/g,'');
  var hay=[d.name,d.from,d.to,d.email,d.moveDate,d.moveDate?fmtDate(d.moveDate):'',(j.assign.crew||[]).join(' '),trucksLine(j)].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(w){
    if(hay.indexOf(w)>=0)return true;
    var dg=w.replace(/\D/g,'');return /^[\d().+-]+$/.test(w)&&dg.length>=3&&ph.indexOf(dg)>=0;   // part of a phone number
  });
}
function histReset(q){ui.hq=q||'';ui.hf='all';ui.hShow=50;ui.hShowC=0}
function renderHistory(){
  if(!canEditJobs()){ui.tab='crew';ui.crewView='history';renderTabs();renderCrew();return}   // the crew's history is inside Jobs
  ui.histAs='';
  var v=$('#view'),office=canEditJobs(),role=state.ui.role;
  var a=document.activeElement;
  if(a&&a.id==='hSearch'&&$('#hBody')){histFill();return}   // keep typing in the search box
  var me=office?'':fieldMe();
  if(!office&&!me){v.innerHTML='<div class="card empty"><h3>No one here yet</h3><p>Ask the office to add you to the crew list.</p></div>';return}
  var roster=office?[]:fieldRoster();
  var picker=roster.length>1?'<label class="row" style="margin-bottom:8px;gap:8px;flex-wrap:nowrap;font-size:13px;color:var(--muted)"><span>Working as</span><select id="meSel" class="inline-sel">'+roster.map(function(n){return '<option value="'+esc(n)+'"'+(n===me?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></label>':'';
  v.innerHTML=picker+'<label class="f hist-search"><span>Search '+(office?'past jobs':'your past jobs')+'</span><input id="hSearch" type="search" enterkeyhint="search" placeholder="'+(office?'Name, phone, address, crew or month':'Name, address or month')+'" autocomplete="off" value="'+esc(ui.hq||'')+'"></label><div id="hBody"></div>';
  histFill();
}
function histFill(){
  var el=$('#hBody');if(!el)return;
  var me=ui.histAs||(canEditJobs()?'':fieldMe()),office=!me,all=histJobs(),q=(ui.hq||'').trim();
  if(!all.length){
    el.innerHTML='<div class="card empty"><h3>No past jobs yet</h3><p>'+(office?'Paid jobs move here the day after the move, and lost jobs right away. A finished job that still owes money or a signature stays in Jobs until it is settled.':'Jobs you worked move here the day after they are paid.')+'</p></div>';
    return;
  }
  var found=all.filter(function(j){return histMatch(j,q)});
  if(!found.length){el.innerHTML='<div class="card empty"><h3>Nothing matches “'+esc(q)+'”</h3><p>Try part of a name, a street, or a month like “Sep”.</p><button class="btn" data-act="hist:clear">Clear search</button></div>';return}
  var cnt={all:found.length};found.forEach(function(j){cnt[j.status]=(cnt[j.status]||0)+1});
  if(ui.hf!=='all'&&!cnt[ui.hf])ui.hf='all';

  var chips=office&&kinds.length>1?'<div class="scrollx" style="margin:10px 0">'+['all'].concat(kinds).map(function(s){return '<button class="chip'+(ui.hf===s?' on':'')+'" data-act="hist:f" data-f="'+s+'" aria-pressed="'+(ui.hf===s)+'">'+(s==='all'?'All':LABEL[s])+' <small>'+cnt[s]+'</small></button>'}).join('')+'</div>':'';
  var list=found.filter(function(j){return ui.hf==='all'||j.status===ui.hf});
  var mt={};list.forEach(function(j){var k=jobDay(j).slice(0,7),m=mt[k]||(mt[k]={n:0,amt:0});m.n++;if(j.status!=='lost')m.amt+=totalOf(j)});
  var step=office?50:20,showN=office?ui.hShow:(ui.hShowC||20),shown=list.slice(0,showN),cur='',html='',kit=office?null:crewKit(me);
  shown.forEach(function(j){
    var k=jobDay(j).slice(0,7);
    if(k!==cur){cur=k;var m=mt[k];html+='<div class="secline"><h2>'+esc(parseISO(k+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'}))+'</h2><small>'+m.n+' job'+(m.n===1?'':'s')+(office&&m.amt?' · '+money(m.amt):'')+'</small></div>'}
    var when=esc((j.d.moveDate?fmtDate(j.d.moveDate):'No move date')+' · '+(j.d.from||'?')+' → '+(j.d.to||'?'));
    var test=j.test?' <span class="pill" style="border:1px dashed var(--muted);background:transparent">Test</span>':'';
    if(office){html+='<button class="job" data-act="job:open" data-id="'+j.id+'"><div class="row between"><div class="t">'+esc(j.d.name||'Unnamed')+'</div><div class="r"'+(j.status==='lost'?' style="color:var(--muted)"':'')+'>'+(j.quote.cf?money(totalOf(j)):'')+'</div></div><div class="route">'+when+'</div><div>'+pill(j.status)+test+'</div></button>';return}
    html+=kit.card(j,true);   // the customer's name and the day; tap for everything on it (Richie, Oct 21)
  });
  var left=list.length-shown.length;

  var out='<div class="card" style="padding:10px 12px"><div class="grid2"><label class="f"><span>From</span><input type="date" id="rFrom" value="'+esc(from)+'"></label><label class="f"><span>To</span><input type="date" id="rTo" value="'+esc(to)+'"></label></div><div class="hint" style="margin-top:4px">Leave blank for all time.</div></div>'+

  var srcCard='<section class="card"><h2>Where jobs come from</h2><table class="tbl"><tr><th>Source</th><th class="n">Leads</th><th class="n">Won</th><th class="n">Collected</th></tr>'+(srcRows||'<tr><td colspan="4"><small>No jobs in this range.</small></td></tr>')+'</table></section>';

      '<h3 style="margin:14px 0 4px">Job hours</h3><table class="tbl"><tr><th>Job</th><th class="n">Bid</th><th class="n">Actual</th><th class="n">Miss</th></tr>'+recent+'</table>'+
      (Math.abs(all.avg)>=5&&meas.length>=3?'<p class="hint">Setting crew speed to about '+sug+' cu ft per mover-hour (now '+S.prod+') would bring new bids in line with your real jobs.</p><button class="btn sm" data-act="applyprod" data-v="'+sug+'">Set to '+sug+'</button>':'');
  }
  var shifts=state.shifts.filter(function(x){return inR(iso(new Date(x.inAt)))});
  var byWho={};
  shifts.forEach(function(x){var h=shiftMs(x)/36e5,r=byWho[x.who]||(byWho[x.who]={tot:0,act:{},late:0});r.tot+=h;r.act[x.activity]=(r.act[x.activity]||0)+h;if(x.late)r.late++});
  var jobHrs={},topHrs={},dayClock={},dayJob={},dayTop={};
  shifts.forEach(function(x){var k=x.who+'|'+iso(new Date(x.inAt));dayClock[k]=(dayClock[k]||0)+shiftMs(x)/36e5});
  finished.forEach(function(j){if(!(j.actualHours>0))return;var dy=j.d.moveDate||iso(new Date(j.finishedAt||j.createdAt)),tu=topUpFor(j);
    j.assign.crew.forEach(function(n){var k=n+'|'+dy,jh=crewSegs(j,n).length?Math.round(crewMs(j,n,j.finishedAt)/36e5*10)/10:j.actualHours;jobHrs[n]=(jobHrs[n]||0)+jh;topHrs[n]=(topHrs[n]||0)+tu;dayJob[k]=(dayJob[k]||0)+jh;dayTop[k]=(dayTop[k]||0)+tu})});

function setListHtml(secs){
  var q=String(ui.setQ||'').trim().toLowerCase();
  var row=function(s){return '<button class="navrow'+(s.id==='options'?' lead':'')+'" data-act="set:open" data-sec="'+s.id+'"><span class="ic">'+(SICON[s.id]||SICON.options)+'</span><span class="tx"><b>'+esc(s.title)+'</b><small>'+esc(s.sum)+'</small></span><span class="go">›</span></button>'};
  if(q){
    var words=q.split(/\s+/),hit=function(txt){txt=String(txt).toLowerCase();return words.every(function(w){return txt.indexOf(w)>=0})};
    var ss=secs.filter(function(s){return hit(s.keys+' '+s.sum)}),os=OPTS.filter(function(x){return hit(x.t+' '+optHint(x))});
    if(!ss.length&&!os.length)return '<div class="card empty"><h3>Nothing matches “'+esc(ui.setQ)+'”</h3><p>Try another word, like deposit, tax, clock or texts.</p></div>';
    return (os.length?'<div class="glabel">Switches</div><section class="card">'+os.map(optRow).join('')+'</section>':'')+
      (ss.length?'<div class="glabel">Sections</div><div class="navlist">'+ss.map(row).join('')+'</div>':'');
  }
  return '<div class="navlist">'+secs.filter(function(s){return s.g==='top'}).map(row).join('')+'</div>'+
    SET_GROUPS.map(function(g){var list=secs.filter(function(s){return s.g===g[0]});return list.length?'<div class="glabel">'+esc(g[1])+'</div><div class="navlist">'+list.map(row).join('')+'</div>':''}).join('');
}

    fr.onload=function(){var img=new Image();img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.6))};img.onerror=rej;img.src=fr.result};

}

  inp.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;z-index:-1';
  inp.addEventListener('change',function(){takePhotos(inp.files);setTimeout(function(){if(inp.parentNode)inp.parentNode.removeChild(inp)},0)});

/* ---------- truck down: the emergency beacon ----------
   When a truck breaks down or is in an accident, the crew taps Truck down (on Today, on their jobs,
   or in More). The office is told at once: which truck, who sent it, the job, and where they are,
   with a map link that keeps updating while the alert is on. The hosted app texts the office too.
   The alert is a chat message (k 'sos', thread 'office') that only the office is shown, and never
   on the chat screen; the office answers Got it (k 'sosack', ref the alert) so the crew knows it

function sosMyLocText(a){
  if(sos.id===a.id){
    if(sos.geo==='denied')return 'Location is blocked on this phone, so the office can’t see where you are. Say where you are in the note, or call them.';
    if(sos.locErr)return 'Your location didn’t go out just now. Check your signal; Tally keeps trying.';
    if(sos.pub){var L=sos.pub,lt=sosNum(L.ts)||Date.now();return 'Sharing where you are · updated <span data-ago="'+lt+'">'+ago(lt)+'</span>'+(sosAcc(L)?' · '+sosAcc(L):'')+'. Keep Tally open so it keeps updating.'}
    if(sos.last)return 'Sending your location…';
    if(sos.geo==='unavailable')return 'This phone can’t find its location. Say where you are in the note.';
    return 'Finding your location…';

  var ot=sosHasLoc(a)?(sosNum(a.loc.ts)||sosNum(a.upd)||a.ts):0;
  return ot?'Shared from the phone that sent the alert · updated <span data-ago="'+ot+'">'+ago(ot)+'</span>':'Not shared from this phone.';

  if(t.st==='sent')return t.names&&t.names.length?'Texted '+esc(andList(t.names))+'.':'No one in the office has a phone number saved in Setup, so no texts went out. Call them.';

function renderSos(soft){
  var el=$('#sos');if(!el)return;
  if(!ui.sosStart&&!ui.sosOpen){if(!el.hidden){el.hidden=true;el.innerHTML='';syncLock()}sos.dirty=false;return}
  var act=document.activeElement,keep=act&&act.tagName==='TEXTAREA'&&el.contains(act)?{id:act.id,s:act.selectionStart,e:act.selectionEnd}:null;
  if(soft&&keep&&!el.hidden){sos.dirty=true;return}   // drawn again once they stop typing
  sos.dirty=false;
  var first=el.hidden,top=el.scrollTop;
  el.innerHTML='<div class="sos-in">'+(ui.sosStart?sosStartHtml():sosListHtml())+'</div>';
  el.hidden=false;el.scrollTop=first?0:top;
  if(keep){var n=document.getElementById(keep.id);if(n){try{n.focus();n.setSelectionRange(keep.s,keep.e)}catch(x){}}}
  else if(first){try{el.focus()}catch(x){}}

}

  var txt=oth.length>1?oth.length+' trucks are down: '+esc(andList(oth.map(sosTruck)))
    :oth.length?esc(sosTruck(oth[0]))+' is down · '+esc(oth[0].from)+' · <span data-ago="'+sosNum(oth[0].ts)+'">'+ago(oth[0].ts)+'</span>'
    :'Your truck-down alert is on';

/* a chime and a buzz for the office, until someone answers or closes it (30 seconds at most) */
function sosBeep(){
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{
    var ctx=sos.ctx||(sos.ctx=new C());if(ctx.state==='suspended'&&ctx.resume)ctx.resume();
    var t0=ctx.currentTime+0.05,tones=[660,880,1100,660,880,1100];
    tones.forEach(function(f,i){var o=ctx.createOscillator(),g=ctx.createGain(),t=t0+i*0.2+(i>2?0.25:0);o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.19)});
  }catch(e){}
}
function sosAlarm(on){
  if(!on){if(sos.ringT){clearInterval(sos.ringT);sos.ringT=null;try{if(navigator.vibrate)navigator.vibrate(0)}catch(e){}}return}
  clearInterval(sos.ringT);
  var until=Date.now()+30000,ring=function(){
    if(Date.now()>until||!ui.sosOpen){clearInterval(sos.ringT);sos.ringT=null;return}
    sosBeep();try{if(navigator.vibrate)navigator.vibrate([400,150,400])}catch(e){}
  };
  sos.ringT=setInterval(ring,6000);ring();
}
document.addEventListener('pointerdown',function(){if(sos.ctx&&sos.ctx.state==='suspended'){try{sos.ctx.resume()}catch(e){}}},true);
// keeps the sender's screen on, so the location keeps going out
function sosWake(on){
  if(!on){if(sos.lock){try{sos.lock.release()}catch(e){}sos.lock=null}return}
  if(sos.lock||!(navigator.wakeLock&&navigator.wakeLock.request))return;
  try{navigator.wakeLock.request('screen').then(function(l){sos.lock=l;if(l&&l.addEventListener)l.addEventListener('release',function(){sos.lock=null})},function(){})}catch(e){}
}

/* the sender's location, while the alert is on: the first fix at once, then whenever the truck
   moves or the fix gets much sharper, and every 2 minutes so the office can see it is current */
function sosGeoStart(id){
  sosGeoStop();
  sos.id=id;sos.geo='asking';
  var g=navigator.geolocation;
  if(!(g&&g.watchPosition)){sos.geo='unavailable';return}
  var opts={enableHighAccuracy:true,maximumAge:5000,timeout:20000};
  try{sos.watch=g.watchPosition(sosPos,sosGeoErr,opts)}catch(e){sos.geo='unavailable';sos.watch=null;return}
  sos.beat=setInterval(function(){try{g.getCurrentPosition(sosPos,function(){},opts)}catch(e){}},120000);
}
function sosGeoStop(){
  if(sos.watch!=null){try{navigator.geolocation.clearWatch(sos.watch)}catch(e){}}
  clearInterval(sos.beat);sos.watch=null;sos.beat=null;sos.id='';sos.geo='off';sos.last=null;sos.pub=null;sos.locErr=false;sos.sentAt=0;
}
function sosPos(p){
  if(!sos.id||!p||!p.coords)return;
  var loc={lat:+(+p.coords.latitude).toFixed(5),lng:+(+p.coords.longitude).toFixed(5),acc:Math.round(p.coords.accuracy||0),ts:Date.now()};
  if(!isFinite(loc.lat)||!isFinite(loc.lng))return;
  var pub=sos.pub,since=Date.now()-sos.sentAt,moved=pub?distM(pub,loc):1e9,sharper=!!pub&&pub.acc>30&&loc.acc>0&&loc.acc<pub.acc/2;
  sos.last=loc;sos.geo='on';
  if(!sos.sentAt||(since>=8000&&(moved>50||sharper))||since>=120000)sosPutLoc(loc);
  sosLocLine();
}
function sosGeoErr(e){
  var id=sos.id;if(!id)return;
  if(e&&e.code===1){
    sosGeoStop();sos.id=id;sos.geo='denied';     // keeps sos.id, so the screen can say why
    sosPut(id,{geo:'off'}).then(function(){sosTextsNow(id)},function(){sosTextsNow(id)});
  }else if(!sos.last)sos.geo='unavailable';
  sosLocLine();
}
function sosLocLine(){var e=$('#sosLocLine'),a=sosAll()[sos.id];if(e&&a)e.innerHTML=sosMyLocText(a)}
function sosPutLoc(loc){
  var id=sos.id;if(!id)return;
  sos.sentAt=Date.now();
  // a save that fails is tried again with a newer fix about 8 seconds later
  sosPut(id,{loc:loc}).then(function(){if(sos.id===id){sos.pub=loc;sos.locErr=false;sosLocLine()}sosTextsNow(id)},function(){if(sos.id===id){sos.sentAt=Date.now()-112000;sos.locErr=true;sosLocLine()}});
}
// One change to an alert, saved after the alert itself. Once it is saved it shows on this phone
// straight away, without waiting for the shared copy to come back; each field keeps its newest value.
function sosPut(id,patch){
  var t=patch.upd=Date.now();
  return (sos.saved||Promise.resolve()).then(function(){
    var d=chat.db;if(!d)throw new Error('offline');
    return d.doc('chat/'+id).update(patch);
  }).then(function(r){
    var base=sosAll()[id],l=sos.local[id]||(sos.local[id]=base?clone(base):null);
    if(l){l.__t=l.__t||{};Object.keys(patch).forEach(function(k){if(!(l.__t[k]>t)){l[k]=clone(patch[k]);l.__t[k]=t}});if(!(l.upd>t))l.upd=t}
    return r;
  });
}

/* sending, answering, ending */
function sosSend(){
  var st=ui.sosStart;if(!st||st.busy)return;
  if(sosWhyNot()){renderSos();return}
  var me=sosMe(),ta=$('#sosNote'),ts=$('#sosTruck'),note=String((ta&&ta.value)||'').trim().slice(0,280),now=Date.now();
  var tid=(ts&&ts.value)||'',tk=(state.settings.trucks||[]).filter(function(x){return x.id===tid})[0],job=sosMyJob(me);
  var m={id:'s'+uid()+uid(),t:'office',from:me,text:note,ts:now,k:'sos',upd:now,truck:tk?tk.name:'',truckId:tk?tk.id:'',jobId:job?job.id:'',job:job?(job.d.name||''):''};
  if(job&&job.test)m.test=true;
  st.busy=true;st.err='';renderSos();
  sosGeoStart(m.id);   // asked inside the tap, so the phone can show its location prompt
  sos.saved=chat.db.collection('chat').doc(m.id).set(m).then(function(){
    sos.local[m.id]=clone(m);state.ui.sosOwn={id:m.id,ts:m.ts,from:m.from};save();
    if(sos.id===m.id&&sos.watch==null&&sos.geo==='unavailable')sosPut(m.id,{geo:'none'}).catch(function(){});
    delete ui.sosDraft.sosNote;delete ui.sosDraft.sosTruck;ui.sosStart=null;ui.sosOpen=true;ui.sosShown[m.id]=1;
    sos.texts[m.id]={st:'wait'};sosTextsSoon(m.id);sosWake(true);
    sosSync();
  },function(){
    if(sos.id===m.id)sosGeoStop();
    st.busy=false;st.err='The alert did not go out. Check your signal and try again, or call the office.';
    if(ui.sosStart===st)renderSos();else toast('The truck-down alert did not go out. Check your signal and try again, or call the office.');
  });
}
// the texts wait a few seconds for a location, so they can carry one
function sosTextsSoon(id){
  var t=sos.texts[id];if(!t)return;
  if(!commsReady()){t.st=window.tallyComms?'noline':'nocopy';sosTextsKeep(id);return}
  clearTimeout(t.timer);t.st='wait';t.timer=setTimeout(function(){sosTextsNow(id)},8000);
  // a location on its way sends them as soon as it is saved; with none coming, they go now
  if(sos.id!==id||(sos.watch==null&&sos.geo!=='denied'))sosTextsNow(id);
}
function sosTextsNow(id){
  var t=sos.texts[id];if(!t||t.st!=='wait')return;
  clearTimeout(t.timer);t.st='sending';renderSos();
  window.tallyComms.sos(id,'start').then(function(r){
    if(r&&r.ok&&r.pending){   // another request is sending them right now: look again shortly
      t.st='wait';clearTimeout(t.timer);t.timer=setTimeout(function(){sosTextsNow(id)},5000);return}
    if(r&&r.ok){t.st=r.skipped==='test'?'test':r.skipped==='ended'?'ended':'sent';t.names=r.names||[]}
    else if(r&&r.reason==='no-line')t.st='noline';
    else{t.st='failed';t.msg=(r&&r.message)||''}
  },function(){t.st='failed';t.msg=''}).then(function(){sosTextsKeep(id);renderSos()});
}
function sosTextsKeep(id){var o=state.ui.sosOwn,t=sos.texts[id];if(o&&o.id===id&&t){o.texts={st:t.st,names:t.names||[],msg:t.msg||''};save()}}
var SOS_OFFLINE='Tally isn’t connected right now. Check your signal and try again.';
// Got it shows as sent only once it is saved, so the crew is never told the office has it when it doesn't
function sosAck(id){
  var a=sosAll()[id],bk='ack:'+id;if(!sosIsOn(a)||!sosOffice()||ui.sosBusy[bk])return;

  var first=!sync.settingsSeen;sync.settingsSeen=true;sync.got.settings=true;
  if(snap.exists&&(first||canon(settingsDoc())===sync.lastSettings)){
    var v=clone(snap.data());
    v.forms=(v.forms||[]).map(function(f){f.pages=(f.pageIds||[]).map(function(id){return sync.pageCache[id]||''});return f});
    state.settings=Object.assign(defaultSettings(),ccDb()?CARD_BLANK:{},v);   // the call center reads the rate card, with nothing of the company's own under it
    if(!state.settings.comms||!state.settings.comms.alerts)state.settings.comms=defaultSettings().comms;
    if(!state.settings.opt||typeof state.settings.opt!=='object')state.settings.opt={};
    sync.lastSettings=canon(settingsDoc());
    if(!ccDb())fetchPages();   // the forms' pages: signed on the job, never the call center's
    shopGeoCheck();
    cacheSave();applyIdentityUI();softRefresh();
  }
  syncOut();
}

/* ---------- Add materials: tap an item and one goes on the job, each tap ----------
   Opened from the job sheet (ctx 's') and the crew card (ctx 'c'). Each tap is saved to the job at
   once, as one more on this person's own line for that item; − takes one off. Something not on the
   list goes in with its own name and a quantity, for the office to price. What changed is written
   to the job's Activity once, when the list closes. */
function fmtQty(n){return String(round2(num(n)))}
function mpCount(j,mid){return round2((j.materials||[]).filter(function(m){return m.itemId===mid}).reduce(function(a,m){return a+num(m.qty)},0))}
function mpAdd(j,m,who){
  var line=(j.materials||[]).filter(function(x){return x.itemId===m.id&&x.by===who&&!x.custom&&x.price===m.price}).pop();
  if(line){line.qty=round2(num(line.qty)+1);line.ts=Date.now();return line}
  j.materials=j.materials||[];
  line={id:uid(),itemId:m.id,name:m.name,unit:m.unit,qty:1,price:m.price,cost:m.cost,by:who,ts:Date.now()};
  j.materials.push(line);return line;
}
// one off: from this person's own line first; the office and the crew lead may take from anyone's.
// Returns the item's name, or '' when there was nothing they may take off.
function mpMinus(j,mid,who,any){
  var lines=(j.materials||[]).filter(function(x){return x.itemId===mid&&(any||x.by===who)});
  var line=lines.filter(function(x){return x.by===who}).pop()||lines.pop();
  if(!line)return '';
  line.qty=round2(num(line.qty)-1);
  if(line.qty<=0)j.materials=j.materials.filter(function(x){return x!==line});else line.ts=Date.now();
  return line.name;
}
function mpOpen(id,ctx,who){
  var j=byId(id);if(!j)return;
  if(j.status==='paid'||j.status==='lost'){toast('This job is '+(j.status==='paid'?'paid':'lost')+', so materials are locked.');return}
  var r=state.ui.role,me=who||myName()||'Office';
  ui.mp={jobId:id,ctx:ctx==='s'?'s':'c',who:me,any:ctx==='s'||r==='owner'||r==='dispatch'||(r==='lead'&&isLead(me)),delta:{},q:'',bump:'',other:{n:'',q:'1'}};
  renderMatPick();
  var f=$('#matpick .mtap');if(f){try{f.focus({preventScroll:true})}catch(e){}}
}
function mpClose(){
  var mp=ui.mp;if(!mp)return;ui.mp=null;
  var j=byId(mp.jobId);
  if(j){
    var up=[],down=[];
    Object.keys(mp.delta).forEach(function(k){var n=round2(mp.delta[k]);if(n>0)up.push(k+' × '+fmtQty(n));else if(n<0)down.push(k+' × '+fmtQty(-n))});
    if(up.length||down.length){logEv(j,(up.length?'Materials added by '+mp.who+': '+up.join(', '):'')+(up.length&&down.length?'; ':'')+(down.length?(up.length?'taken off: ':'Materials taken off by '+mp.who+': ')+down.join(', '):''));save();matAfter(mp.ctx)}
  }
  renderMatPick();
}
function mpFilter(){
  var q=((ui.mp&&ui.mp.q)||'').trim().toLowerCase(),n=0;
  $$('#matpick .mtile').forEach(function(t){var hit=!q||t.dataset.nm.indexOf(q)>=0;t.hidden=!hit;if(hit)n++});

    var s=commSig(j);if(comms.seen[j.id]===s)return;

  window.tallyComms.job(id).then(function(r){

/* ---------- quote: driving distance from the two addresses ----------
   Hosted edition asks the Edge Function (Google Routes, key kept on the server). Without it,
   the note offers Google Maps directions in a new tab so the miles can be typed in. */
var dist={cache:{},busy:'',err:'',errKey:''};
function distKey(a,b){return String(a||'').trim().toLowerCase().replace(/\s+/g,' ')+'|'+String(b||'').trim().toLowerCase().replace(/\s+/g,' ')}
function mapsDirUrl(a,b){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode=driving'}
function distLookup(){
  var d=state.draft,a=(d.from||'').trim(),b=(d.to||'').trim();
  if(!a||!b||!canLookup()){renderDistNote();return}
  var k=distKey(a,b);
  if(dist.cache[k]){applyDist(dist.cache[k]);return}
  if(dist.busy===k)return;
  dist.busy=k;dist.err='';renderDistNote();
  mapsDistance(a,b).then(function(r){
    if(dist.busy!==k)return;dist.busy='';
    if(r&&r.ok&&r.miles>=0){r.key=k;dist.cache[k]=r;if(distKey(state.draft.from,state.draft.to)===k)applyDist(r);else renderDistNote()}
    else{dist.err=(r&&r.message)||'Could not look up the drive.';dist.errKey=k;renderDistNote()}
  });
}
function applyDist(r){
  var d=state.draft,cur=String(d.miles||'').trim();
  if(!cur||d.milesAuto){
    d.miles=String(r.miles);d.milesAuto=true;d.driveMin=r.minutes;save();
    var mi=$('[data-d="miles"]');if(mi)mi.value=d.miles;updateQuote();
  }
  renderDistNote();
}
function renderDistNote(){
  var el=$('#distNote');if(!el)return;
  var d=state.draft,a=(d.from||'').trim(),b=(d.to||'').trim(),k=distKey(a,b),r=dist.cache[k];
  var link=a&&b?' <a href="'+esc(mapsDirUrl(a,b))+'" target="_blank" rel="noopener">See the drive on Google Maps</a>':'';
  var h;
  var btn=canLookup()&&dist.busy!==k?' <button class="btn sm" data-act="q:dist">'+(r&&String(d.miles||'').trim()===String(r.miles)?'Look up again':'Look up distance')+'</button>':'';
  if(!canLookup()&&a&&b)link=' <a class="btn sm" href="'+esc(shopTripUrl()||mapsDirUrl(a,b))+'" target="_blank" rel="noopener">'+(shopTripUrl()?'Open the whole trip in Google Maps':'Open the drive in Google Maps')+'</a>';
  if(!a||!b)h=canLookup()?'Enter both addresses and the distance fills itself in. <button class="btn sm" data-act="q:dist">Look up distance</button>':'Enter both addresses, then check the drive on Google Maps.';
  else if(!canLookup())h='Type the miles from the map. This copy of Tally can’t look distances up itself; the Tally app on your phone does it for you.'+link;
  else if(dist.busy===k)h='Looking up the drive…';
  else if(r){
    var same=String(d.miles||'').trim()===String(r.miles);
    h=same?'Driving distance: <b>'+r.miles+' mi</b>, about '+fmtDur(r.minutes*60000)+' by car. Looked up from the addresses.'
      :'Google Maps says <b>'+r.miles+' mi</b> ('+fmtDur(r.minutes*60000)+' by car). <button class="btn sm" data-act="q:usedist">Use '+r.miles+' mi</button>';
  }
  else if(dist.err&&dist.errKey===k)h=esc(dist.err)+' Type the miles instead.'+btn+link;
  else h='Leave the address field and the distance fills itself in.'+btn;
  if(r&&dist.busy!==k&&String(d.miles||'').trim()===String(r.miles))h+=btn;
  if(r&&r.src==='osm')h+='<br><small>Distances from OpenStreetMap (© OpenStreetMap contributors).'+(r.note?' Google Maps: '+esc(r.note):'')+'</small>';
  if(r&&r.src==='google')h+='<br><small>Distances from Google Maps.</small>';
  el.innerHTML=h;
}

/* ---------- where distances come from ----------
   1. Google, through the Edge Function, once the Google key is set up (most accurate).
   2. Otherwise OpenStreetMap, free and with no setup: Nominatim (or Photon) finds each
      address, OSRM measures the drive. Addresses are looked up one at a time, a second
      apart, which is what those free services ask for.
   The claude.ai artifact can't reach any outside service, so it keeps the map link. */
function canFree(){return !window.TALLY_ARTIFACT&&typeof fetch==='function'}
function hasNativeGoogle(){try{return !!(window.TallyNative&&window.TallyNative.hasGoogle&&window.TallyNative.hasGoogle())}catch(e){return false}}
function canLookup(){return hasNativeGoogle()||!!window.tallyMaps||canFree()}
/* the Android app asks Google itself, with the key locked to this app */
var nativeWait={};
window.__tallyNativeDone=function(id,r){var f=nativeWait[id];if(f){delete nativeWait[id];f(r||{ok:false})}};
function nativeDistance(a,b){
  return new Promise(function(res){
    var id=uid();nativeWait[id]=res;
    setTimeout(function(){if(nativeWait[id]){delete nativeWait[id];res({ok:false,keyProblem:true,message:'Google Maps did not answer.'})}},25000);
    try{window.TallyNative.routeDistance(id,a,b)}catch(e){delete nativeWait[id];res({ok:false,keyProblem:true,message:'Google Maps is not available in this app.'})}
  });
}
function mapsDistance(a,b){
  if(hasNativeGoogle())return nativeDistance(a,b).then(function(r){
    if(r&&r.keyProblem){console.warn('Google Maps: '+r.message);return canFree()?freeDistance(a,b).then(function(x){if(x&&x.ok)x.note=r.message;return x}):r}
    return r;
  });
  if(window.tallyMaps&&window.tallyMaps.distance)return window.tallyMaps.distance(a,b).then(function(r){return r&&r.setup&&canFree()?freeDistance(a,b):r},function(){return canFree()?freeDistance(a,b):{ok:false,message:'Could not look up the drive.'}});
  return freeDistance(a,b);
}
var osm={geo:{},next:0};
function osmJson(url){return fetch(url,{headers:{'Accept':'application/json'}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function osmSlot(){var now=Date.now(),at=Math.max(now,osm.next);osm.next=at+1100;return new Promise(function(res){setTimeout(res,at-now)})}
function geocode(addr){
  var k=String(addr).trim().toLowerCase().replace(/\s+/g,' ');
  if(osm.geo[k])return osm.geo[k];
  var p=osmSlot().then(function(){return osmJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us,ca&q='+encodeURIComponent(addr))}).then(function(j){
    if(!j||!j[0])throw new Error('none');return {lat:+j[0].lat,lon:+j[0].lon};
  }).catch(function(){
    return osmSlot().then(function(){return osmJson('https://photon.komoot.io/api/?limit=1&q='+encodeURIComponent(addr))}).then(function(j){
      var f=j&&j.features&&j.features[0];if(!f)throw new Error('none');
      return {lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]};
    });
  });
  osm.geo[k]=p;p.catch(function(){delete osm.geo[k]});
  return p;
}
function freeDistance(a,b){
  if(!canFree())return Promise.resolve({ok:false,message:'Distance lookup is not available here.'});
  var ga,gb;
  return geocode(a).then(function(x){ga=x;return geocode(b)},function(){throw {where:a}}).then(function(y){gb=y},function(e){throw e&&e.where?e:{where:b}}).then(function(){
    return osmJson('https://router.project-osrm.org/route/v1/driving/'+ga.lon+','+ga.lat+';'+gb.lon+','+gb.lat+'?overview=false');
  }).then(function(j){
    var rt=j&&j.code==='Ok'&&j.routes&&j.routes[0];
    if(!rt)return {ok:false,message:'No driving route between those addresses. Check them.'};
    return {ok:true,src:'osm',miles:Math.round(rt.distance/1609.344*10)/10,minutes:Math.round(rt.duration/60)};
  }).catch(function(e){
    if(e&&e.where)return {ok:false,message:'Couldn’t find “'+e.where+'” on the map. Add the city and state.'};
    return {ok:false,message:'The map service didn’t answer. Check your connection.'};
  });
}

/* ---------- quote: the drive from the shop and back ----------
   Same lookup as pickup-to-delivery, for shop -> pickup and delivery -> shop. A leg the
   person typed is kept; the note then offers Google's number with a Use button. */
function fmtMi(x){x=Math.round(x*10)/10;return (Math.abs(x-Math.round(x))<0.05?Math.round(x):x).toLocaleString('en-US')}
function shopLegs(){
  var S=state.settings,d=state.draft,shop=(S.shopAddress||'').trim(),out=[];
  if(!shop)return out;
  if((d.from||'').trim())out.push({k:'out',f:'milesOut',a:shop,b:d.from.trim(),label:'From the shop to pickup'});
  if((d.to||'').trim())out.push({k:'back',f:'milesBack',a:d.to.trim(),b:shop,label:'Delivery back to the shop'});
  return out;
}
dist.shopBusy={};
function shopLookup(force){
  if(!canLookup()){renderShopNote();return}
  shopLegs().forEach(function(l){
    var k=distKey(l.a,l.b);
    if(force&&dist.cache[k]&&!(state.draft.shopManual||{})[l.k])delete dist.cache[k];
    if(force){state.draft.shopManual=Object.assign({},state.draft.shopManual);state.draft.shopManual[l.k]=false}
    if(dist.cache[k]){applyShop(l,dist.cache[k]);return}
    if(dist.shopBusy[k])return;
    dist.shopBusy[k]=1;renderShopNote();
    mapsDistance(l.a,l.b).then(function(r){
      delete dist.shopBusy[k];
      if(r&&r.ok&&r.miles>=0){r.key=k;dist.cache[k]=r;var now=shopLegs().find(function(x){return x.k===l.k&&distKey(x.a,x.b)===k});if(now)applyShop(now,r);else renderShopNote()}
      else{dist.shopErr=(r&&r.message)||'Could not look up the drive.';renderShopNote()}
    });
  });
  renderShopNote();
}
function applyShop(l,r){
  var d=state.draft,cur=String(d[l.f]||'').trim();
  if(!cur||!(d.shopManual||{})[l.k]){
    d[l.f]=String(r.miles);save();

  }

function shopTripUrl(){
  var S=state.settings,d=state.draft,shop=(S.shopAddress||'').trim(),a=(d.from||'').trim(),b=(d.to||'').trim();
  if(!shop||!a||!b)return '';
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(shop)+'&destination='+encodeURIComponent(shop)+'&waypoints='+encodeURIComponent(a+'|'+b)+'&travelmode=driving';
}
function renderShopNote(){
  var el=$('#shopNote');if(!el)return;
  var S=state.settings,d=state.draft,legs=shopLegs();
  if(!legs.length){el.innerHTML='Enter the addresses and the drive from and back to the shop fills itself in.';return}
  var rows=legs.map(function(l){

    return l.label+': '+(same?'<b>'+r.miles+' mi</b>, about '+fmtDur(r.minutes*60000)+' by car':'Google Maps says <b>'+r.miles+' mi</b> <button class="btn sm" data-act="q:useshop" data-k="'+l.k+'">Use '+r.miles+' mi</button>');
  }).filter(Boolean);

  else if(!rows.length&&dist.shopErr)h=esc(dist.shopErr)+' Type the miles instead.'+(url?' <a href="'+esc(url)+'" target="_blank" rel="noopener">See the whole trip on Google Maps</a>':'');
  if(total>0&&(num(d.milesOut)||num(d.milesBack)))h+=(h?'<br>':'')+'Round trip from the shop: <b>'+fmtMi(total)+' mi</b>'+(S.shopTravel===false?' (not counted in the price; see Setup › Rate card)':'');
  el.innerHTML=h;
}

/* ---------- job messages: each person confirms they will be there ----------
   A confirmation is tied to the job's day and start time, so moving the job asks again. */
function slotOf(j){return (j.d.moveDate||'')+' '+(j.d.time||'')}
function isConfirmed(j,n){var c=j.confirm&&j.confirm[n];return !!(c&&c.for===slotOf(j))}
function dropConfirm(j,n){if(j.confirm&&j.confirm[n]){j.confirm=Object.assign({},j.confirm);delete j.confirm[n]}}
// Options › Crew confirm their jobs: off, nobody is asked (and the office isn't told who hasn't)
function needsConfirm(j){return opt('confirm')&&j.status==='booked'&&!!j.d.moveDate&&j.d.moveDate>=todayISO()}
function relDay(s){var t=todayISO();if(s===t)return 'today';if(s===addDays(t,1))return 'tomorrow';return fmtDate(s)}
function jobMsgs(me){
  if(!me)return [];var t=todayISO();
  return state.jobs.filter(function(j){return (j.status==='booked'||j.status==='active')&&j.d.moveDate&&j.d.moveDate>=t&&j.assign.crew.indexOf(me)>=0})
    .sort(function(a,b){return slotOf(a)<slotOf(b)?-1:1});
}
function jobMsgsPending(me){return jobMsgs(me).filter(function(j){return needsConfirm(j)&&!isConfirmed(j,me)}).length}
function jobMsgCard(j,me){
  var rel=relDay(j.d.moveDate),c=j.confirm&&j.confirm[me],ok=isConfirmed(j,me),moved=!!c&&!ok,lead=leadOf(j);
  var others=j.assign.crew.filter(function(x){return x!==me&&x!==lead});   // the lead has their own line
  var head=j.status==='active'?'Happening now':rel==='today'?'Booked today':rel==='tomorrow'?'Booked for tomorrow':'Booked for '+rel;
  var when=(rel==='today'||rel==='tomorrow'?rel:'on '+rel)+' at '+fmtTime(j.d.time);
  var body=(moved?'The day or time changed. ':'')+'You’re on '+(j.d.name||'a job')+' '+when+'.\nPickup: '+(j.d.from||'not set yet')+
    (j.assign.truckId?'\n'+(jobTrucks(j).length>1?'Trucks: ':'Truck: ')+truckDrive(j,me,false):'')+(lead?'\n'+(lead===me?'You’re running it.':'Lead: '+lead):'')+
    (others.length?'\nWith: '+others.join(', '):'');
  var foot=j.status==='active'?'<div><span class="pill" data-s="active">In progress</span></div>'
    :!opt('confirm')?'<div><span class="pill" data-s="booked">Booked</span></div>'
    :ok?'<div class="row between"><span class="pill" data-s="done">Confirmed</span><small>'+fmtStamp(c.ts)+'</small></div>'
    :'<button class="btn primary bigbtn" data-act="jm:confirm" data-id="'+j.id+'" data-who="'+esc(me)+'">Confirm I’ll be there</button>';
  return '<div class="jmsg'+(needsConfirm(j)&&!ok?' need':'')+'"><div class="row between"><b>'+esc(head)+'</b><small>'+esc(fmtDate(j.d.moveDate))+'</small></div><div class="txt">'+esc(body)+'</div>'+foot+'</div>';
}
function jobMsgsRow(me){

/* ---------- card payments through Stripe (hosted edition) ----------
   window.tallyPay comes from the Supabase adapter. Without it (the artifact edition), or for a
   company that isn't turned on for payments, the payment screen stays the demo it always was.
   Card numbers never reach Tally: a pay link opens Stripe's own page, a typed card goes into
   Stripe's own card box, and a card on file is charged by the server. The server, not this
   screen, decides what is still owed. */
var STRIPE_JS='https://js.stripe.com/endive/stripe.js',MIN_PAY=50;

  conn:{busy:false,wait:false,url:'',msg:''},
  lastTest:(function(){try{return localStorage.getItem('tally.payTest')==='1'}catch(e){return false}})()};
function payOn(){return !!(window.tallyPay&&sync.mode==='shared'&&sync.identity.status==='ok'&&pay.cfg&&pay.cfg.ready)}
function payCardOn(){return payOn()&&!!pay.cfg.publishableKey}
// refresh: ask Stripe now how the company's own Stripe account stands (back from Stripe's sign-up)
function payLoad(force,refresh){
  if(!window.tallyPay||sync.mode!=='shared')return Promise.resolve(null);
  if(pay.cfg&&!force)return Promise.resolve(pay.cfg);
  if(pay.loading)return pay.loading;
  pay.cfgAt=Date.now();
  pay.loading=Promise.resolve(window.tallyPay.config(!!refresh)).then(function(c){pay.cfg=c&&c.ok?c:{ready:false,reason:'down'};
      if(pay.cfg.ready||pay.cfg.reason==='connect-off')pay.conn.wait=false;
      if(pay.cfg.ready){pay.lastTest=pay.cfg.test===true;try{localStorage.setItem('tally.payTest',pay.lastTest?'1':'0')}catch(e){}}},function(){pay.cfg={ready:false,reason:'down'}})
    .then(function(){pay.loading=null;if(ui.flow)renderFlow();if(ui.jobId)renderSheet();softSettings();return pay.cfg});
  return pay.loading;
}
// Cards kept on file through Stripe for this job's customer: kept on this job, or kept for the same phone
// number. (Without a phone, a card belongs to the job it was kept on: two customers can share a name.)
// A crew lead sees only cards kept on this job; the server allows no more. A card is picked for you only
// when it was kept on this job; any other one, check with the customer first.

  var cards=stripeCards(j),w=[];
  if(cards.length&&opt('payVault'))w.push('vault');
  if(opt('payLink'))w.push('link');

  return w;

  if(w.indexOf(m)>=0)return m;

  renderFlow();

/* ---------- the drive back to the shop, at bill-out ----------
   When the bill counts the drive from the shop, the crew lead is still at the customer's when the job is
   billed, before the drive back. So before the customer signs and pays, the lead puts the drive back in:
   a local move's minutes (to start with, the quote's estimate from the delivery to the shop), or a
   mileage move's miles so far plus the miles back. It goes on the bill (j.back), and can be changed from
   Bill out until the job is paid. The office's own hours or miles, or Bill at the quote, take over. */
function backApplies(j){
  var q=j.quote||{},fx=j.clockFix||{};
  if(!(q.kind==='local'||q.kind==='mileage')||!q.shopTravel||fx.off||j.status==='paid')return false;
  var c=clockBill(j);if(!c||c.missing)return false;
  return !(q.kind==='mileage'?c.setMi:c.setH);
}
function needsBack(j){var p=j.phases||{};return !j.back&&backApplies(j)&&(j.status==='done'||(j.status==='active'&&!!p.unloadEnd))}
function backInit(j){
  var q=j.quote||{},b=j.back||{};ui.flow.step='back';
  if(q.kind==='mileage'){
    // the odometer when the truck left the shop (from Start job) and now, plus the miles from here back
    // to the shop (looked up from the phone's location; the quote's to start with). No start reading:

    var rt=j&&j.code==='Ok'&&j.routes&&j.routes[0];

/* ---------- form upload (PDF or images become page images) ---------- */
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return new Promise(function(res,rej){
    var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=function(){if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)}else rej(new Error('pdf'))};
    sc.onerror=function(){rej(new Error('pdf'))};document.head.appendChild(sc);
  });
}
function pdfToPages(file){
  var fail=function(){return new Error('Could not read that PDF here. Upload it as photos or images instead, or paste the form text.')};
  return loadPdfJs().then(function(lib){return file.arrayBuffer().then(function(buf){return lib.getDocument({data:buf}).promise})}).then(function(pdf){
    var n=Math.min(pdf.numPages,8),out=[],chain=Promise.resolve();
    for(var i=1;i<=n;i++)(function(i){chain=chain.then(function(){return pdf.getPage(i).then(function(pg){
      var v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:1100/v0.width}),c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
      return pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise.then(function(){out.push(c.toDataURL('image/jpeg',0.7))});
    })})})(i);
    return chain.then(function(){return out});
  }).catch(function(){throw fail()});
}
function formPages(files){
  var list=Array.prototype.slice.call(files),out=[];
  return list.reduce(function(chain,f){return chain.then(function(){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))return pdfToPages(f).then(function(pg){out=out.concat(pg)});
    if(/^image\//.test(f.type))return shrink(f,1100).then(function(d){out.push(d)});
    throw new Error('Upload PDFs or images only.');
  })},Promise.resolve()).then(function(){if(!out.length)throw new Error('Nothing to read in that file.');return out.slice(0,8)});
}

/* ---------- card field formatting ---------- */
function fmtField(t,e){
  var del=!!(e&&e.inputType&&e.inputType.indexOf('delete')===0),raw=t.value,pos=t.selectionStart==null?raw.length:t.selectionStart;
  var atEnd=pos>=raw.length,before=raw.slice(0,pos).replace(/\D/g,'').length,d=raw.replace(/\D/g,''),out;
  if(t.id==='cardNum'){d=d.slice(0,19);out=d.replace(/(\d{4})(?=\d)/g,'$1-')}
  else{
    d=d.slice(0,4);
    if(d.length&&+d.charAt(0)>1){d='0'+d;d=d.slice(0,4);before++}
    out=d.length>=2?d.slice(0,2)+((d.length>2||!del)?'/':'')+d.slice(2):d;
  }
  if(out===raw)return;
  t.value=out;
  var np=out.length;

  try{t.setSelectionRange(np,np)}catch(x){}
}
