<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally: moving company software</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@400;500;700&family=Sora:wght@400;500;700&family=Lora:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --text:#141B2D; --muted:#667085; --bg:#F5F6F8; --card:#FFFFFF; --line:#E7EAF0; --line2:#F0F2F6;
  --header:#141B2D; --header-text:#F5F6F8; --field:#FFFFFF; --focus:#2563EB;
  --tape:#F5B700; --tape-edge:#D9A000; --tape-ink:#241A00;
  --ok:#16915C; --bad:#D0392B; --info:#2F6BC0; --warn:#E07A1F;
  --r:12px; --r2:9px; --rpill:99px; --bw:1px; --shadow:0 2px 8px rgba(16,24,40,.06); --shadow-lg:0 10px 40px rgba(10,15,28,.25);
  --w-strong:700; --w-mid:600;
  --fs:15px; --pad:12px 14px; --gapy:10px; --htt:none; --hls:.2px; --cardShadow:none; --tabFill:transparent;
  --tintA:14%; --tintB:20%;
  --accSoft:color-mix(in srgb, var(--tape) var(--tintA), transparent);
  --okSoft:color-mix(in srgb, var(--ok) var(--tintA), transparent);
  --badSoft:color-mix(in srgb, var(--bad) var(--tintA), transparent);
  --infoSoft:color-mix(in srgb, var(--info) var(--tintB), transparent);
  --warnSoft:color-mix(in srgb, var(--warn) var(--tintB), transparent);
  --paid:#0A7A3D; --paid-ink:#FFFFFF; --paidSoft:rgba(10,122,61,.15);
  --due:#B81C22; --due-ink:#FFFFFF; --dueSoft:rgba(184,28,34,.14);
  --focusRing:color-mix(in srgb, var(--focus) 26%, transparent);
  --hover:color-mix(in srgb, var(--text) 12%, var(--line));
  --scrim:color-mix(in srgb, #000 55%, transparent);
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{--paid:#2FD27A;--paid-ink:#04250F;--paidSoft:rgba(47,210,122,.18);--due:#FF6B60;--due-ink:#2A0603;--dueSoft:rgba(255,107,96,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:400 var(--fs)/1.45 var(--font);background:var(--bg);color:var(--text)}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:var(--w-strong);margin:0;line-height:1.15;letter-spacing:var(--hls);text-transform:var(--htt)}
h2{font-size:19px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
small{color:var(--muted)}
a{color:inherit}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.inline-sel{flex:1;min-width:0;min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--text);padding:6px 10px;font-size:15px}
.glabel{font:600 12px var(--font);color:var(--muted);margin:14px 2px 6px;letter-spacing:.2px}
#sheet .panel:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header and navigation */
.top{background:var(--header);color:var(--header-text);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.brand{font:700 24px/1 var(--display);letter-spacing:.6px}
.brand small{display:block;font:400 11px/1.2 var(--font);color:inherit;opacity:.65;margin-top:2px;letter-spacing:0}
.top select{background:transparent;color:inherit;border:1px solid color-mix(in srgb, var(--header-text) 32%, transparent);border-radius:8px;padding:4px 8px;font-size:13px;min-height:32px}
.top select option{color:#141B2D}
.tapebar{height:3px;background:var(--tape)}
.shell{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--muted);cursor:pointer;min-height:50px;position:relative;transition:color .15s}
nav.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--text);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--tabFill)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:2px;background:var(--tape);border-radius:0 0 2px 2px}
main{padding:10px 12px calc(70px + env(safe-area-inset-bottom));max-width:960px;margin:0 auto}

/* surfaces */
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--pad);margin:0 0 var(--gapy);box-shadow:var(--cardShadow)}
.card>h2{margin-bottom:8px}
.card>.sub{margin:-2px 0 8px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.span2{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.note{background:var(--accSoft);border:var(--bw) solid var(--tape-edge);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.empty{text-align:center;padding:22px 12px;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:4px;font-size:18px}

/* form controls */
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{background:var(--field);border:var(--bw) solid var(--line);border-radius:var(--r2);padding:8px 10px;font-size:16px;color:var(--text);min-height:42px;width:100%;transition:border-color .12s,box-shadow .12s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--focusRing)}
.f textarea{min-height:64px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px;color:var(--text)}
.check input{width:20px;height:20px;accent-color:var(--tape)}
.btn{border:var(--bw) solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r2);padding:8px 14px;min-height:40px;font-weight:var(--w-mid);font-size:14.5px;cursor:pointer;transition:background .12s,border-color .12s,transform .06s,filter .12s}
.btn:hover{border-color:var(--hover)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--tape);border-color:var(--tape-edge);color:var(--tape-ink)}
.btn.primary:hover{filter:brightness(.97)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:var(--bw) solid var(--line);background:var(--card);color:var(--text);border-radius:var(--rpill);padding:4px 12px;min-height:30px;font-size:13px;cursor:pointer;transition:background .12s,color .12s}
.chip.on{background:var(--text);color:var(--card);border-color:var(--text)}
.chip small{color:inherit;opacity:.7}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}
.pill{display:inline-block;padding:1px 8px;border-radius:var(--rpill);font-size:11.5px;font-weight:600;background:var(--line2);color:var(--text);white-space:nowrap;line-height:1.65}
.pill[data-s=lead]{color:var(--text)}
.pill[data-s=quoted]{background:var(--infoSoft);color:var(--text)}
.pill[data-s=booked]{background:var(--tape);color:var(--tape-ink)}
.pill[data-s=active]{background:var(--warnSoft);color:var(--text)}
.pill[data-s=done]{background:var(--okSoft);color:var(--text)}
.pill[data-s=paid]{background:var(--paid)!important;color:var(--paid-ink)!important;border-color:var(--paid)!important}
.pill.bad,.pill.due{background:var(--dueSoft)!important;color:var(--due)!important;border-color:var(--due)!important}
.money-paid{color:var(--paid)!important;font-weight:var(--w-mid)}
.money-due{color:var(--due)!important;font-weight:var(--w-mid)}
.kpi.paid b,.pulse button.paid b,.flow-body .kpi.paid b{color:var(--paid)!important;-webkit-text-fill-color:var(--paid)!important;background:none!important}
.kpi.due b,.pulse button.due b,.flow-body .kpi.due b{color:var(--due)!important;-webkit-text-fill-color:var(--due)!important;background:none!important}
.alert .ic.bad{background:var(--dueSoft);color:var(--due)}
.alert .ic.ok{background:var(--paidSoft);color:var(--paid)}
.pill[data-s=lost]{background:transparent;border:1px solid var(--muted);color:var(--text)}
.pill.bad{background:var(--badSoft);color:var(--bad)}
.pill.warn{background:var(--warnSoft)}

/* collapsible sections */
details.acc{border-top:1px solid var(--line2)}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 0;font-weight:600;font-size:14.5px;cursor:pointer;min-height:42px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-3px 4px 0 2px;transition:transform .18s;flex:none}
details.acc[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
details.acc>summary>span{flex:1;min-width:0}
details.acc>summary small{font-weight:400;font-size:12.5px}
.acc-body{padding:0 0 12px}
details.acc.card{padding:0 14px;margin:0 0 8px}
details.acc.card>summary{font:700 17px var(--display);padding:10px 0;min-height:46px}
details.acc.card .acc-body{padding-bottom:14px}
.grp{border-top:1px solid var(--line2);padding:0}
.grp>summary{cursor:pointer;padding:9px 0;font:700 16px var(--display);list-style:none;display:flex;justify-content:space-between;min-height:42px;align-items:center}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"+";font-size:20px;color:var(--muted);font-weight:400}
.grp[open]>summary::after{content:"−"}

/* quote */
.hero{padding:10px 14px 12px}
.truck{width:100%;height:auto;display:block;max-height:76px;margin:0 auto}
.truck .tbox{fill:none;stroke:var(--text);stroke-width:2}
.truck .cell{fill:transparent;stroke:var(--line);stroke-width:1}
.truck .cell.on{fill:var(--tape);stroke:var(--tape-edge)}
.truck .tcab,.truck .tchas{fill:var(--text)}
.truck .twin{fill:var(--card)}
.truck .twheel circle{fill:var(--text);stroke:var(--card);stroke-width:3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stat{min-width:0}
.stat b{display:block;font:700 20px/1.05 var(--display)}
.stat span{font-size:11.5px;color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line2)}
.item[hidden]{display:none}
.item b{font-weight:500}
.item small{display:block;font-size:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:24px;text-align:center;font-weight:600}
.stepper .btn{width:36px;padding:0}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:5px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.lines td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lines tr.total td{font:700 22px var(--display);border-bottom:0;padding-top:8px}
.qbar{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));z-index:10;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg)}
.qbar .tot{font:700 22px/1 var(--display)}
.qbar small{display:block;font-size:12px;white-space:nowrap}

/* job lists, dispatch */
.job{display:block;width:100%;text-align:left;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:8px;cursor:pointer;box-shadow:var(--cardShadow);transition:border-color .12s,box-shadow .12s,transform .06s}
.job:active{transform:scale(.995)}
.job:hover{border-color:var(--hover);box-shadow:var(--shadow)}
.job .t{font:700 17px/1.15 var(--display)}
.job .r{font:700 17px/1.15 var(--display);text-align:right}
.job .route{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 6px}
.week{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.week>*{min-width:0}
.day.slim{padding:9px 12px}
.day.slim h3{font-size:15px}
.day{min-width:0;overflow:hidden;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--cardShadow)}
.day.today{border-color:var(--tape-edge);box-shadow:inset 0 2px 0 var(--tape)}
.day h3{margin-bottom:1px}
.day .cap{font-size:12px;color:var(--muted);margin-bottom:6px}
.block{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--tape);background:var(--bg);border-radius:9px;padding:7px 9px;margin-bottom:6px;cursor:pointer;transition:border-color .12s}
.block.tent{border-left-style:dashed;border-left-color:var(--info)}
.block.clash{border-left-color:var(--bad)}
.block .tm{font-weight:600;font-size:14px}
.block small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.who{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)}
.who:first-child{border-top:0}

/* reports */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--cardShadow)}
.kpi b{display:block;font:700 22px/1.05 var(--display)}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;overflow-x:auto;padding-top:8px}
.bar{flex:0 0 44px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--tape);border-radius:5px 5px 0 0;min-height:2px}
.bar em{font-style:normal;color:var(--text);font-weight:600;font-size:11px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{font-weight:600;text-align:left;color:var(--muted);font-size:12px;padding:3px 6px 3px 0}
table.tbl td{padding:6px 6px 6px 0;border-top:1px solid var(--line2)}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}

/* job sheet */
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:40}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;background:var(--bg);border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
#sheet .panel::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 14px 10px;background:transparent;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:21px}
.sheet-body{overflow-y:auto;padding:8px 14px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sec{margin:0 0 10px}
.sec>h3{margin-bottom:6px}
.sheet-body details.acc{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:0 12px;margin:0 0 8px}
.sheet-body details.acc>summary{font:700 16px var(--display);min-height:44px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos figure{margin:0;width:88px}
.photos img{width:88px;height:88px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
.photos figcaption{font-size:11px;color:var(--muted)}
.phold{width:88px;height:88px;border:1px dashed var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center}
.tally-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line2)}
.tally-row>span:first-child{flex:1;min-width:0}
.tally-row .row{flex-wrap:nowrap;flex:none;gap:6px}
.tally-row .btn{min-width:44px}
.tally-row .btn.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));background:var(--text);color:var(--card);padding:9px 16px;border-radius:99px;font-size:13.5px;z-index:60;max-width:90vw;box-shadow:var(--shadow-lg)}
.toast[hidden]{display:none}

/* crew view */
.crewcard{padding:12px 14px}
.cc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cc-head h3{font-size:20px}
.cc-sub{color:var(--muted);font-size:13px;margin-top:2px}
.cc-route{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.cc-route small{display:block;font-size:11.5px}
.cc-route a{font-size:14px;font-weight:500;overflow-wrap:anywhere;text-decoration:none;border-bottom:1px solid var(--line)}
.cc-actions{display:flex;gap:8px;margin:2px 0 6px}
.cc-actions .btn{flex:1;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.crewcard .big{min-height:44px;font-size:16px;flex:2}
.crewcard a{font-weight:600}
textarea.code{width:100%;min-height:110px;font:12.5px/1.35 ui-monospace,Menlo,Consolas,monospace;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px;color:var(--text)}
.clock{border-left:3px solid var(--tape)}
.clock.on{border-left-color:var(--ok)}
.clock .elapsed{font:700 30px/1 var(--display)}
.clock textarea{width:100%;min-height:52px;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:16px;margin-top:6px;color:var(--text)}
.clock textarea.need{border-color:var(--bad);box-shadow:0 0 0 3px var(--badSoft)}

/* signing and payment overlay */
#flow{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#flow[hidden]{display:none}
.flow-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--header);color:var(--header-text);border-bottom:3px solid var(--tape)}
.flow-head small{color:inherit;opacity:.7}
.flow-head .btn{background:transparent;color:inherit;border-color:color-mix(in srgb, var(--header-text) 38%, transparent)}
.flow-body{overflow-y:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;width:100%}
.formbox{background:#fff;color:#141a26;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:44vh;overflow:auto;margin:10px 0}
.formbox img{width:100%;display:block;margin-bottom:8px}
.formtext{white-space:pre-wrap;font-size:15px;line-height:1.55}
.sigpad{width:100%;height:150px;background:#fff;border:2px dashed var(--muted);border-radius:10px;touch-action:none;display:block;margin:6px 0 10px}
.bigbtn{width:100%;min-height:48px;font-size:16px;margin-top:8px}
.methods{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pick{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;min-height:46px}
.pick input{width:20px;height:20px;accent-color:var(--tape)}

/* chat */

  ensureChannel();
  var w=watchers[key]||(watchers[key]={run:run,t:null,n:0});
  w.run=run;w.n++;run();
  return function(){w.n--;if(w.n<=0){clearTimeout(w.t);delete watchers[key]}};
}

/* ---------- queries ---------- */
function build(collection,filters,order,lim){
  var q=sb.from('docs').select('doc_id,data,collection').eq('org_id',ORG).eq('collection',collection);
  filters.forEach(function(f){
    var col="data->>'"+f[0]+"'";
    if(f[1]==='==')q=q.filter(col,'eq',String(f[2]));
    else if(f[1]==='<')q=q.filter("data->"+f[0],'lt',f[2]);
    else if(f[1]==='>')q=q.filter("data->"+f[0],'gt',f[2]);
  });
  if(order)q=q.order("data->"+order[0],{ascending:order[1]!=='desc'});
  if(lim)q=q.limit(lim);
  return q;
}
function collectionRef(collection){
  function make(filters,order,lim){
    var api={
      where:function(f,op,v){return make(filters.concat([[f,op,v]]),order,lim)},
      orderBy:function(f,dir){return make(filters,[f,dir||'asc'],lim)},
      limit:function(n){return make(filters,order,n)},
      get:function(){
        if(collection==='users')return sb.from('members').select('*').eq('org_id',ORG).then(function(r){return snapMany((r.data||[]).map(function(m){return {doc_id:m.user_id,data:membersToDoc(m)}}))});
        if(collection==='requests')return sb.from('access_requests').select('*').eq('org_id',ORG).then(function(r){return snapMany((r.data||[]).map(function(x){return {doc_id:x.user_id,data:reqToDoc(x)}}))});
        return build(collection,filters,order,lim).then(function(r){if(r.error)throw r.error;return snapMany(r.data||[])});
      },
      onSnapshot:function(next,err){
        var key=collection+'|'+JSON.stringify([filters,order,lim]);
        return watch(key,function(){api.get().then(next).catch(function(e){if(err)err(e)})});
      },
      doc:function(id){return docRef(collection+'/'+id)}
    };
    return api;
  }
  return make([],null,null);
}
function docRef(path){
  var parts=split(path),collection=parts[0],id=parts[1];
  function readOne(){
    if(collection==='users')return sb.from('members').select('*').eq('org_id',ORG).eq('user_id',id).maybeSingle().then(function(r){return snapOne(path,r.data?{data:membersToDoc(r.data)}:null)});
    if(collection==='requests')return sb.from('access_requests').select('*').eq('org_id',ORG).eq('user_id',id).maybeSingle().then(function(r){return snapOne(path,r.data?{data:reqToDoc(r.data)}:null)});
    return sb.from('docs').select('data').eq('org_id',ORG).eq('path',path).maybeSingle().then(function(r){if(r.error)throw r.error;return snapOne(path,r.data)});
  }
  return {
    id:id,path:path,
    get:readOne,
    set:function(obj){
      if(collection==='users')return sb.from('members').upsert({org_id:ORG,user_id:id,email:obj.email||'',staff:obj.staff||'',role:obj.role||'crew',ts:obj.ts||Date.now()}).then(chk);
      if(collection==='requests')return sb.from('access_requests').upsert({org_id:ORG,user_id:id,email:obj.email||me.email,ts:obj.ts||Date.now()}).then(chk);
      return sb.from('docs').upsert({org_id:ORG,path:path,collection:collection,doc_id:id,data:obj,updated_at:new Date().toISOString()}).then(chk);
    },
    update:function(patch){
      if(collection==='users')return sb.from('members').update(patch).eq('org_id',ORG).eq('user_id',id).then(chk);
      return readOne().then(function(s){
        if(!s.exists)throw new Error('missing');
        var merged=deepMerge(s.data(),patch);
        return sb.from('docs').upsert({org_id:ORG,path:path,collection:collection,doc_id:id,data:merged,updated_at:new Date().toISOString()}).then(chk);
      });
    },
    delete:function(){
      if(collection==='users')return sb.from('members').delete().eq('org_id',ORG).eq('user_id',id).then(chk);
      if(collection==='requests')return sb.from('access_requests').delete().eq('org_id',ORG).eq('user_id',id).then(chk);
      return sb.from('docs').delete().eq('org_id',ORG).eq('path',path).then(chk);
    },
    onSnapshot:function(next,err){
      var key=collection+'|doc|'+id;
      return watch(key,function(){readOne().then(next).catch(function(e){if(err)err(e)})});
    }
  };
}
function chk(r){if(r&&r.error)throw r.error;return r}

/* ---------- the sign-in screen ---------- */
var el=null,state={step:'email',email:'',busy:false,msg:''};
function css(){

  '#login label{display:block;font-size:12px;opacity:.7;margin-bottom:4px}'+

  '#login input.code{letter-spacing:8px;text-align:center;font-size:22px}'+

  '#login button.link{background:none;border:0;color:inherit;opacity:.7;font-weight:500;font-size:14px;min-height:36px;text-decoration:underline}'+
  '#login button.org{display:block;text-align:left;background:transparent;color:inherit;border:1px solid #E7EAF0;font-weight:600;margin-top:8px;padding:10px 12px}#login button.org small{display:block;font-weight:400;opacity:.7;font-size:13px}'+
  '#login .msg{margin-top:10px;font-size:13.5px;min-height:18px}#login .msg.bad{color:#C62026}#login .msg.ok{color:#0A7A3D}';
  document.head.appendChild(s);
}
function render(){
  css();
  if(!el){el=document.createElement('div');el.id='login';document.body.appendChild(el)}
  var b=state.busy;
  el.innerHTML='<div class="box"><h1>Tally</h1>'+(state.step==='email'
    ? '<p>Sign in with your work email. We will send you a 6-digit code.</p>'+
      '<label for="lgEmail">Work email</label><input id="lgEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" value="'+(state.email||'')+'">'+
      '<button id="lgSend"'+(b?' disabled':'')+'>'+(b?'Sending…':'Send my code')+'</button>'
    : '<p>We sent a code to <b>'+state.email.replace(/[<>&]/g,'')+'</b>. It is good for a few minutes.</p>'+
      '<label for="lgCode">Code from the email</label><input id="lgCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10">'+
      '<button id="lgVerify"'+(b?' disabled':'')+'>'+(b?'Checking…':'Sign in')+'</button>'+
      '<button class="link" id="lgBack">Use a different email</button>')+
    '<div class="msg '+(state.msgKind||'')+'">'+(state.msg||'')+'</div></div>';
  var f=el.querySelector('#lgEmail')||el.querySelector('#lgCode');if(f)setTimeout(function(){try{f.focus()}catch(e){}},30);
  var send=el.querySelector('#lgSend'),ver=el.querySelector('#lgVerify'),back=el.querySelector('#lgBack');
  if(send)send.onclick=sendCode;
  if(ver)ver.onclick=verify;
  if(back)back.onclick=function(){state.step='email';state.msg='';render()};
  el.querySelectorAll('input').forEach(function(i){i.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();(send||ver).click()}}});
}
function msg(t,kind){state.msg=t;state.msgKind=kind||'';state.busy=false;render()}
function sendCode(){
  var v=(el.querySelector('#lgEmail').value||'').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return msg('That does not look like an email address.','bad');
  state.email=v;state.busy=true;state.msg='';render();
  sb.auth.signInWithOtp({email:v,options:{shouldCreateUser:true}}).then(function(r){
    if(r.error)return msg(r.error.message||'Could not send the code. Try again.','bad');
    state.step='code';msg('Code sent. Check your inbox, and your spam folder.','ok');
  }).catch(function(){msg('Could not reach the server. Check your connection.','bad')});
}
function verify(){
  var code=(el.querySelector('#lgCode').value||'').replace(/\D/g,'');
  if(code.length<6||code.length>10)return msg('Enter the code from the email.','bad');
  state.busy=true;state.msg='';render();
  sb.auth.verifyOtp({email:state.email,token:code,type:'email'}).then(function(r){
    if(r.error)return msg('That code did not work. Check it, or send a new one.','bad');
  }).catch(function(){msg('Could not sign you in. Try again.','bad')});
}
function hideLoginOnly(){if(el){el.remove();el=null}}
function hideLogin(){if(el){el.remove();el=null}document.documentElement.classList.remove('pre-auth')}
function showLogin(){document.documentElement.classList.add('pre-auth');state.step='email';state.busy=false;state.msg='';render()}

  css();

  var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

      '<label for="pkName">Company name</label><input id="pkName" autocomplete="organization">'+
      '<button id="pkCreate"'+(pick.busy?' disabled':'')+'>'+(pick.busy?'Creating…':'Create company')+'</button><button class="link" id="pkBack">Back</button>';
  }else{
    body='<h1>Join a company</h1><p>Ask the owner for their 6-character company code.</p>'+
      '<label for="pkCode">Company code</label><input id="pkCode" class="code" autocapitalize="characters" maxlength="6" autocomplete="off">'+
      '<button id="pkSend"'+(pick.busy?' disabled':'')+'>'+(pick.busy?'Sending…':'Ask to join')+'</button><button class="link" id="pkBack">Back</button>';
  }
  el.innerHTML='<div class="box">'+body+'<div class="msg '+(pick.kind||'')+'">'+esc(pick.msg||'')+'</div></div>';
  var q=function(s){return el.querySelector(s)};
  el.querySelectorAll('[data-org]').forEach(function(b){b.onclick=function(){useOrg(b.getAttribute('data-org'))}});
  if(q('#pkNew'))q('#pkNew').onclick=function(){pick.mode='new';pick.msg='';renderPicker()};
  if(q('#pkJoin'))q('#pkJoin').onclick=function(){pick.mode='join';pick.msg='';renderPicker()};
  if(q('#pkBack'))q('#pkBack').onclick=function(){pick.mode='list';pick.msg='';renderPicker()};
  if(q('#pkOut'))q('#pkOut').onclick=function(){sb.auth.signOut().then(function(){try{localStorage.removeItem(ORG_KEY)}catch(e){}reload()})};
  if(q('#pkCreate'))q('#pkCreate').onclick=function(){
    var n=(q('#pkName').value||'').trim();if(!n){pick.msg='Give the company a name.';pick.kind='bad';return renderPicker()}
    pick.busy=true;renderPicker();
    sb.rpc('create_org',{company:n}).then(function(r){pick.busy=false;

  return sb.rpc('my_orgs').then(function(r){pick.orgs=r.data||[];return pick.orgs}).catch(function(){pick.orgs=[];return []}).then(function(list){renderPicker();return list});

/* ---------- boot ---------- */
function onSession(session){
  if(!session||!session.user){me={id:'',email:'',role:'',staff:'',isOwner:false,canEdit:false};showLogin();return}
  me.id=session.user.id;me.email=session.user.email||'';
  if(window.__tallyBooted){reload();return}   // a different person signed in on this device: start clean
  // a profile the owner set up with this email links now, so the person walks straight in
  sb.rpc('claim_invites').then(function(){},function(){}).then(function(){return sb.rpc('my_orgs')}).then(function(r){
    var list=r.data||[],hit=list.filter(function(o){return o.id===ORG})[0],ready=list.filter(function(o){return !o.pending});
    if(!hit&&!ORG&&ready.length===1){useOrg(ready[0].id);return}
    if(!hit){pick.orgs=list;pick.mode='list';pick.msg='';hideLoginOnly();renderPicker();return}
    window.tallyOrg={id:hit.id,name:hit.name,role:hit.role,join_code:hit.join_code,pending:hit.pending,plan:hit.plan};
    hideLogin();
    return Promise.all([refreshMe(),commsApi.refresh()]).then(function(){window.__tallyBooted=true;readyGo()});
  }).catch(function(){hideLoginOnly();renderPicker()});
}

    var s=r&&r.data&&r.data.session;if(!s)return {ok:false,message:'Sign in again.'};
    return fetch(CFG.url.replace(/\/+$/,'')+'/functions/v1/tally-twilio/app',{method:'POST',keepalive:true,
      headers:{'Content-Type':'application/json',apikey:CFG.anonKey,Authorization:'Bearer '+s.access_token},
      body:JSON.stringify(Object.assign({org:ORG},body))}).then(function(res){return res.json().catch(function(){return {ok:false,message:'The texting service did not answer.'}})});
  }).catch(function(){return {ok:false,message:'Could not reach the texting service. Check your connection.'}});
}

function filterItems(txt){
  txt=txt.trim().toLowerCase();
  $$('#qGroups .grp').forEach(function(g){
    var any=false;
    $$('.item',g).forEach(function(it){var m=!txt||it.dataset.name.indexOf(txt)>=0;it.hidden=!m;if(m)any=true});

function saveQuote(kind){
  var d=state.draft,S=state.settings;
  if(!d.name.trim()){toast('Add the customer name first.');var n=$('[data-d=name]');if(n)n.focus();return}
  var q=calc(d,S);
  if(kind==='book'&&!q.cf){toast('Add at least one item before booking.');return}
  var j=d.editId?byId(d.editId):null;
  if(j){
    j.d=clone(d);delete j.d.editId;j.quote=q;j.items=itemsOf(d,S);logEv(j,'Quote updated');
    if(kind==='book'&&(j.status==='lead'||j.status==='quoted'))setStatus(j,'booked');
    else if(j.status==='lead'&&q.cf)setStatus(j,'quoted');
  }else{
    var s=kind==='book'?'booked':(q.cf?'quoted':'lead');
    j=newJob(d,S,s);logEv(j,'Created as '+LABEL[s]);state.jobs.push(j);
  }
  state.draft=blankDraft();ui.qstep=1;save();ui.tab='jobs';ui.filter='all';render();openJob(j.id);
  toast(kind==='book'?'Job booked. Add a date, truck and crew.':'Saved.');

/* ---------- DISPATCH ---------- */
function renderDispatch(){
  var v=$('#view'),S=state.settings,t=todayISO();
  if(!ui.day||ui.day<ui.weekStart||ui.day>addDays(ui.weekStart,6))ui.day=(t>=ui.weekStart&&t<=addDays(ui.weekStart,6))?t:ui.weekStart;
  var days=[0,1,2,3,4,5,6].map(function(i){return addDays(ui.weekStart,i)});
  var vis=['quoted','booked','active','done','paid'];
  var onDay=function(day){return state.jobs.filter(function(j){return j.d.moveDate===day&&vis.indexOf(j.status)>=0})};
  var strip='<div class="daystrip">'+days.map(function(day){
    var n=onDay(day).length,dt=parseISO(day);
    return '<button class="dpill'+(day===ui.day?' on':'')+'" data-act="day" data-d="'+day+'"><small>'+dt.toLocaleDateString('en-US',{weekday:'short'})+'</small><b>'+dt.getDate()+'</b>'+(n?'<i class="n"></i>':'<i class="n" style="background:transparent"></i>')+'</button>'}).join('')+'</div>';
  var need=state.jobs.filter(needsSched);
  var needHtml=need.length?'<details class="acc card" data-k="d:need"'+(ui.open['d:need']===false?'':' open')+'><summary><span>Needs scheduling</span><small>'+need.length+'</small></summary><div class="acc-body">'+need.map(function(j){
    var miss=[];if(!j.d.moveDate)miss.push('date');if(!j.assign.truckId)miss.push('truck');if(!j.assign.crew.length)miss.push('crew');else if(!j.assign.crew.some(canRun))miss.push('someone to run it');
    var tOpts='<option value="">Choose a truck</option>'+S.trucks.map(function(x){return '<option value="'+x.id+'"'+(j.assign.truckId===x.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('');
    var chips=assignable().map(function(n){var on=j.assign.crew.indexOf(n)>=0;return '<button class="chip'+(on?' on':'')+'" data-act="dq:crew" data-id="'+j.id+'" data-n="'+esc(n)+'" aria-pressed="'+on+'">'+esc(n)+whoTag(n)+'</button>'}).join('');
    return '<div class="who" style="display:block;padding:10px 0"><div class="row between"><b>'+esc(j.d.name)+'</b><button class="btn sm ghost" data-act="job:open" data-id="'+j.id+'">Details</button></div><small>Missing '+miss.join(', ')+'</small>'+
      '<div class="grid2" style="margin-top:6px"><input type="date" class="inline-sel" aria-label="Date for '+esc(j.d.name)+'" data-dq="moveDate" data-id="'+j.id+'" value="'+esc(j.d.moveDate)+'"><input type="time" class="inline-sel" aria-label="Start time for '+esc(j.d.name)+'" data-dq="time" data-id="'+j.id+'" value="'+esc(j.d.time)+'"></div>'+
      '<select class="inline-sel" style="width:100%;margin-top:6px" aria-label="Truck for '+esc(j.d.name)+'" data-dq="truckId" data-id="'+j.id+'">'+tOpts+'</select>'+
      '<div class="scrollx" style="margin-top:6px">'+chips+'</div></div>'}).join('')+'</div></details>':'';
  var jobs=onDay(ui.day).sort(function(a,b){return startMin(a)-startMin(b)});
  var block=function(j){
    var cf=conflictsFor(j).length;
    return '<button class="block'+(j.status==='quoted'?' tent':'')+(cf?' clash':'')+'" data-act="job:open" data-id="'+j.id+'"><span class="tm">'+fmtTime(j.d.time)+' · '+esc(j.d.name)+(j.test?' · test':'')+'</span><small>'+esc((j.d.from||'?')+' → '+(j.d.to||'?'))+'</small><small>'+(j.assign.crew.length?esc(j.assign.crew.join(', ')):'No crew')+' · '+(j.quote.hours||3)+' h'+(needsConfirm(j)&&j.assign.crew.length?' · '+j.assign.crew.filter(function(c){return isConfirmed(j,c)}).length+'/'+j.assign.crew.length+' confirmed':'')+'</small><span>'+pill(j.status)+(cf?' <span class="pill bad">Double-booked</span>':'')+'</span></button>'};
  var used={},crewUsed={};
  jobs.forEach(function(j){if(j.assign.truckId)used[j.assign.truckId]=1;j.assign.crew.forEach(function(c){crewUsed[c]=1})});
  var lanes=S.trucks.map(function(tr){
    var mine=jobs.filter(function(j){return j.assign.truckId===tr.id});
    var hrs=mine.reduce(function(a,j){return a+(j.quote.hours||3)},0);
    return '<div class="lane'+(mine.length?'':' free')+'"><div class="lh"><b>'+esc(tr.name)+'</b><small>'+(mine.length?mine.length+' job'+(mine.length===1?'':'s')+' · '+hrs+' h':'free all day')+'</small></div>'+
      (mine.map(block).join('')||'<small>Nothing on this truck.</small>')+'</div>'}).join('');
  var loose=jobs.filter(function(j){return !j.assign.truckId||!S.trucks.some(function(x){return x.id===j.assign.truckId})});
  var looseHtml=loose.length?'<div class="lane"><div class="lh"><b>No truck yet</b><small>'+loose.length+'</small></div>'+loose.map(block).join('')+'</div>':'';
  var free=S.crew.filter(function(n){return !crewUsed[n]});
  var officeOn=(S.office||[]).map(function(o){return o.name}).filter(function(n){return crewUsed[n]});
  var dt=parseISO(ui.day);
  var head='<div class="row between" style="margin:2px 0 8px"><h2>'+esc(dt.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}))+'</h2><div class="row"><button class="btn sm" data-act="wk" data-n="-7" aria-label="Previous week">←</button><button class="btn sm" data-act="wk" data-n="0">Today</button><button class="btn sm" data-act="wk" data-n="7" aria-label="Next week">→</button></div></div>';
  var cap='<p class="hint" style="margin:0 2px 10px">'+S.crew.filter(function(n){return crewUsed[n]}).length+' of '+S.crew.length+' crew working'+(officeOn.length?' · plus '+esc(officeOn.join(', ')):'')+(free.length?' · free: '+esc(free.join(', ')):'')+'</p>';
  v.innerHTML=strip+head+cap+needHtml+locCard()+(jobs.length?looseHtml+lanes:'<div class="card empty"><h3>Nothing scheduled</h3><p>Pick another day, or book a job from a quote.</p></div>'+looseHtml+lanes);
  var on=$('.dpill.on',v);if(on&&on.scrollIntoView)try{on.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
}

/* ---------- CREW ---------- */
function renderCrew(){
  var v=$('#view'),S=state.settings,role=state.ui.role;
  var roster=fieldRoster();
  var me=fieldMe();
  var t=todayISO();
  var picker='<label class="row" style="margin-bottom:8px;gap:8px;flex-wrap:nowrap;font-size:13px;color:var(--muted)"><span>Working as</span><select id="meSel" class="inline-sel">'+roster.map(function(n){return '<option value="'+esc(n)+'"'+(n===me?' selected':'')+'>'+esc(n)+(role==='owner'||role==='dispatch'?whoTag(n):'')+'</option>'}).join('')+'</select></label>';
  if(!me){v.innerHTML='<div class="card empty"><h3>No one here yet</h3><p>Add '+(role==='lead'?'crew leads':'crew members')+' in Setup.</p></div>';return}
  var asLead=role==='owner'||role==='dispatch'||(role==='lead'&&isLead(me));
  var mine=state.jobs.filter(function(j){return ['booked','active'].indexOf(j.status)>=0&&j.assign.crew.indexOf(me)>=0}).sort(function(a,b){return ((a.d.moveDate||'9999')+a.d.time)<((b.d.moveDate||'9999')+b.d.time)?-1:1});
  var billJobs=asLead?state.jobs.filter(function(j){return j.status==='done'&&j.assign.crew.indexOf(me)>=0&&(balOf(j)>0||formsPending(j).length>0)}):[];
  var since=Date.now()-60*864e5;
  var sinceDay=iso(new Date(since));
  var pastJobs=state.jobs.filter(function(j){
    if(['done','paid'].indexOf(j.status)<0)return false;
    if(j.assign.crew.indexOf(me)<0)return false;
    if(billJobs.indexOf(j)>=0)return false;
    return j.finishedAt?j.finishedAt>since:(j.d.moveDate||'')>=sinceDay;
  }).sort(function(a,b){return (b.finishedAt||0)-(a.finishedAt||0)});
  function clockCard(){
    var sh=openShift(me);
    if(!sh){
      return '<section class="card clock"><h2>Time clock</h2><p class="sub">Separate from the job timer. Location is shared only while you are clocked in.</p><div class="row"><select id="clkAct" class="grow" aria-label="What are you working on" style="min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--field)">'+S.activities.map(function(a){return '<option>'+esc(a)+'</option>'}).join('')+'</select><button class="btn primary" data-act="clk:in" data-who="'+esc(me)+'">Clock in</button></div></section>';
    }
    var li=lateInfo(me,Date.now()),hint='';
    if(li)hint=li.needNote?'Your last job ended at '+fmtClock(li.end)+', '+fmtDur(li.lateMs)+' ago. Add a note to clock out.':'Your last job ended at '+fmtClock(li.end)+'. Clocking out more than '+S.lateMins+' min after that needs a note.';
    return '<section class="card clock on"><div class="row between"><h2>On the clock</h2><span class="pill" data-s="done">'+esc(sh.activity)+'</span></div><div class="elapsed" id="clkElapsed" data-since="'+sh.inAt+'">'+fmtDur(Date.now()-sh.inAt)+'</div><small>Since '+fmtClock(sh.inAt)+'</small>'+
      '<p class="hint" id="geoLine">'+esc(geoText())+'</p>'+
      (hint?'<p class="hint">'+esc(hint)+'</p>':'')+
      '<textarea id="clockNote" class="'+(ui.needNote||(li&&li.needNote)?'need':'')+'" placeholder="'+(li&&li.needNote?'Note (required): why the late clock-out?':'Note (optional)')+'" aria-label="Clock-out note">'+esc(ui.clockNote||'')+'</textarea>'+
      '<button class="btn primary big" style="width:100%;min-height:56px;font-size:18px;margin-top:8px" data-act="clk:out" data-who="'+esc(me)+'">Clock out</button></section>';
  }
  function billPanel(j){
    var bal=balOf(j),pend=formsPending(j),req=formsRequired();
    var extras=(j.extras||[]).map(function(e){return '<tr><td>'+esc(e.label)+'</td><td>'+(e.amt<0?'−':'')+money(Math.abs(e.amt))+'</td></tr>'}).join('');
    return '<div><table class="lines"><tr><td>Quote</td><td>'+money(j.quote.total)+'</td></tr>'+matRows(j)+extras+'<tr><td>Paid so far</td><td class="money-paid">'+money(paidOf(j))+'</td></tr><tr class="total"><td>Balance</td><td class="'+(bal>0?'money-due':'money-paid')+'">'+money(bal)+'</td></tr></table>'+
      '<div class="grid2 stack" style="margin-top:8px">'+fld('Add a charge or credit','<input id="ce_l_'+j.id+'" placeholder="Extra hour, stairs, damage credit">','span2')+fld('Amount','<input id="ce_a_'+j.id+'" data-money="1" type="text" inputmode="numeric" autocomplete="off" placeholder="0.00">')+fld('Type','<select id="ce_t_'+j.id+'"><option value="charge">Charge</option><option value="credit">Credit</option></select>')+'</div><button class="btn" style="margin-top:6px" data-act="cr:charge" data-id="'+j.id+'">Add to bill</button>'+

      (bal>0?'<p class="hint money-due" style="margin:6px 0 0">'+money(bal)+' still to collect</p>':'<p class="hint money-paid" style="margin:6px 0 0">Paid in full</p>')+((bal>0||pend.length)?'<button class="btn primary big" data-act="flow:open" data-id="'+j.id+'" data-who="'+esc(me)+'">'+(pend.length?'Sign forms and collect payment':'Collect payment')+'</button>':'<p class="hint">Paid in full.</p>')+'</div>';
  }
  function card(j){
    var tl=j.items.reduce(function(a,i){return a+i.qty},0);
    var ld=j.items.reduce(function(a,i){return a+((j.tally[i.id]||{}).l?i.qty:0)},0),dl=j.items.reduce(function(a,i){return a+((j.tally[i.id]||{}).d?i.qty:0)},0);
    var map=function(a){return a?'<a href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a)+'" target="_blank" rel="noopener">'+esc(a)+'</a>':'<small>Not set</small>'};
    var cfs=S.customFields.filter(function(f){return j.d.custom[f.id]}).map(function(f){return '<div><small>'+esc(f.label)+':</small> '+esc(j.d.custom[f.id])+'</div>'}).join('');
    var rows=j.items.map(function(i){var tt=j.tally[i.id]||{};return '<div class="tally-row"><span>'+esc(i.name)+' × '+i.qty+'</span><span class="row"><button class="btn sm'+(tt.l?' on':'')+'" data-act="tally" data-id="'+j.id+'" data-item="'+i.id+'" data-k="l" aria-pressed="'+!!tt.l+'">Loaded</button><button class="btn sm'+(tt.d?' on':'')+'" data-act="tally" data-id="'+j.id+'" data-item="'+i.id+'" data-k="d" aria-pressed="'+!!tt.d+'">Delivered</button></span></div>'}).join('');
    var main='';
    if(asLead){
      if(j.status==='booked')main='<button class="btn primary big" data-act="cr:start" data-id="'+j.id+'" data-who="'+esc(me)+'">Start job</button>';
      else if(j.status==='active'){var pn=phaseNext(j);
        main=pn<4?'<button class="btn primary big" data-act="cr:phase" data-id="'+j.id+'" data-k="'+PHASES[pn][0]+'" data-who="'+esc(me)+'">'+PHASES[pn][1]+'</button>'
          :'<button class="btn primary big" data-act="cr:finish" data-id="'+j.id+'" data-who="'+esc(me)+'">'+(formsPending(j).length?'Get signatures and finish':'Finish job')+'</button>'}

    }else main='<span class="hint" style="align-self:center;flex:2;margin:0">'+(j.status==='booked'?'Your crew lead starts the job clock.':j.status==='active'?esc(phaseNow(j))+' · '+fmtDur(Date.now()-phaseSince(j)):'Finished. You can still add photos and notes.')+'</span>';
    if(asLead&&j.status==='paid')main='<span class="hint" style="align-self:center;flex:2;margin:0">Paid and closed. You can still add photos and notes.</span>';
    var thumbs=j.photos.slice(-8).map(function(p){return !p.data?'<span class="phold" style="width:52px;height:52px">…</span>':'<img src="'+p.data+'" alt="'+esc(p.kind)+' photo" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">'}).join('');
    var notes=(j.crewNotes||[]).map(function(n){var mineN=n.who===me||role==='owner';return '<div class="who" style="display:block"><div class="row between"><small>'+esc(n.who)+' · '+fmtStamp(n.ts)+'</small>'+(mineN?'<button class="btn sm ghost" data-act="cr:rmnote" data-id="'+j.id+'" data-nid="'+n.id+'" data-who="'+esc(me)+'">Remove</button>':'')+'</div><div style="white-space:pre-wrap">'+esc(n.text)+'</div></div>'}).join('');
    var crewLine=j.assign.crew.map(function(n){return esc(n)+whoTag(n)}).join(', ');
    var open=function(k,def){var o=ui.open['c:'+j.id+':'+k];return (o===undefined?def:o)?' open':''};
    var acc=function(k,title,meta,body,def){return '<details class="acc" data-k="c:'+j.id+':'+k+'"'+open(k,def)+'><summary><span>'+title+'</span>'+(meta?'<small>'+meta+'</small>':'')+'</summary><div class="acc-body">'+body+'</div></details>'};
    var nmeta=[j.d.notes?'office note':'',(j.crewNotes||[]).length?(j.crewNotes.length+' crew'):''].filter(Boolean).join(' · ');
    var notesBody=(j.d.notes?'<div><small>Job notes from the office</small><br><span style="white-space:pre-wrap">'+esc(j.d.notes)+'</span></div>':'')+cfs+
      '<div style="margin-top:8px"><small>Crew notes: your crew and the office can read these</small>'+(notes||'<br><small>None yet.</small>')+'<textarea id="cn_'+j.id+'" style="width:100%;min-height:56px;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:6px;color:var(--text);font-size:16px" placeholder="Gate code, passcode, or anything the office should know" aria-label="New crew note"></textarea><button class="btn sm" style="margin-top:6px" data-act="cr:note" data-id="'+j.id+'" data-who="'+esc(me)+'">Add note</button></div>';
    var mediaBody='<div class="row" style="gap:6px"><button class="btn sm" data-act="photo" data-kind="Pickup" data-id="'+j.id+'">Pickup photo</button><button class="btn sm" data-act="photo" data-kind="Delivery" data-id="'+j.id+'">Delivery photo</button><button class="btn sm" data-act="photo" data-kind="Damage" data-id="'+j.id+'">Damage</button></div>'+
      (thumbs?'<div class="row" style="margin-top:8px;gap:6px">'+thumbs+'</div>':'<div class="hint">No photos yet.</div>')+

/* ---------- photos ---------- */
function shrink(file,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var img=new Image();img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.6))};img.onerror=rej;img.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
var PHOTO_MAX=20;
/* The picker is opened by making a fresh input every time and clicking it. A file
   input that is display:none is ignored by .click() on iOS and inside an embedded
   frame, which is why the camera and gallery sheet never appeared. */
function pickPhotos(){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.setAttribute('tabindex','-1');inp.setAttribute('aria-hidden','true');
  inp.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;z-index:-1';
  inp.addEventListener('change',function(){takePhotos(inp.files);setTimeout(function(){if(inp.parentNode)inp.parentNode.removeChild(inp)},0)});
  document.body.appendChild(inp);
  try{inp.click()}catch(e){var st=$('#photoIn');if(st)st.click()}
}
function takePhotos(fileList){
  var all=Array.prototype.slice.call(fileList||[]),j=byId(ui.photoJob),kind=ui.photoKind;
  if(!all.length||!j)return;
  var over=all.length>PHOTO_MAX;
  var files=all.slice(0,PHOTO_MAX),done=0,failed=0;
  if(files.length>1)toast('Adding '+files.length+' photos…');
  files.reduce(function(chain,f){return chain.then(function(){
    return shrink(f,560).then(function(data){
      j.photos.push({id:uid(),kind:kind,ts:Date.now(),data:data});done++;
      if(files.length>1&&done%5===0)toast('Added '+done+' of '+files.length+'…');
    }).catch(function(){failed++});
  })},Promise.resolve()).then(function(){
    if(done){logEv(j,done===1?(kind+' photo added'):(done+' '+kind.toLowerCase()+' photos added'));save()}
    var msg=done?(done===1?kind+' photo saved.':done+' photos saved.'):'Could not read those photos.';
    if(over)msg+=' 20 at a time is the limit, so '+(all.length-PHOTO_MAX)+' were left out.';
    else if(failed&&done)msg+=' '+failed+' could not be read.';
    toast(msg);
    if(ui.jobId)renderSheet();else renderTab();
  });
}
$('#photoIn').addEventListener('change',function(e){takePhotos(e.target.files);e.target.value=''});

function distM(a,b){var R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r,x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);return 2*R*Math.asin(Math.sqrt(x))}

  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail('That email address does not look right.');
  if(email&&people.list.some(function(x){return x.email===email&&(!rec||x.id!==rec.id)}))return fail('Another profile already uses that email.');

/* ---------- preview another role (owner only; changes this screen, nothing else) ---------- */
function canPreview(){return sync.mode!=='shared'||sync.isOwner}
function previewing(){return !!(ui.preview&&canPreview())}
function previewPeople(role){
  var S=state.settings;
  if(role==='crew')return S.crew.filter(function(n){return !isLead(n)});
  if(role==='lead')return S.crew.filter(isLead);
  return (S.office||[]).filter(function(o){return o.kind===role}).map(function(o){return o.name});
}
function startPreview(role,staff){
  if(!canPreview())return;
  if(state.ui.realRole==null)state.ui.realRole=state.ui.role;
  ui.preview={role:role,staff:staff||''};
  state.ui.role=role;
  if(staff){if(role==='crew'||role==='lead')state.ui.me=staff;else state.ui.who=staff}
  ui.tab='today';ui.jobId=null;ui.chatThread=null;save();render();window.scrollTo(0,0);
}
function endPreview(){
  if(!ui.preview)return;
  ui.preview=null;
  if(state.ui.realRole!=null){state.ui.role=state.ui.realRole;state.ui.realRole=null}
  else state.ui.role='owner';
  ui.tab='today';ui.jobId=null;ui.chatThread=null;save();render();window.scrollTo(0,0);
}

  var b=$('#pvBar');if(!b)return;

  b.hidden=false;document.body.classList.add('previewing');
}

/* ---------- quote: driving distance from the two addresses ----------
   Hosted edition asks the Edge Function (Google Routes, key kept on the server). Without it,
   the note offers Google Maps directions in a new tab so the miles can be typed in. */
var dist={cache:{},busy:'',err:'',errKey:''};
function distKey(a,b){return String(a||'').trim().toLowerCase().replace(/\s+/g,' ')+'|'+String(b||'').trim().toLowerCase().replace(/\s+/g,' ')}
function mapsDirUrl(a,b){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode=driving'}
function distLookup(){
  var d=state.draft,a=(d.from||'').trim(),b=(d.to||'').trim();
  if(!a||!b||!canLookup()){renderDistNote();return}
  var k=distKey(a,b);
  if(dist.cache[k]){applyDist(dist.cache[k]);return}
  if(dist.busy===k)return;
  dist.busy=k;dist.err='';renderDistNote();
  mapsDistance(a,b).then(function(r){
    if(dist.busy!==k)return;dist.busy='';
    if(r&&r.ok&&r.miles>=0){r.key=k;dist.cache[k]=r;if(distKey(state.draft.from,state.draft.to)===k)applyDist(r);else renderDistNote()}
    else{dist.err=(r&&r.message)||'Could not look up the drive.';dist.errKey=k;renderDistNote()}
  });
}
function applyDist(r){
  var d=state.draft,cur=String(d.miles||'').trim();
  if(!cur||d.milesAuto){
    d.miles=String(r.miles);d.milesAuto=true;d.driveMin=r.minutes;save();
    var mi=$('[data-d="miles"]');if(mi)mi.value=d.miles;updateQuote();
  }
  renderDistNote();
}
function renderDistNote(){
  var el=$('#distNote');if(!el)return;
  var d=state.draft,a=(d.from||'').trim(),b=(d.to||'').trim(),k=distKey(a,b),r=dist.cache[k];
  var link=a&&b?' <a href="'+esc(mapsDirUrl(a,b))+'" target="_blank" rel="noopener">See the drive on Google Maps</a>':'';
  var h;
  var btn=canLookup()&&dist.busy!==k?' <button class="btn sm" data-act="q:dist">'+(r&&String(d.miles||'').trim()===String(r.miles)?'Look up again':'Look up distance')+'</button>':'';
  if(!canLookup()&&a&&b)link=' <a class="btn sm" href="'+esc(shopTripUrl()||mapsDirUrl(a,b))+'" target="_blank" rel="noopener">'+(shopTripUrl()?'Open the whole trip in Google Maps':'Open the drive in Google Maps')+'</a>';
  if(!a||!b)h=canLookup()?'Enter both addresses and the distance fills itself in. <button class="btn sm" data-act="q:dist">Look up distance</button>':'Enter both addresses, then check the drive on Google Maps.';
  else if(!canLookup())h='Type the miles from the map. This copy of Tally can’t look distances up itself; the Tally app on your phone does it for you.'+link;
  else if(dist.busy===k)h='Looking up the drive…';
  else if(r){
    var same=String(d.miles||'').trim()===String(r.miles);
    h=same?'Driving distance: <b>'+r.miles+' mi</b>, about '+fmtDur(r.minutes*60000)+' by car. Looked up from the addresses.'
      :'Google Maps says <b>'+r.miles+' mi</b> ('+fmtDur(r.minutes*60000)+' by car). <button class="btn sm" data-act="q:usedist">Use '+r.miles+' mi</button>';
  }
  else if(dist.err&&dist.errKey===k)h=esc(dist.err)+' Type the miles instead.'+btn+link;
  else h='Leave the address field and the distance fills itself in.'+btn;
  if(r&&dist.busy!==k&&String(d.miles||'').trim()===String(r.miles))h+=btn;
  if(r&&r.src==='osm')h+='<br><small>Distances from OpenStreetMap (© OpenStreetMap contributors).'+(r.note?' Google Maps: '+esc(r.note):'')+'</small>';
  if(r&&r.src==='google')h+='<br><small>Distances from Google Maps.</small>';
  el.innerHTML=h;
}

/* ---------- where distances come from ----------
   1. Google, through the Edge Function, once the Google key is set up (most accurate).
   2. Otherwise OpenStreetMap, free and with no setup: Nominatim (or Photon) finds each
      address, OSRM measures the drive. Addresses are looked up one at a time, a second
      apart, which is what those free services ask for.
   The claude.ai artifact can't reach any outside service, so it keeps the map link. */
function canFree(){return !window.TALLY_ARTIFACT&&typeof fetch==='function'}
function hasNativeGoogle(){try{return !!(window.TallyNative&&window.TallyNative.hasGoogle&&window.TallyNative.hasGoogle())}catch(e){return false}}
function canLookup(){return hasNativeGoogle()||!!window.tallyMaps||canFree()}
/* the Android app asks Google itself, with the key locked to this app */
var nativeWait={};
window.__tallyNativeDone=function(id,r){var f=nativeWait[id];if(f){delete nativeWait[id];f(r||{ok:false})}};
function nativeDistance(a,b){
  return new Promise(function(res){
    var id=uid();nativeWait[id]=res;
    setTimeout(function(){if(nativeWait[id]){delete nativeWait[id];res({ok:false,keyProblem:true,message:'Google Maps did not answer.'})}},25000);
    try{window.TallyNative.routeDistance(id,a,b)}catch(e){delete nativeWait[id];res({ok:false,keyProblem:true,message:'Google Maps is not available in this app.'})}
  });
}
function mapsDistance(a,b){
  if(hasNativeGoogle())return nativeDistance(a,b).then(function(r){
    if(r&&r.keyProblem){console.warn('Google Maps: '+r.message);return canFree()?freeDistance(a,b).then(function(x){if(x&&x.ok)x.note=r.message;return x}):r}
    return r;
  });
  if(window.tallyMaps&&window.tallyMaps.distance)return window.tallyMaps.distance(a,b).then(function(r){return r&&r.setup&&canFree()?freeDistance(a,b):r},function(){return canFree()?freeDistance(a,b):{ok:false,message:'Could not look up the drive.'}});
  return freeDistance(a,b);
}
var osm={geo:{},next:0};
function osmJson(url){return fetch(url,{headers:{'Accept':'application/json'}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function osmSlot(){var now=Date.now(),at=Math.max(now,osm.next);osm.next=at+1100;return new Promise(function(res){setTimeout(res,at-now)})}
function geocode(addr){
  var k=String(addr).trim().toLowerCase().replace(/\s+/g,' ');
  if(osm.geo[k])return osm.geo[k];
  var p=osmSlot().then(function(){return osmJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us,ca&q='+encodeURIComponent(addr))}).then(function(j){
    if(!j||!j[0])throw new Error('none');return {lat:+j[0].lat,lon:+j[0].lon};
  }).catch(function(){
    return osmSlot().then(function(){return osmJson('https://photon.komoot.io/api/?limit=1&q='+encodeURIComponent(addr))}).then(function(j){
      var f=j&&j.features&&j.features[0];if(!f)throw new Error('none');
      return {lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]};
    });
  });
  osm.geo[k]=p;p.catch(function(){delete osm.geo[k]});
  return p;
}
function freeDistance(a,b){
  if(!canFree())return Promise.resolve({ok:false,message:'Distance lookup is not available here.'});
  var ga,gb;
  return geocode(a).then(function(x){ga=x;return geocode(b)},function(){throw {where:a}}).then(function(y){gb=y},function(e){throw e&&e.where?e:{where:b}}).then(function(){
    return osmJson('https://router.project-osrm.org/route/v1/driving/'+ga.lon+','+ga.lat+';'+gb.lon+','+gb.lat+'?overview=false');
  }).then(function(j){
    var rt=j&&j.code==='Ok'&&j.routes&&j.routes[0];
    if(!rt)return {ok:false,message:'No driving route between those addresses. Check them.'};
    return {ok:true,src:'osm',miles:Math.round(rt.distance/1609.344*10)/10,minutes:Math.round(rt.duration/60)};
  }).catch(function(e){
    if(e&&e.where)return {ok:false,message:'Couldn’t find “'+e.where+'” on the map. Add the city and state.'};
    return {ok:false,message:'The map service didn’t answer. Check your connection.'};
  });
}

/* ---------- quote: the drive from the shop and back ----------
   Same lookup as pickup-to-delivery, for shop -> pickup and delivery -> shop. A leg the
   person typed is kept; the note then offers Google's number with a Use button. */
function fmtMi(x){x=Math.round(x*10)/10;return (Math.abs(x-Math.round(x))<0.05?Math.round(x):x).toLocaleString('en-US')}
function shopLegs(){
  var S=state.settings,d=state.draft,shop=(S.shopAddress||'').trim(),out=[];
  if(!shop)return out;
  if((d.from||'').trim())out.push({k:'out',f:'milesOut',a:shop,b:d.from.trim(),label:'From the shop to pickup'});
  if((d.to||'').trim())out.push({k:'back',f:'milesBack',a:d.to.trim(),b:shop,label:'Delivery back to the shop'});
  return out;
}
dist.shopBusy={};
function shopLookup(force){
  if(!canLookup()){renderShopNote();return}
  shopLegs().forEach(function(l){
    var k=distKey(l.a,l.b);
    if(force&&dist.cache[k]&&!(state.draft.shopManual||{})[l.k])delete dist.cache[k];
    if(force){state.draft.shopManual=Object.assign({},state.draft.shopManual);state.draft.shopManual[l.k]=false}
    if(dist.cache[k]){applyShop(l,dist.cache[k]);return}
    if(dist.shopBusy[k])return;
    dist.shopBusy[k]=1;renderShopNote();
    mapsDistance(l.a,l.b).then(function(r){
      delete dist.shopBusy[k];
      if(r&&r.ok&&r.miles>=0){r.key=k;dist.cache[k]=r;var now=shopLegs().find(function(x){return x.k===l.k&&distKey(x.a,x.b)===k});if(now)applyShop(now,r);else renderShopNote()}
      else{dist.shopErr=(r&&r.message)||'Could not look up the drive.';renderShopNote()}
    });
  });
  renderShopNote();
}
function applyShop(l,r){
  var d=state.draft,cur=String(d[l.f]||'').trim();
  if(!cur||!(d.shopManual||{})[l.k]){
    d[l.f]=String(r.miles);save();
    var el=$('[data-d="'+l.f+'"]');if(el)el.value=d[l.f];updateQuote();
  }
  renderShopNote();
}
function shopTripUrl(){
  var S=state.settings,d=state.draft,shop=(S.shopAddress||'').trim(),a=(d.from||'').trim(),b=(d.to||'').trim();
  if(!shop||!a||!b)return '';
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(shop)+'&destination='+encodeURIComponent(shop)+'&waypoints='+encodeURIComponent(a+'|'+b)+'&travelmode=driving';
}
function renderShopNote(){
  var el=$('#shopNote');if(!el)return;
  var S=state.settings,d=state.draft,legs=shopLegs();
  if(!legs.length){el.innerHTML='Enter the addresses and the drive from and back to the shop fills itself in.';return}
  var rows=legs.map(function(l){
    var k=distKey(l.a,l.b),r=dist.cache[k],v=String(d[l.f]||'').trim();
    if(dist.shopBusy[k])return l.label+': looking up…';
    if(!r)return '';
    var same=v===String(r.miles);
    return l.label+': '+(same?'<b>'+r.miles+' mi</b>, about '+fmtDur(r.minutes*60000)+' by car':'Google Maps says <b>'+r.miles+' mi</b> <button class="btn sm" data-act="q:useshop" data-k="'+l.k+'">Use '+r.miles+' mi</button>');
  }).filter(Boolean);
  var total=num(d.milesOut)+num(d.miles)+num(d.milesBack);
  var url=shopTripUrl();
  var h=rows.join('<br>');
  if(!canLookup())h='Type the miles from the map.'+(url?' <a class="btn sm" href="'+esc(url)+'" target="_blank" rel="noopener">Open the whole trip in Google Maps</a>':'');
  else if(!rows.length&&dist.shopErr)h=esc(dist.shopErr)+' Type the miles instead.'+(url?' <a href="'+esc(url)+'" target="_blank" rel="noopener">See the whole trip on Google Maps</a>':'');
  if(total>0&&(num(d.milesOut)||num(d.milesBack)))h+=(h?'<br>':'')+'Round trip from the shop: <b>'+fmtMi(total)+' mi</b>'+(S.shopTravel===false?' (not counted in the price; see Setup › Rate card)':'');
  el.innerHTML=h;
}

/* ---------- job messages: each person confirms they will be there ----------
   A confirmation is tied to the job's day and start time, so moving the job asks again. */
function slotOf(j){return (j.d.moveDate||'')+' '+(j.d.time||'')}
function isConfirmed(j,n){var c=j.confirm&&j.confirm[n];return !!(c&&c.for===slotOf(j))}
function dropConfirm(j,n){if(j.confirm&&j.confirm[n]){j.confirm=Object.assign({},j.confirm);delete j.confirm[n]}}
function needsConfirm(j){return j.status==='booked'&&!!j.d.moveDate&&j.d.moveDate>=todayISO()}
function relDay(s){var t=todayISO();if(s===t)return 'today';if(s===addDays(t,1))return 'tomorrow';return fmtDate(s)}
function jobMsgs(me){
  if(!me)return [];var t=todayISO();
  return state.jobs.filter(function(j){return (j.status==='booked'||j.status==='active')&&j.d.moveDate&&j.d.moveDate>=t&&j.assign.crew.indexOf(me)>=0})
    .sort(function(a,b){return slotOf(a)<slotOf(b)?-1:1});
}

function phaseSince(j){var i=phaseNext(j);return i===0?(j.startedAt||Date.now()):j.phases[PHASES[i-1][0]]}
function phaseRows(j){
  var p=j.phases||{},now=Date.now(),live=j.status==='active';
  var segs=[['On the way',j.startedAt,p.loadStart],['Loading',p.loadStart,p.loadEnd],['Driving to delivery',p.loadEnd,p.unloadStart],['Unloading',p.unloadStart,p.unloadEnd]];
  if(p.unloadEnd&&(j.finishedAt||live))segs.push(['Sign-off and wrap-up',p.unloadEnd,j.finishedAt]);
  return segs.map(function(s){
    var a=s[1],b=s[2],st=a&&b?'done':(a&&live?'now':'todo');
    var right=st==='done'?fmtClock(a)+' – '+fmtClock(b)+' · <b>'+fmtDur(b-a)+'</b>':st==='now'?'since '+fmtClock(a)+' · <b>'+fmtDur(now-a)+'</b>':'—';
    return '<div class="ps '+st+'"><span><i></i>'+s[0]+'</span><span>'+right+'</span></div>';
  }).join('');
}

/* ---------- form upload (PDF or images become page images) ---------- */
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return new Promise(function(res,rej){
    var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=function(){if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)}else rej(new Error('pdf'))};
    sc.onerror=function(){rej(new Error('pdf'))};document.head.appendChild(sc);
  });
}
function pdfToPages(file){
  var fail=function(){return new Error('Could not read that PDF here. Upload it as photos or images instead, or paste the form text.')};
  return loadPdfJs().then(function(lib){return file.arrayBuffer().then(function(buf){return lib.getDocument({data:buf}).promise})}).then(function(pdf){
    var n=Math.min(pdf.numPages,8),out=[],chain=Promise.resolve();
    for(var i=1;i<=n;i++)(function(i){chain=chain.then(function(){return pdf.getPage(i).then(function(pg){
      var v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:1100/v0.width}),c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
      return pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise.then(function(){out.push(c.toDataURL('image/jpeg',0.7))});
    })})})(i);
    return chain.then(function(){return out});
  }).catch(function(){throw fail()});
}
function formPages(files){
  var list=Array.prototype.slice.call(files),out=[];
  return list.reduce(function(chain,f){return chain.then(function(){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))return pdfToPages(f).then(function(pg){out=out.concat(pg)});
    if(/^image\//.test(f.type))return shrink(f,1100).then(function(d){out.push(d)});
    throw new Error('Upload PDFs or images only.');
  })},Promise.resolve()).then(function(){if(!out.length)throw new Error('Nothing to read in that file.');return out.slice(0,8)});
}

function fmtField(t,e){
  var del=!!(e&&e.inputType&&e.inputType.indexOf('delete')===0),raw=t.value,pos=t.selectionStart==null?raw.length:t.selectionStart;
  var atEnd=pos>=raw.length,before=raw.slice(0,pos).replace(/\D/g,'').length,d=raw.replace(/\D/g,''),out;
  if(t.id==='cardNum'){d=d.slice(0,19);out=d.replace(/(\d{4})(?=\d)/g,'$1-')}
  else{
    d=d.slice(0,4);
    if(d.length&&+d.charAt(0)>1){d='0'+d;d=d.slice(0,4);before++}
    out=d.length>=2?d.slice(0,2)+((d.length>2||!del)?'/':'')+d.slice(2):d;
  }
  if(out===raw)return;
  t.value=out;
  var np=out.length;
  if(!atEnd){var c=0;np=0;while(np<out.length&&c<before){if(/\d/.test(out.charAt(np)))c++;np++}}
  try{t.setSelectionRange(np,np)}catch(x){}
}

  var t=e.target,j=ui.jobId&&canEditJobs()?byId(ui.jobId):null;
  if(t.dataset&&t.dataset.dq!==undefined){var dj=canEditJobs()?byId(t.dataset.id):null;if(dj){if(t.dataset.dq==='truckId')dj.assign.truckId=t.value;else{dj.d[t.dataset.dq]=t.value;if(t.dataset.dq==='moveDate'&&t.value){ui.weekStart=mondayOf(t.value);ui.day=t.value}}save();renderDispatch()}return}
  if(t.id&&t.id.indexOf('accStaff_')===0){var rs=$('#accRole_'+t.id.slice(9)),er=peopleHosted()?empByName(t.value):null,dv=directory().find(function(x){return x.name===t.value});if(rs&&(er||dv))rs.value=er?er.role:dv.kind;return}
  if(t.id==='chatAs'){var rl=state.ui.role;if(rl==='crew'||rl==='lead')state.ui.me=t.value;else state.ui.who=t.value;save();renderTabs();renderChat();return}
  if(t.id==='role'){if(sync.mode==='shared'&&sync.identity.status==='ok'){t.value=state.ui.role;return}
    state.ui.who='';ui.chatThread=null;state.ui.role=t.value;save();ui.armed='';render();return}
  if(t.id==='meSel'){state.ui.me=t.value;save();renderCrew();return}
  if(t.id==='rFrom'){ui.from=t.value;renderReports();return}
  if(t.id==='rTo'){ui.to=t.value;renderReports();return}
  if(j&&t.dataset.re){j.d[t.dataset.j]=t.value;save();renderSheet()}
  else if(j&&t.dataset.jassign){j.assign[t.dataset.jassign]=t.value;save();renderSheet()}
  else if(j&&t.dataset.jstatus){
    if((t.value==='done'||t.value==='paid')&&j.status!=='done'&&j.status!=='paid'&&formsPending(j).length){t.value=j.status;toast('The customer has to sign '+formsPending(j).map(function(f){return f.title}).join(', ')+' before this job can close. Use Finish job, or waive the form.');return}
    setStatus(j,t.value);save();renderSheet()}
});

/* ---------- errors are shown, not swallowed ---------- */
