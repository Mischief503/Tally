// what they can pay now: the deposit that holds a booked date, or the bill once the move is done
function custDueNow(m){var s=custStage(m);return s==='booked'&&m.bill.deposit>0?{amt:m.bill.deposit,kind:'deposit'}:s==='due'?{amt:m.bill.due,kind:'bill'}:{amt:0,kind:''}}
function custTipOk(m){return !!m.tips&&(m.status==='done'||m.status==='paid')&&m.crew.n>0}
function custTipped(m){return (m.pays||[]).some(function(p){return p.tip>0})}
function custAhead(m){return (m.forms||[]).filter(function(f){return f.ahead&&!f.signed&&(m.status!=='active'||f.kind==='crew')})}
function custTipWho(m){var n=m.crew.n;return n>1?'It goes to the '+n+' movers on your move'+(m.crew.lead?' ('+m.crew.lead+'’s crew)':'')+', split evenly.':m.crew.lead?'It goes to '+m.crew.lead+', who moved you.':'It goes to your crew.'}
function custSizeWords(m){var q=m.quote,w=[];if(q.crew)w.push(q.crew+' movers');if(q.trucks)w.push(q.trucks+' truck'+(q.trucks===1?'':'s'));if(q.hours)w.push('about '+q.hours+' hours');return w.join(' · ')}
function custRouteHtml(m){return '<div class="cm-route"><div><small>From</small><b>'+esc(m.d.from||'Not set yet')+'</b></div><div><small>To</small><b>'+esc(m.d.to||'Not set yet')+'</b></div></div>'}
function custLinesHtml(m,fin){
  var q=m.quote,rows=q.lines.map(function(l){return '<tr><td>'+esc(l.label)+'</td><td>'+(l.amt<0?'−':'')+money(Math.abs(l.amt))+'</td></tr>'}).join('');
  return '<table class="lines">'+rows+(fin?'<tr class="sub"><td>Quote</td><td>'+money(q.total)+'</td></tr><tr class="total"><td>Your bill</td><td>'+money(m.bill.total)+'</td></tr>':'<tr class="total"><td>'+(q.flat?'Price':'Estimate')+'</td><td>'+money(q.total)+'</td></tr>')+'</table>'+
    (q.flat||fin?'':'<p class="hint">Billed by the hour from your crew’s times'+(q.nte?', with an estimated top price of '+money(q.nte):'')+'.</p>');
}
var CUST_PILL={quote:['Quote','quoted'],booked:['Booked','booked'],today:['Moving today','active'],due:['Moved · bill due','done'],done:['Done','paid']};
function custBtn(m,act,label,pri){return '<button class="btn'+(pri?' primary':'')+'" data-act="'+act+'" data-k="'+esc(custKeyOf(m))+'">'+label+'</button>'}
function custCardHtml(m){
  var s=custStage(m),pl=CUST_PILL[s],q=m.quote,day=m.d.moveDate;
  var when=day?'<h2 class="cm-when">'+esc(custLong(day))+'</h2><p class="cm-sub">'+(m.d.time?'Your crew arrives at '+esc(fmtTime(m.d.time)):'Arrival time to be set')+((s==='booked'||s==='quote')&&custIn(day)?' · '+custIn(day):'')+'</p>'
    :'<h2 class="cm-when">Day not set yet</h2><p class="cm-sub">Call or text us to pick a day.</p>';
  var price=s==='quote'?'<div class="cm-price"><b>'+money(q.total)+'</b><span>'+(q.flat?'Flat price':'Estimate, billed by the hour'+(q.nte?' · top price about '+money(q.nte):''))+'</span></div>':'';
  var crew=(s==='booked'||s==='today')&&m.crew.lead?'<p class="cm-sub">'+esc(m.crew.lead)+' leads your crew'+(m.crew.n>1?' of '+m.crew.n:'')+'.</p>':'';
  return '<section class="card cm-card"><div class="cm-top"><span class="pill" data-s="'+pl[1]+'">'+pl[0]+'</span>'+(m.test?'<span class="pill">Test</span>':'')+'</div>'+when+custRouteHtml(m)+(custSizeWords(m)?'<p class="cm-sub">'+esc(custSizeWords(m))+'</p>':'')+price+crew+'</section>';
}
function custStepHtml(st,title,sub,btn){return '<li class="'+st+'"><span class="cm-dot" aria-hidden="true">'+(st==='done'?'✓':'')+'</span><span class="tx"><b>'+title+'</b>'+(sub?'<small>'+sub+'</small>':'')+(btn||'')+'</span></li>'}
// what's next, in order: book, sign ahead, the deposit, move day, the bill (and a tip), the review
function custNextHtml(m){
  var s=custStage(m),A=custAhead(m),due=custDueNow(m),out=[],add=function(st,t,sub,b){out.push(custStepHtml(st,t,sub,b))};
  var past=!!m.d.moveDate&&m.d.moveDate<todayISO(),aheadAll=(m.forms||[]).filter(function(f){return f.ahead});
  if(s==='quote')add('now','Book your move',!m.d.moveDate?'Call or text us to pick a day first.':past?'That day has passed. Call or text us to pick a new one.':m.book?'Check the details and book it here.':'Call or text us to book it.',m.book&&m.d.moveDate&&!past?custBtn(m,'cs:book','Book my move',1):'');
  else add('done','Booked',m.bookedBy==='customer'?'You booked it here.':'');
  var crewOnly=A.length===1&&A[0].kind==='crew';
  if(aheadAll.length&&(s==='quote'||s==='booked'))add(A.length?(s==='booked'?'now':'later'):'done',A.length?(crewOnly?'Sign for your bigger crew':A.length===1?'Sign a form before move day':'Sign '+A.length+' forms before move day'):'Forms signed',A.length?esc(crewOnly?A[0].n+' movers at '+money(A[0].rate)+'/hr, before your crew loads':A.map(function(f){return f.title}).join(', ')):'',A.length&&s==='booked'?custBtn(m,'cs:sign','Sign now',!due.amt):'');
  if(s==='today'&&A.length)add('now','Sign for your bigger crew',esc(A[0].n+' movers at '+money(A[0].rate)+'/hr. Sign here, or with your crew before they load.'),custBtn(m,'cs:sign','Sign now',1));
  if(m.quote.deposit>0&&(s==='quote'||s==='booked'))add(s==='booked'?(due.amt>0?'now':'done'):'later',s==='booked'?(due.amt>0?'Pay your deposit: '+money(due.amt):'Deposit paid'):'Deposit to book: '+money(m.quote.deposit),s==='booked'&&due.amt>0?'It holds your date.':'',s==='booked'&&due.amt>0?custBtn(m,'cs:pay','Pay '+money(due.amt),1):'');
  if(s==='quote'||s==='booked')add('later','Move day','We’ll show you here when your crew is on the way, and how the move is going.');
  else if(s==='today')add('now','Move day','Happening now.');
  else add('done','Moved',m.d.moveDate?esc(fmtDate(m.d.moveDate)):'');
  if(s==='due')add('now','Pay your bill: '+money(m.bill.due),custTipOk(m)?'And tip your crew if you like.':'',custBtn(m,'cs:pay','Pay '+money(m.bill.due),1));
  else if(s==='done')add('done','Paid',custTipOk(m)?(custTipped(m)?'Thank you, and thank you for the tip.':'You can still tip your crew.'):'Thank you!',custTipOk(m)&&!custTipped(m)?custBtn(m,'cs:pay','Tip your crew'):'');
  else add('later','Pay the bill',m.tips?'After the move, right here, with a tip for your crew if you like.':'After the move, right here.');
  if(m.review)add(s==='done'?(m.reviewed?'done':'now'):'later','Tell others about '+esc(m.company||'us'),s==='done'?'':'After the move.',s==='done'?'<a class="btn" href="'+esc(m.review)+'" target="_blank" rel="noopener" data-act="cs:revlink" data-k="'+esc(custKeyOf(m))+'">Leave a review</a>':'');
  return '<section class="card"><h3>'+(s==='done'?'All done':'What’s next')+'</h3><ol class="cm-steps">'+out.join('')+'</ol></section>';
}
// move day as it happens: on the way (the arrival text's time), loading, on the road, unloading, done
function custDayHtml(m){
  var p=m.day.phases||{},st=m.day.startedAt,eta=m.day.eta,now=Date.now();
  var L=[
    {t:'Your crew is on the way',sub:p.loadStart?'Arrived':st?(eta?(eta>now?'Arriving about '+fmtClock(eta):'Arriving any minute'):'On the way since '+fmtClock(st)):'',done:!!p.loadStart,on:!!st},
    {t:'Loading at '+(m.d.from||'your place'),sub:p.loadStart?(p.loadEnd?'Done at '+fmtClock(p.loadEnd):'Started at '+fmtClock(p.loadStart)):'',done:!!p.loadEnd,on:!!p.loadStart},
    {t:'On the road to '+(m.d.to||'your new place'),sub:p.loadEnd&&!p.unloadStart?'Left at '+fmtClock(p.loadEnd):'',done:!!p.unloadStart,on:!!p.loadEnd},
    {t:'Unloading',sub:p.unloadStart?(p.unloadEnd?'Done at '+fmtClock(p.unloadEnd):'Started at '+fmtClock(p.unloadStart)):'',done:!!p.unloadEnd,on:!!p.unloadStart},
    {t:'Finishing up',sub:p.unloadEnd?'Your crew goes over the forms and the bill with you.':'',done:false,on:!!p.unloadEnd}];
  var cur=-1;L.forEach(function(x,i){if(x.on&&!x.done)cur=i});
  return '<section class="card"><h3>Move day</h3><ol class="cm-steps">'+L.map(function(x,i){return custStepHtml(x.done?'done':i===cur?'now':'later',esc(x.t),esc(x.sub))}).join('')+'</ol><p class="hint">This follows your crew as they go.</p></section>';
}
function custDetailsHtml(m){
  var s=custStage(m),fin=s==='due'||s==='done',items=m.items.map(function(i){return esc(i.name)+(i.qty>1?' × '+i.qty:'')}).join(', ');
  return '<details class="card cm-det"><summary><span>'+(fin?'Your bill':'Your quote')+'</span><b>'+money(fin?m.bill.total:m.quote.total)+'</b></summary>'+custLinesHtml(m,fin)+(items?'<h4>What’s moving</h4><p class="hint">'+items+'</p>':'')+'</details>';
}
function custHelpHtml(m){
  var ph=String(m.phone||''),dig=ph.replace(/[^0-9+]/g,'');
  return '<section class="card cm-help"><h3>Questions?</h3><p class="hint" style="margin:0 0 8px">'+(ph?'Call or text '+esc(m.company||'us')+' at <b>'+esc(fmtPhone(ph))+'</b>.':'Reply to the texts from '+esc(m.company||'your moving company')+'.')+'</p>'+
    (dig?'<div class="row"><a class="btn" href="tel:'+esc(dig)+'">Call</a><a class="btn" href="sms:'+esc(dig)+'">Text</a></div>':'')+'</section>';
}
function custMovesHtml(L,cur){
  return '<div class="navlist cm-moves">'+L.map(function(m){var k=custKeyOf(m),pl=CUST_PILL[custStage(m)];
    return '<button class="navrow" data-act="cs:move" data-k="'+esc(k)+'"'+(cur&&k===custKeyOf(cur)?' aria-current="true"':'')+'><span class="tx"><b>'+esc(m.d.moveDate?fmtDate(m.d.moveDate):'Day not set')+(m.company?' · '+esc(m.company):'')+'</b><small>'+esc((m.d.from||'?')+' → '+(m.d.to||'?'))+'</small></span><span class="pill" data-s="'+pl[1]+'">'+pl[0]+'</span></button>'}).join('')+'</div>';
}
function renderMyMove(){
  var v=$('#view'),L=custSorted(),m=custCur(),me=custSelf();
  if(!m){v.innerHTML='<div class="hero-day"><h1>'+esc(custHi(me.name))+'</h1></div><section class="card empty"><h3>No move here yet</h3><p>When your moving company puts '+(me.email?esc(me.email):'your email')+' on your move, it shows up here.</p></section>';return}
  var s=custStage(m),noEmail=!custLive()&&!emailKey(m.d.email);
  v.innerHTML=(noEmail?'<div class="note">This customer has no email on their move yet, so they can’t sign in to see this. Put it on the quote or the job.</div>':'')+
    '<div class="hero-day"><h1>'+esc(custHi(m.d.name))+'</h1><p class="sub">Your move with '+esc(m.company||'your moving company')+'</p></div>'+
    custCardHtml(m)+(s==='today'?custDayHtml(m):'')+custNextHtml(m)+custDetailsHtml(m)+custHelpHtml(m)+
    (L.length>1?'<h3 class="cm-h3">Your moves</h3>'+custMovesHtml(L,m):'');
  custAutoThanks(m);
}
function renderMyPay(){
  var v=$('#view'),m=custCur();
  if(!m){v.innerHTML='<div class="hero-day"><h1>Pay</h1></div><section class="card empty"><h3>Nothing to pay</h3><p>Your moves and bills show up here.</p></section>';return}
  var s=custStage(m),due=custDueNow(m),before=s==='quote'||s==='booked';
  var tiles=kpiRow([[before?m.quote.total:m.bill.total,before?(m.quote.flat?'Price':'Estimate'):'Bill',''],[m.bill.paid,'Paid',m.bill.paid>0?'paid':''],[due.amt>0?due.amt:m.bill.due,due.kind==='deposit'?'Deposit due':before?'After the move':'Due now',due.amt>0?'due':'']]);
  var act=due.amt>0?custBtn(m,'cs:pay','Pay '+money(due.amt),1).replace('class="btn primary"','class="btn primary bigbtn"')+'<p class="hint cm-center">Google Pay, Apple Pay or a card'+(due.kind==='bill'&&custTipOk(m)?', with a tip for your crew if you like':'')+'.</p>'
    :custTipOk(m)?custBtn(m,'cs:pay','Tip your crew',1).replace('class="btn primary"','class="btn primary bigbtn"')+'<p class="hint cm-center">'+esc(custTipWho(m))+'</p>'
    :'<p class="hint" style="margin:0">'+(s==='quote'?'Nothing to pay yet. Book your move first.':s==='booked'?(m.quote.deposit>0?'Your deposit is paid. ':'')+'The bill is due after the move.':s==='today'?'Your bill is ready when the move is done.':'Nothing to pay. Thank you!')+'</p>';
  var rows=(m.pays||[]).slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)}).map(function(p){return '<tr><td>'+esc(p.method||'Payment')+'<br><small>'+esc(p.date?fmtDate(p.date):'')+'</small></td><td>'+(p.amt?money(p.amt):'')+(p.tip?(p.amt?'<br>':'')+'<small>'+money(p.tip)+' tip</small>':'')+'</td></tr>'}).join('');
  v.innerHTML='<div class="hero-day"><h1>Pay</h1><p class="sub">'+esc(m.company||'')+(m.d.moveDate?' · '+esc(fmtDate(m.d.moveDate)):'')+'</p></div>'+tiles+'<section class="card">'+act+'</section>'+
    (rows?'<section class="card"><h3>Receipts</h3><table class="lines">'+rows+'</table></section>':'')+custDetailsHtml(m);
}
function custAppHtml(){

}
function renderMyProfile(){

    (live&&window.tallySignOut?'<section class="card"><button class="btn" data-act="cs:signout">Sign out</button></section>':'');

/* the sheets: book, sign ahead, pay (and tip), and the thank you that takes them to the review page */
var csTimer=null;
function csOpen(kind,m,extra){clearInterval(csTimer);csTimer=null;ui.cs=Object.assign({kind:kind,key:custKeyOf(m),tip:null,other:'',n:0,busy:false},extra||{});renderCs()}
function csClose(){clearInterval(csTimer);csTimer=null;ui.cs=null;renderCs()}
function csFail(t){var e=$('#csErr');if(e){e.textContent=t;e.style.color='var(--bad)'}}
function csTipAmt(m,c){if(!custTipOk(m)||!c)return 0;if(c.tip==='other')return Math.max(0,round2(num(String(c.other||'').replace(/[^0-9.]/g,''))));var p=num(c.tip);return p>0?Math.round(m.bill.total*p)/100:0}
function csTitle(m,c){var due=custDueNow(m);return {book:'Book your move',sign:m.status==='active'||m.d.moveDate===todayISO()?'Sign before loading':'Sign before move day',pay:due.amt>0?(due.kind==='deposit'?'Pay your deposit':'Pay your bill'):'Tip your crew',thanks:'Your move is done'}[c.kind]||''}
function renderCs(){
  var el=$('#cust');if(!el)return;
  var c=ui.cs,m=c&&isCust()?custFind(c.key):null;
  if(!c||!m){if(c){clearInterval(csTimer);csTimer=null;ui.cs=null}el.hidden=true;el.innerHTML='';syncLock();return}
  var T=csTitle(m,c),body=c.kind==='book'?csBookHtml(m):c.kind==='sign'?csSignHtml(m):c.kind==='pay'?csPayHtml(m,c):csThanksHtml(m,c);
  var prev=$('.sheet-body',el),keep=prev&&c.kind!=='sign'?prev.scrollTop:0;
  el.innerHTML='<div class="scrim" data-act="cs:close"></div><div class="panel" role="dialog" aria-modal="true" aria-label="'+esc(T)+'"><div class="sheet-head"><div><h2>'+esc(T)+'</h2><small>'+esc(m.company||'')+'</small></div><button class="btn sm" data-act="cs:close">Close</button></div><div class="sheet-body">'+body+'</div></div>';
  el.hidden=false;syncLock();
  var nb=$('.sheet-body',el);if(nb&&keep)nb.scrollTop=keep;
  if(c.kind==='sign'&&$('#sigPad'))initSig();
}
function csBookHtml(m){
  var q=m.quote,dep=Math.max(0,round2(q.deposit-m.bill.paid));
  return '<div class="cm-sum"><b>'+esc(custLong(m.d.moveDate))+'</b><span>'+(m.d.time?'Your crew arrives at '+esc(fmtTime(m.d.time)):'')+'</span></div>'+custRouteHtml(m)+
    (custSizeWords(m)?'<p class="cm-sub" style="margin:0 0 8px">'+esc(custSizeWords(m))+'</p>':'')+custLinesHtml(m,false)+
    (dep>0?'<div class="note" style="margin-top:10px">A '+money(dep)+' deposit holds your date. You pay it next, with Google Pay, Apple Pay or a card.</div>':'')+
    '<label class="check" style="margin-top:6px"><input type="checkbox" id="csAgree"> I accept this quote.</label>'+
    '<button class="btn primary bigbtn" data-act="cs:bookgo" data-k="'+esc(custKeyOf(m))+'">'+(dep>0?'Book and pay the deposit':'Book my move')+'</button><p class="hint" id="csErr" role="alert"></p>';
}
function csSignHtml(m){
  var A=custAhead(m),all=(m.forms||[]).filter(function(f){return f.ahead}),f=A[0];
  if(!f)return '<div class="cm-thanks"><p class="big">All signed</p><p class="hint">Thank you. Your crew has '+(all.length===1?'it':'them')+'.</p><button class="btn primary bigbtn" data-act="cs:close">Done</button></div>';
  var crew=f.kind==='crew';
  // the bigger crew: the same words the crew lead shows them (crewStep)
  var content=crew?'<div class="formtext">Your quote is for '+f.qc+' movers at '+money(f.qrate)+'/hr. '+f.n+' movers are on your move, billed at '+money(f.rate)+'/hr for the time they’re on it.</div>'
    :f.kind==='text'?'<div class="formtext">'+esc(f.text)+'</div>':(f.pages||[]).map(function(pg,i){return pg?'<img src="'+esc(pg)+'" alt="'+esc(f.title)+' page '+(i+1)+'">':'<p class="hint">Loading page '+(i+1)+'…</p>'}).join('');
  return (all.length>1?'<p class="hint" style="margin:0 0 4px">Form '+(all.length-A.length+1)+' of '+all.length+'</p>':'')+'<h3>'+esc(f.title)+'</h3><div class="formbox">'+content+'</div>'+
    fld('Your name','<input id="csSigName" autocomplete="name" value="'+esc(m.d.name)+'">')+
    '<label class="check"><input type="checkbox" id="csSigAgree"> '+(crew?'I agree to '+f.n+' movers at '+money(f.rate)+'/hr for the time they’re on the job.':'I have read this form and I agree.')+'</label>'+
    '<div class="f"><span>Sign here with your finger</span></div><canvas id="sigPad" class="sigpad" aria-label="Signature pad"></canvas>'+
    '<div class="row"><button class="btn" data-act="cs:clearsig">Clear</button><button class="btn primary grow" data-act="cs:signgo" data-k="'+esc(custKeyOf(m))+'" data-fid="'+esc(f.id)+'">Sign</button></div><p class="hint" id="csErr" role="alert"></p>';
}
var CS_TIPS=[[0,'No tip'],[10,'10%'],[15,'15%'],[20,'20%'],['other','Other']];
function csPayHtml(m,c){
  var due=custDueNow(m),tipOk=custTipOk(m),tip=csTipAmt(m,c),total=round2(due.amt+tip);
  var head=due.amt>0?'<div class="cm-total cm-first"><span>'+(due.kind==='deposit'?'Deposit for '+esc(fmtDate(m.d.moveDate)):'Your bill'+(m.bill.paid>0?', after '+money(m.bill.paid)+' paid':''))+'</span><b>'+money(due.amt)+'</b></div>'+(due.kind==='deposit'?'<p class="hint" style="margin:0 0 8px">It holds your date. The rest is due after the move.</p>':''):'';
  var tips=tipOk?'<h3 class="cm-h3">Tip your crew</h3><p class="hint" style="margin:0 0 6px">'+esc(custTipWho(m))+'</p><div class="cm-tips">'+CS_TIPS.map(function(o){
      var on=o[0]==='other'?c.tip==='other':c.tip!=null&&c.tip!=='other'&&num(c.tip)===o[0],amt=o[0]>0?money(Math.round(m.bill.total*o[0])/100):'';

function saveQuote(kind){
  var d=state.draft,S=state.settings,cc=isCC(),who=(cc?ccName():myName())||'';
  if(!d.name.trim()){toast('Add the customer name first.');var n=$('[data-d=name]');if(n)n.focus();return}

        (X.slots.length?'It doesn’t fit in '+slotWords(S,X.slots)+' then. Tap Book anyway to book it.':'No slot is free for it then. Tap Book anyway to book it.'));

    if(String(j.d.notes||'')!==oldNotes){j.d.notesBy=myName()||'Office';j.d.notesAt=Date.now();logEv(j,'Job notes updated by '+j.d.notesBy)}
    if(kind==='book'&&(j.status==='lead'||j.status==='quoted')){setStatus(j,'booked');if(cc)logEv(j,'Booked by '+ccWho());daySlot(j,fit)}
    else if(j.status==='lead'&&q.cf)setStatus(j,'quoted');
    // a finished job billed by the clock is worked out again against the new quote
    if(j.clockAt)rebill(j,'quote changed');
  }else{
    var s=kind==='book'?'booked':(q.cf?'quoted':'lead');
    j=newJob(d,S,s);if(who)j.createdBy=who;if(cc)j.createdCC=true;logEv(j,'Created as '+LABEL[s]+(cc?' by '+ccWho():who?' by '+who:''));if(s==='booked')daySlot(j,fit);state.jobs.push(j);
    if(String(j.d.notes||'').trim()){j.d.notesBy=myName()||'Office';j.d.notesAt=Date.now()}
  }
  if(cc){
    state.draft=blankDraft();ui.qstep=1;save();
    if(j.status==='booked'){ui.schedDay=j.d.moveDate;ui.schedMon=j.d.moveDate.slice(0,7);ui.tab='sched';render();window.scrollTo(0,0);toast('Booked for '+fmtDate(j.d.moveDate)+' at '+fmtTime(j.d.time)+(fit?' in '+slotWords(S,fit.trucks):'')+'. Dispatch adds the '+(num(q.nTrucks)>1?'trucks':'truck')+' and crew.')}
    else{ui.tab='quotes';render();window.scrollTo(0,0);toast('Saved. It’s in Quotes.')}
    return;
  }
  state.draft=blankDraft();ui.qstep=1;save();ui.tab='jobs';ui.filter='all';render();openJob(j.id);
  var tw=num(q.nTrucks)>1?'trucks':'truck';
  toast(kind==='book'?(fit?'Job booked in '+slotWords(S,fit.trucks)+' at '+fmtTime(j.d.time)+'. Add the '+tw+' and crew.':'Job booked. Add '+(j.d.moveDate?'the '+tw+' and crew':'a date, truck and crew')+'.'):'Saved.');
}

/* ---------- typed job info is saved with a button ----------
   What the office types on the job sheet (the customer and route, its own fields, the job notes) is
   held as a draft for that job (ui.jed[jobId]) until Save, so nothing half-typed reaches the crew,
   and so a change arriving from another phone can't wipe what is being typed. The cost form keeps
   what was typed the same way (ui.cfm), on the sheet and the crew card. Materials are added from the
   tap list (Add materials), where each tap is saved at once. */
var JED_SECS={cust:{keys:['name','phone','email','from','to'],cf:true,label:'Customer and route'},notes:{keys:['notes'],label:'Job notes'}};
var JED_NAMES={name:'name',phone:'phone',email:'email',from:'pickup',to:'delivery',notes:'job notes'};
function jedSaved(j,k){return String((k.indexOf('cf:')===0?(j.d.custom||{})[k.slice(3)]:j.d[k])||'')}
function jv(j,k){var e=ui.jed[j.id];return e&&Object.prototype.hasOwnProperty.call(e,k)?e[k]:jedSaved(j,k)}
function jedSecOf(k){return k.indexOf('cf:')===0?'cust':JED_SECS.notes.keys.indexOf(k)>=0?'notes':'cust'}
function jedDirty(j,sec){var e=ui.jed[j.id]||{};return Object.keys(e).filter(function(k){return jedSecOf(k)===sec&&e[k]!==jedSaved(j,k)})}
function jedSet(j,k,v){
  var e=ui.jed[j.id]||(ui.jed[j.id]={});
  if(String(v)===jedSaved(j,k))delete e[k];else e[k]=String(v);
  if(!Object.keys(e).length)delete ui.jed[j.id];
  jedBars(j);
}
function matKey(ctx,id){return ctx+'_'+id}
// the small text on the right of a part's header on the job sheet
var SEC_TITLES={cust:'Customer and route',notes:'Job notes',mats:'Materials and costs'};
function secMeta(j,sec){
  if(sec==='cust')return (jedDirty(j,'cust').length?'Not saved · ':'')+(j.d.phone||'');
  if(sec==='notes')return jedDirty(j,'notes').length?'Not saved':j.d.notes?'added':'';
  var n=(j.materials||[]).length+(j.costs||[]).length,k=matKey('s',j.id);
  return (costDirty(k)?'Not saved'+(n?' · ':''):'')+(n||'');
}
function secMetaSync(j){
  Object.keys(SEC_TITLES).forEach(function(sec){
    var d=$('#sheet details[data-k="sh:'+SEC_TITLES[sec]+'"]'),sm=d&&d.querySelector('summary');if(!sm)return;
    var t=secMeta(j,sec),sl=sm.querySelector('small');
    if(!t){if(sl)sl.remove();return}
    if(!sl){sl=document.createElement('small');sm.appendChild(sl)}
    sl.textContent=t;
  });
}
function costDirty(key){var o=ui.cfm[key];return !!(o&&(String(o.l||'').trim()||moneyVal({value:o.a||''})>0))}
// what is still unsaved on the open job, in words
function sheetDirty(j){
  var out=[];
  if(jedDirty(j,'cust').length)out.push('the customer and route');

// save one part of the sheet; returns what changed (labels), or null when nothing did
function jedSave(j,sec){
  var keys=jedDirty(j,sec);if(!keys.length)return null;
  var e=ui.jed[j.id],who=myName()||'Office',names=[];
  keys.forEach(function(k){
    var v=e[k];
    if(k.indexOf('cf:')===0){j.d.custom=j.d.custom||{};j.d.custom[k.slice(3)]=v;var f=(state.settings.customFields||[]).find(function(x){return x.id===k.slice(3)});names.push(f?f.label:'a field')}
    else{j.d[k]=v;names.push(JED_NAMES[k]||k)}
    delete e[k];
  });
  if(!Object.keys(e).length)delete ui.jed[j.id];
  if(sec==='notes'){j.d.notesBy=who;j.d.notesAt=Date.now();logEv(j,(String(j.d.notes||'').trim()?'Job notes updated':'Job notes cleared')+' by '+who)}
  else logEv(j,'Customer details updated by '+who+': '+names.join(', '));

}
// save everything unsaved on the sheet; false when the cost can't go in as typed (it says why)
function jedSaveAll(j){
  var did=false,okAll=true;
  ['cust','notes'].forEach(function(sec){if(jedSave(j,sec))did=true});
  var key=matKey('s',j.id),who=myName()||'Office';

function costAddFrom(j,ctx,who){
  var key=matKey(ctx,j.id),o=ui.cfm[key]||{};
  var lel=$('#cost_l_'+key),ael=$('#cost_a_'+key),cel=$('#cost_c_'+key);
  var cl=String(lel?lel.value:(o.l||'')).trim(),ca=round2(moneyVal(ael||{value:o.a||''})),cc=cel?cel.value:(o.c||((state.settings.costCats||[])[0]||''));
  if(!cl){toast('Say what the cost was for.');return false}
  if(!(ca>0)){toast('Enter the amount.');return false}
  var c={id:uid(),label:cl,cat:cc,amt:ca,by:who,ts:Date.now()};
  j.costs=j.costs||[];j.costs.push(c);logEv(j,'Cost: '+cl+' '+money(ca)+' ('+who+')');
  delete ui.cfm[key];
  return c;

function nextAction(j){
  if(j.status==='lead')return {label:'Build quote',act:'sh:requote'};
  if(j.status==='quoted')return {label:'Book job',act:'sh:next'};
  if(j.status==='booked')return {label:'Start job',act:'sh:next'};
  if(j.status==='active')return {label:formsPending(j).length?'Get signatures and finish':'Finish job',act:'sh:next'};
  // finished but not settled: the payment screen (forms first when some are still unsigned)
  if(j.status==='done'&&canCollect()){var pn=formsPending(j).length;if(pn||balOf(j)>0)return {label:pn?'Sign forms and collect payment':'Collect payment',act:'flow:open',attrs:' data-id="'+j.id+'" data-who="Office"'}}
  return null;
}
/* the money tiles at the top of the job sheet, in the words that fit where the job is: a quote until
   the move is done, then the bill; a red balance only once it is due; nothing for a lead with no price */
// money tiles side by side, every number the same size: a smaller one for all when one is long ($1,458.25)
function kpiRow(T){
  var n=T.reduce(function(a,t){return Math.max(a,money(t[0]).length)},0),cls=n>10?' class="longer"':n>8?' class="long"':'';
  return '<div class="kpis" style="grid-template-columns:repeat('+T.length+',minmax(0,1fr))">'+T.map(function(t){return '<div class="kpi'+(t[2]?' '+t[2]:'')+'"><b'+cls+'>'+money(t[0])+'</b><span>'+t[1]+'</span></div>'}).join('')+'</div>';
}
function sheetMoney(j){
  var q=j.quote||{},paid=paidOf(j),bal=balOf(j),tot=totalOf(j),st=j.status,T=[];
  var k=function(v,l,c){T.push([v,l,c])};
  if(st==='lead'&&!(tot>0))return '';
  if(st==='done'||st==='paid'){k(tot,'Bill');k(paid,'Paid',paid>0?'paid':'');k(bal,bal>0?'Balance due':'Paid in full',bal>0?'due':'paid')}
  else if(st==='lost'){k(tot,'Quote');if(paid>0)k(paid,'Paid','paid')}
  else if(st==='lead'||st==='quoted'){k(tot,'Quote');if(q.deposit>0&&!(paid>0))k(q.deposit,'Deposit to book');if(paid>0)k(paid,'Paid','paid')}
  else{k(tot,'Quote');k(paid,'Paid',paid>0?'paid':'');k(bal,bal>0?'Left to pay':'Paid in full',bal>0?'':'paid')}
  var sv=savedOf(j);
  return kpiRow(T)+(sv?'<p class="hint money-paid saved">The customer saved '+money(sv)+' off the quote of '+money(q.total)+'.</p>':'');
}
function leaveBarHtml(j){
  if(!ui.closeAsk)return '';

}

    return '<div class="who" style="display:block;padding:10px 0"><div class="row between"><b>'+esc(j.d.name)+'</b><button class="btn sm ghost" data-act="job:open" data-id="'+j.id+'">Details</button></div><small>Missing '+miss.join(', ')+'</small>'+

      '<div class="grid2" style="margin-top:6px"><input type="date" class="inline-sel" aria-label="Date for '+esc(j.d.name)+'" data-dq="moveDate" data-id="'+j.id+'" value="'+esc(j.d.moveDate)+'"><input type="time" class="inline-sel" aria-label="Start time for '+esc(j.d.name)+'" data-dq="time" data-id="'+j.id+'" value="'+esc(j.d.time)+'"></div>'+
      truckDriverRows(j,'dq')+
      '<div class="scrollx" style="margin-top:6px">'+chips+'</div></div>'}).join('')+'</div></details>':'';
  var jobs=onDay(ui.day).sort(function(a,b){return startMin(a)-startMin(b)});
  var block=function(j,tid){
    var cf=conflictsFor(j).length,dr=tid&&driversOn()?driverOf(j,tid):'',drv=tid&&driversOn()?(dr?'<small class="drv">Driver: '+esc(dr)+'</small>':'<small class="drv no">No driver</small>'):'';
    return '<button class="block'+(j.status==='quoted'?' tent':'')+(cf?' clash':'')+'" data-act="job:open" data-id="'+j.id+'"><span class="tm">'+fmtTime(j.d.time)+' · '+esc(j.d.name)+(j.test?' · test':'')+'</span><small>'+esc((j.d.from||'?')+' → '+(j.d.to||'?'))+'</small>'+(!tid&&slotIds(j).length?'<small>Lined up in '+esc(slotWords(S,slotIds(j)))+'</small>':'')+'<small>'+(j.assign.crew.length?esc(j.assign.crew.join(', ')):'No crew')+' · '+(j.quote.hours||3)+' h'+(needsConfirm(j)&&j.assign.crew.length?' · '+j.assign.crew.filter(function(c){return isConfirmed(j,c)}).length+'/'+j.assign.crew.length+' confirmed':'')+'</small>'+drv+'<span>'+pill(j.status)+(cf?' <span class="pill bad">Double-booked</span>':'')+'</span></button>'};
  var used={},crewUsed={};

  var down=sosActive();
  var lanes=S.trucks.map(function(tr){
    var mine=jobs.filter(function(j){return jobTrucks(j).indexOf(tr.id)>=0});
    var hrs=mine.reduce(function(a,j){return a+dayHours(j)},0);

  var dt=parseISO(ui.day);
  var head='<div class="row between" style="margin:2px 0 8px"><h2>'+esc(dt.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}))+'</h2><div class="row"><button class="btn sm ibtn" data-act="wk" data-n="-7" aria-label="Previous week">←</button><button class="btn sm" data-act="wk" data-n="0" style="min-height:40px">Today</button><button class="btn sm ibtn" data-act="wk" data-n="7" aria-label="Next week">→</button></div></div>';
  var drvAll=driversOn()?(S.drivers||[]).filter(function(n){return assignable().indexOf(n)>=0}):[],drvFree=drvAll.filter(function(n){return !crewUsed[n]});
  var cap='<p class="hint" style="margin:0 2px 10px">'+S.crew.filter(function(n){return crewUsed[n]}).length+' of '+S.crew.length+' crew working'+(officeOn.length?' · plus '+esc(officeOn.join(', ')):'')+(free.length?' · free: '+esc(free.join(', ')):'')+
    (drvAll.length?'<br>Drivers free: '+(drvFree.length?esc(drvFree.join(', ')):'none')+' of '+drvAll.length:'')+'</p>';
  var goneHtml=gone&&jobs.length?'<div class="secline"><small>'+gone+' finished job'+(gone===1?'':'s')+' from this day</small><button data-act="hist:go" data-q="'+esc(ui.day)+'">Job history ›</button></div>':'';
  var emptyHtml=gone?'<div class="card empty"><h3>Nothing open this day</h3><p>'+gone+' finished job'+(gone===1?' is':'s are')+' in Job history.</p><button class="btn" data-act="hist:go" data-q="'+esc(ui.day)+'">Open Job history</button></div>':
    '<div class="card empty"><h3>Nothing scheduled</h3><p>Pick another day, or book a job from a quote.</p></div>';
  // who's off this day: the call center books by the movers left (Richie, Oct 25: the office marks days off)
  var offs=((S.daysOff||{})[ui.day]||[]).filter(function(n,i,a){return S.crew.indexOf(n)>=0&&a.indexOf(n)===i}),offHtml=canEditJobs()?'<details class="acc card" data-k="d:off"'+(ui.open['d:off']?' open':'')+'><summary><span>Who’s off</span><small>'+(offs.length?esc(offs.join(', ')):'Nobody')+'</small></summary><div class="acc-body">'+
    '<p class="hint" style="margin:0 0 8px">'+(canSetOff()?'Tap who’s off '+esc(fmtDate(ui.day))+'. ':esc(fmtDate(ui.day))+': ')+esc(moversWords(moversOn(ui.day,S),false))+'; bookings count the movers on.</p><div class="chips">'+
    S.crew.map(function(n){var on=offs.indexOf(n)>=0;return '<button class="chip'+(on?' on':'')+'" data-act="off:tog" data-n="'+esc(n)+'" aria-pressed="'+on+'"'+(canSetOff()?'':' disabled')+'>'+esc(n)+(on?' · off':'')+'</button>'}).join('')+'</div>'+(canSetOff()?'':'<p class="hint" style="margin:8px 0 0">The owner marks who’s off.</p>')+'</div></details>':'';
  v.innerHTML=strip+head+cap+offHtml+needHtml+locCard()+goneHtml+(jobs.length?looseHtml+lanes:emptyHtml+looseHtml+lanes);
  var on=$('.dpill.on',v);if(on&&on.scrollIntoView)try{on.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
}

/* ---------- CREW ---------- */
/* The field card for one job, as the crew member or lead `me` sees it (used by the crew's Jobs screen and its History).
   Always in the same order and all open, before, during and after the job: status, the customer, the day, the
   crew and every truck with its driver, pickup and delivery, Notes for the job, Materials, Photos; then the part
   for running the job (Start job, Call, the move's steps, Load tally, quick updates, the bill for leads). */
// who can take a customer's payment: the owner, and dispatch and crew leads unless Options turns it off
function canCollect(){var r=state.ui.role;return r==='owner'||(r==='dispatch'&&opt('dispatchPay'))||(r==='lead'&&opt('leadPay'))}
function canCharge(){var r=state.ui.role;return r==='owner'||r==='dispatch'||(r==='lead'&&opt('leadCharges'))}
// Options › Photos before finishing: what's still missing ('' when nothing is, or the switch is off)
function photosMissing(j){
  if(!opt('photosReq'))return '';
  var has=function(k){return (j.photos||[]).some(function(p){return p.kind===k})},p=has('Pickup'),d=has('Delivery');
  return p&&d?'':'Take '+(!p&&!d?'a pickup photo and a delivery photo':!p?'a pickup photo':'a delivery photo')+' before you finish the job.';
}
/* ---------- A new quote on site (Richie, Oct 21) ----------
   "if the crew shows up and the inventory is off . Then the lead show be able to go room for room entering
   items to make a new quote and then summit it to the dispatch for approval. Or maybe just have a place to
   sign by the customer so its approved by customer. Then they know what to expect for the move."
   From the job card, before the move or during it, the crew lead goes room by room. The new quote is worked
   out the way the office's is (calc), at the rates on the job's quote (rqSettings), for the crew and truck on
   the job; the deposit stays as booked. It goes on the job only when the customer signs it, and the office is
   told. With Options › Office approves new quotes, the owner or dispatch says yes first (j.rq.state
   'waiting', then 'approved'); their yes is written into the job's quote (quote.rqOk), which only the office
   can change, so the server can tell it's real. Every quote it replaces stays on the job (j.quoteHist).
   On the hosted app only the office may change a job's quote (the database's jobs_guard), so a crew lead's
   signed quote goes to the server, which works the price out again and saves it (window.tallyQuote).
   j.rq.state: 'waiting' | 'approved' | 'declined' (the office said no) | 'done' (signed, on the job) |
   'refused' (the customer didn't agree) | 'cancelled' (the lead took it back). */
function rqOn(){return opt('rqCrew')}
function rqAsk(){return opt('rqOffice')&&!canEditJobs()}   // this one waits for the office's yes first
function rqLive(j){return !!j&&['booked','active'].indexOf(j.status)>=0&&!j.clockAt}
// a waiting or approved new quote stops counting when the office changes the job's quote after it was made
function rqStale(j){var r=j&&j.rq;return !!r&&(r.state==='waiting'||r.state==='approved')&&Math.abs(num(r.was)-num((j.quote||{}).total))>=0.005}
function rqCan(j,me){
  var q=j&&j.quote;
  if(!rqOn()||!rqLive(j)||!q||!(num(q.cf)>0)||!(q.kind==='local'||q.kind==='mileage'))return false;
  if(j.rq&&(j.rq.state==='waiting'||j.rq.state==='approved')&&!rqStale(j))return false;
  if((state.ui.rqPend||{})[j.id])return false;
  var r=state.ui.role;return r==='owner'||r==='dispatch'||(r==='lead'&&isLead(me)&&j.assign.crew.indexOf(me)>=0);
}
// items as a list sorted by id (how they're kept in j.rq and the history, so a saved copy replaces cleanly)
function rqItemsArr(m){return Object.keys(m||{}).filter(function(k){return m[k]>0}).sort().map(function(k){return {id:k,q:m[k]}})}
function rqItemsMap(a){var m={};(Array.isArray(a)?a:[]).forEach(function(x){if(x&&x.id&&x.q>0)m[x.id]=x.q});return m}
function rqCf(items){var cf=0;state.settings.catalog.forEach(function(it){cf+=(items[it.id]||0)*it.cf});return cf}
function rqDraftOf(j){
  var have={},it={},m=j.d.items||{};state.settings.catalog.forEach(function(i){have[i.id]=1});
  Object.keys(m).forEach(function(k){if(have[k]&&m[k]>0)it[k]=m[k]});
  return {items:it,flights:num(j.d.flights)||0,pack:!!j.d.pack};
}
// the rate card the job was quoted at: the hourly rate, mileage rate, tax and minimum from the quote, and the
// truck, stair and packing fees from its lines; the rest (the items, the trucks) from Setup as it is now
function rqSettings(j){
  var S=state.settings,q0=j.quote||{},o=Object.assign({},S.opt||{});
  var S2=Object.assign({},S,{rates:Object.assign({},S.rates),opt:o});
  var crew=num(q0.crew);
  if(crew&&num(q0.rate)>0)S2.rates['r'+crew]=num(q0.rate);
  if(q0.mileRate!=null)S2.mileRate=num(q0.mileRate);
  if(q0.taxPct!=null){S2.taxPct=num(q0.taxPct);o.tax=num(q0.taxPct)>0}
  if(q0.minHours!=null)S2.minHours=num(q0.minHours);
  if(typeof q0.flat==='boolean')o.byClock=!q0.flat;
  if(typeof q0.capNte==='boolean')S2.nteCap=q0.capNte;
  if(typeof q0.shopTravel==='boolean')S2.shopTravel=q0.shopTravel;
  var L=Array.isArray(q0.lines)?q0.lines:[],line=function(re){for(var i=0;i<L.length;i++)if(L[i]&&re.test(String(L[i].label)))return L[i];return null};
  if(L.length){
    var tl=line(/^(\d+ trucks|Truck) and fuel$/);o.truckFee=!!tl;if(tl)S2.truckFee=num(tl.amt)/Math.max(1,num(q0.nTrucks));
    var fl=num(j.d.flights),sl=line(/^Stairs: /);if(sl&&fl>0){o.stairs=true;S2.stairFee=num(sl.amt)/fl}
    var pl=line(/^Packing and materials: \d+ boxes$/),bx=pl?parseInt(String(pl.label).replace(/\D+/g,''),10):0;if(pl&&bx>0){o.packing=true;S2.packPerBox=num(pl.amt)/bx}
  }
  return S2;
}
// the new quote for these items: {d, q, items}
function rqBuild(j,dr){
  var q0=j.quote||{},S2=rqSettings(j),d=clone(j.d);
  d.items=clone(dr.items);d.flights=num(dr.flights)>0?String(num(dr.flights)):'';d.pack=!!dr.pack;
  if(q0.crew)d.crew=String(q0.crew);   // the crew the job was priced for
  if(q0.kind==='local'||q0.kind==='mileage')d.moveKind=q0.kind;
  if(j.assign&&j.assign.truckId)d.truckId=j.assign.truckId;   // the truck on the job; more go on the quote when it won't fit
  // hours the office set by hand grow and shrink with the load
  var ho=num(j.d.hoursOverride);d.hoursOverride=ho>0?String(Math.max(num(S2.minHours),Math.ceil(ho*rqCf(d.items)/num(q0.cf)*2)/2)):'';
  var q=calc(d,S2);q.deposit=num(q0.deposit);   // the deposit stays as booked
  return {d:d,q:q,items:itemsOf(d,S2)};
}
// what's different from the job as quoted, in words
function rqChanges(j,dr){
  var old=j.d.items||{},out=[];
  state.settings.catalog.forEach(function(it){var a=old[it.id]||0,b=dr.items[it.id]||0;if(a!==b)out.push({n:b-a,t:(b>a?'+':'−')+Math.abs(b-a)+' '+it.name+(a&&b?' ('+a+' → '+b+')':'')})});
  var f0=num(j.d.flights)||0,f1=num(dr.flights)||0;
  if(f0!==f1)out.push({t:'Stairs: '+f0+' → '+f1+' flight'+(f1===1?'':'s')});
  if(!!j.d.pack!==!!dr.pack)out.push({t:dr.pack?'Packing service added':'Packing service taken off'});
  return out;
}
function rqMake(j,o){
  var b=rqBuild(j,o.dr);
  return {id:uid(),by:o.who||myName()||'',ts:Date.now(),was:num(j.quote.total),
    d:{items:rqItemsArr(b.d.items),flights:b.d.flights,pack:b.d.pack,hoursOverride:b.d.hoursOverride},quote:b.q,items:b.items,
    note:String(o.note||'').trim().slice(0,500),changes:rqChanges(j,o.dr).map(function(c){return c.t}).slice(0,60),
    // every key there from the start (null), so a saved copy of an earlier new quote can't leave any behind
    state:'',sig:null,ok:null,no:null,seen:null,applied:null,refused:null,cancel:null};
}
// what the office's yes is for: these items at this price (the server checks it the same way)
function rqKey(rq){return strHash(canon({items:rq.d.items,flights:String(rq.d.flights||''),pack:!!rq.d.pack,total:num(rq.quote.total)}))}
function rqHistEntry(j,rq,now){
  var was=clone(j.quote||{});delete was.rqOk;
  return {id:rq.id,ts:now,by:rq.by||'',was:was,wasItems:clone(j.items||[]),
    wasD:{items:rqItemsArr(j.d.items),flights:j.d.flights||'',pack:!!j.d.pack,hoursOverride:j.d.hoursOverride||''},
    now:num(rq.quote.total),why:rq.note||'',changes:(rq.changes||[]).slice(0,60),
    sign:rq.sig?{name:rq.sig.name,img:rq.sig.img||'',ts:rq.sig.ts}:null,ok:rq.ok||null};
}
// puts a signed new quote on the job, here (the office's phones and the claude.ai copy; a crew lead's phone on
// the hosted app sends it to the server instead, rqSend). The quote it replaces goes in the job's history.
function rqApply(j,rq){
  var now=Date.now();
  j.quoteHist=(j.quoteHist||[]).concat([rqHistEntry(j,rq,now)]).slice(-10);
  var nq=clone(rq.quote);if(j.quote&&j.quote.rqOk)nq.rqOk=null;   // the office's yes is used up (null, so the shared copy drops it too)
  j.quote=nq;j.items=clone(rq.items);
  j.d.items=rqItemsMap(rq.d.items);j.d.flights=rq.d.flights||'';j.d.pack=!!rq.d.pack;j.d.hoursOverride=rq.d.hoursOverride||'';
  rq.state='done';rq.applied=now;if(rq.sig)rq.sig={name:rq.sig.name,ts:rq.sig.ts,by:rq.sig.by||''};   // the signature itself stays in the history
  j.rq=rq;
  logEv(j,'New quote on site'+(rq.by?' by '+rq.by:'')+': '+money(rq.was)+' → '+money(rq.quote.total)+(rq.sig?', signed by '+rq.sig.name:''));
}
// a crew lead's signed quote on the hosted app is saved by the server (the office's phones save their own)
function rqServer(){return !!window.tallyQuote&&!canEditJobs()}
function rqSend(j,rq,o){
  rqBusy(true);rqFail('');
  window.tallyQuote.sign(j.id,rq).then(function(r){
    rqBusy(false);
    if(r&&r.ok){sigDirty=false;rqDone(o,rq);window.tallyQuote.refresh();toast('The new quote is on the job. The office has been told.');return}
    if(r&&r.final){rqFail(r.message||'The new quote couldn’t be saved.');return}
    // no connection to the office: kept on this phone, and sent again until it's saved
    state.ui.rqPend=state.ui.rqPend||{};state.ui.rqPend[j.id]=rq;save();sigDirty=false;o.pend=true;rqDone(o,rq);renderTab();
  });
}
function rqDone(o,rq){if(ui.rqo!==o)return;o.step='done';o.total=num(rq.quote.total);o.signedBy=rq.sig?rq.sig.name:'';renderRq()}
function rqBusy(on){var b=$('#rq [data-act="rq:sign"]');if(ui.rqo)ui.rqo.busy=on;if(b){b.disabled=on;b.textContent=on?'Saving…':'Sign and save'}}
function rqFail(m){var o=ui.rqo;if(o)o.err=m;var e=$('#rqErr');if(e){e.textContent=m;e.style.color=m?'var(--bad)':''}}
var rqRetryAt=0;
function rqRetry(force){
  var p=state.ui.rqPend||{},ids=Object.keys(p);if(!ids.length||!window.tallyQuote)return;
  if(!force&&Date.now()-rqRetryAt<45000)return;rqRetryAt=Date.now();
  ids.forEach(function(id){var rq=p[id],nm=(byId(id)||{d:{}}).d.name||'the job';
    window.tallyQuote.sign(id,rq).then(function(r){
      if(r&&(r.ok||r.final)){delete (state.ui.rqPend||{})[id];save();toast(r.ok?'The new quote for '+nm+' is saved. The office has been told.':(r.message||'The new quote for '+nm+' couldn’t be saved.'));window.tallyQuote.refresh();renderTab()}
      else if(force)toast('Still no connection to the office. The phone keeps trying on its own.');
    });
  });
}
setInterval(function(){if(!document.hidden)rqRetry(false)},60000);
window.addEventListener('online',function(){rqRetry(true)});

/* the screen: room by room, then check it, then the customer signs */
function rqOpen(id,who,step){
  var j=byId(id);if(!j)return;
  ui.rqo={jobId:id,who:who||'',step:step||'items',dr:rqDraftOf(j),note:'',err:'',busy:false,leave:false,rq:step==='sign'&&j.rq?clone(j.rq):null};
  renderRq();var b=$('#rq .flow-body');if(b)b.scrollTop=0;
}
function rqClose(){ui.rqo=null;renderRq();renderTab();renderSheet()}
function rqDirty(){var o=ui.rqo,j=o&&byId(o.jobId);if(!o||!j||o.step==='done'||o.step==='sent'||o.rq)return false;return rqChanges(j,o.dr).length>0||!!String(o.note||'').trim()}
function rqExit(){var o=ui.rqo;if(!o)return;if(rqDirty()&&!o.leave){o.leave=true;rqLeaveBar();var l=$('#rq .rq-leave .btn');if(l)try{l.focus()}catch(e){}return}rqClose()}

function rqNotice(){
  var me=myName(),office=canEditJobs(),m={};
  state.jobs.forEach(function(j){var r=j.rq;if(r&&r.id)m[j.id]=r.id+':'+r.state});
  if(rqSeen.me===me&&rqSeen.m){
    Object.keys(m).forEach(function(id){
      if(m[id]===rqSeen.m[id])return;
      var j=byId(id),r=j&&j.rq,nm=(j&&j.d.name)||'a job';if(!r||!r.quote)return;
      if(office&&r.by!==me){
        if(r.state==='waiting')toast((r.by||'The crew')+' made a new quote for '+nm+': '+money(r.quote.total)+' (was '+money(r.was)+'). It’s waiting for you to approve it.');
        else if(r.state==='done')toast((r.by||'The crew')+' made a new quote for '+nm+': '+money(r.quote.total)+' (was '+money(r.was)+'), signed by '+((r.sig&&r.sig.name)||'the customer')+'.');
        else if(r.state==='refused')toast('The customer didn’t agree to the new quote on '+nm+'.');
      }else if(!office&&r.by===me){
        if(r.state==='approved')toast(((r.ok&&r.ok.by)||'The office')+' approved the new quote for '+nm+'. Have the customer sign it.');
        else if(r.state==='declined')toast(((r.no&&r.no.by)||'The office')+' didn’t approve the new quote for '+nm+'.');
      }
    });
  }
  rqSeen={me:me,m:m};
}

/* ---------- Movers joining or leaving on site (Richie, Oct 21) ----------
   "If a mover has to be added to the job we need a way for the lead to add the guy when he shows up. So the
   bill starts with 2 movers for 2 hours and then the last 3 hours with 4 movers."
   Then (Oct 24): "When a job is booked as a 2 man move and the office decides to put 3 people on the job the bill
   should reflect the people put on the job not the quoted amount of people".
   A change on site, j.crewAdj ({id, ts: when it took effect, d: +1 joined or −1 left, who, by, at: when it was
   put in, added: put on the job's crew by it}). The movers on the bill (billCrewAt) are the people on the job's
   crew: each for the whole job, except that someone with a change on site counts from when they joined and until
   they left. So a crew that goes out short is billed for who went out ("if it was booked and quoted as a three man,
   but only two guys go out because someone gets sick or calls in, then the bill is only two"). A job nobody was put
   on yet, and a bill made before Oct 24 (billOld), keep the quote's crew plus the changes. Putting someone on the
   crew, or taking them off it (the crew chips), is for the whole job, so a change on site put in for them goes
   (crewPut). The bill by the clock charges each stretch at that crew's rate, one row each (clockBill, billHours):
   "2 movers, 1.5 hr at $140/hr", then "3 movers, 1.5 hr at $195/hr" with the minimum filled in at the end. The

      return '<div class="who"><span>'+esc(e.who)+(e.d>0?' joined ':' left ')+esc(mvWhen(j,e))+'<br><small>Put in by '+esc(e.by||'the crew')+(mvBills(j)?' · '+billCrewAt(j,e.ts)+' on the bill after':'')+'</small></span>'+
        (mvCanUndo(j,m.who)?'<button class="btn sm ghost" data-act="mv:undo" data-e="'+e.id+'" aria-label="Take back '+esc(e.who)+(e.d>0?' joining':' leaving')+'">Take back</button>':'')+'</div>'}).join('')+'</div>':'';
  var form=can?'<div class="crewtabs mv-tabs" role="tablist"><button role="tab" class="'+(join?'on':'')+'" aria-selected="'+join+'" data-act="mv:mode" data-m="join">Someone joined</button><button role="tab" class="'+(join?'':'on')+'" aria-selected="'+!join+'" data-act="mv:mode" data-m="left">Someone left</button></div>'+
      '<div class="f"><span>'+(join?'Who joined?':'Who left?')+'</span></div><div class="chips">'+(chips||'<small>'+(join?'Everyone on the list is on this job already.':'Nobody else is on this job.')+'</small>')+'</div>'+
      (join?'<label class="f" style="margin-top:6px"><span>Someone not on the list</span><input id="mvOther" placeholder="Their name" autocomplete="off" value="'+esc(m.other||'')+'"></label>':'')+
      '<div class="f" style="margin-top:10px"><span>When?</span></div><div class="chips">'+when+'</div>'+
      '<p class="hint mv-what" id="mvWhat">'+what+'</p>'+
      '<button class="btn primary bigbtn" data-act="mv:save"'+(name?'':' disabled')+'>'+(name?(join?'Add '+esc(name)+' to the job':esc(name)+' left'):(join?'Pick who joined':'Pick who left'))+'</button>'
    :'<p class="hint">'+(['booked','active'].indexOf(j.status)<0?'The job is finished, so nobody more joins or leaves.':'Crew leads can’t change the crew on site (Options).')+'</p>';
  el.innerHTML='<div class="scrim" data-act="mv:close"></div><div class="panel" role="dialog" aria-modal="true" aria-label="Movers on the job">'+
    '<div class="row between"><h2>Movers on '+esc(j.d.name||'the job')+'</h2><button class="btn sm" data-act="mv:close">Close</button></div>'+
    (mvBills(j)?'<p class="hint" style="margin:2px 0 8px">On the bill now: '+esc(mvSummary(j))+'.</p>':'')+form+list+'</div>';
  el.hidden=false;syncLock();
}
// someone joining would make the crew bigger than the customer signed for (crewForm)
function mvSignMore(j,join,n1){return !!join&&crewSignOn(j)&&(j.status==='booked'||!!j.crewAsk)&&n1>Math.max(num((j.quote||{}).crew)||2,crewSigned(j))}
// the pay line on the card for someone who joined late or left early: their own time, at least the minimum
function mvPayHours(j,who){
  var A=crewAdjs(j).filter(function(e){return e.who===who});if(!A.length||!j.finishedAt)return null;
  var from=j.startedAt||0,to=j.finishedAt;
  A.forEach(function(e){if(e.d>0&&e.ts>from)from=e.ts;if(e.d<0&&e.ts<to)to=e.ts});

// the movers on the bill in words, for the bill's explanation (the job sheet, the lead's Quote part): who's on
// it so far, before the bill; on the bill, each crew's rate (the hours of each are in the words before it)
function mvNote(j,c){
  if(!mvOther(j))return '';
  var q=j.quote||{},base=num(q.crew)||2,segs=((c&&!c.missing&&c.segs)||[]).filter(function(s){return s.h>1e-9});
  var mv=function(n){return n+' mover'+(n===1?'':'s')};
  if(!segs.length){
    // before the bill: more movers than quoted cost more than the quote, so the customer should know
    var S=mvSteps(j),tell=S.some(function(s){return s.n>base})?crewTell(j):'';
    if(S.length===1)return ' The bill is for '+mv(S[0].n)+' at '+money(mvRate(j,S[0].n))+'/hr, the people on the job; the quote is for '+base+' at '+money(q.rate)+'/hr'+tell+'.';
    return ' Movers on the bill so far: '+esc(mvSummary(j))+'. Each crew is billed at its own rate'+tell+'.';
  }
  if(segs.length===1)return segs[0].n===base?'':' Billed for '+mv(segs[0].n)+' at '+money(segs[0].rate)+'/hr; the quote is for '+base+' at '+money(q.rate)+'/hr.';
  var seen={};
  return ' Each crew at its own rate: '+segs.filter(function(s){if(seen[s.n])return false;seen[s.n]=1;return true}).map(function(s){return mv(s.n)+' '+money(s.rate)+'/hr'}).join(', ')+'.';
}

/* ---------- the call center (Richie, Oct 22: "I guess i also need a call center side . They will not see anything
   but scheduled jobs and being able to make quotes"; then: "Call center is a service that the moving companys will be
   able to purchase to help get bookings . So call center will only be able to see companys that pay for that
   service .") ----------
   Tally's own team (Tally admin lists them, and switches the service on for each company that buys it), not a
   company's employees. Four screens: Companies (below: a map of the companies, their rate cards, Make a quote),
   and for the company they're working in, Schedule (a calendar of how busy each day is, and each day's jobs: the
   customer, the day and time, the addresses, the items and the crew size, no prices or payments), New quote (the
   round button; the crew size, truck, hours and move type can change the price, but only the office gives a
   discount) and Quotes (every open quote and lead: open one to change it or book it, call the customer, or mark it
   lost). Booking needs the move date, so the job lands on the schedule; dispatch adds the crew and trucks. In the
   hosted app the database keeps them to that (supabase-callcenter.sql): only companies with the service, and of
   those the rate card (a copy without the company's own business), the open quotes and a copy of the scheduled
   jobs without the money; they write only open quotes (booking one is their last change), and can't change a
   discount or a payment. The owner sees it all through See it their way › Call center. */
function isCC(){return state.ui.role==='callcenter'||ccToo()}
function canQuote(){var r=state.ui.role;return r==='owner'||r==='dispatch'||r==='callcenter'||ccToo()}
// the call center person: signed in (the hosted app), or the one picked in See it their way
function ccName(){return String((ccDb()?sync.identity.staff:(previewing()&&ui.preview.role==='callcenter'?ui.preview.staff:(ccHouse()?viewerName():'')))||'')}
function ccWho(){var n=ccName();return n?n+' (call center)':'the call center'}
function isOpenQuote(j){return !!j&&(j.status==='lead'||j.status==='quoted')}
var SCHED_ST=['booked','active'];
// a scheduled job as the call center sees it: everything but the money (supabase-callcenter.sql's sched_of)
function schedOf(j){
  var q=j.quote||{},a=j.assign||{},d=j.d||{};
  return {id:j.id,status:j.status,test:!!j.test,
    d:{name:d.name||'',phone:d.phone||'',email:d.email||'',moveDate:d.moveDate||'',time:d.time||'',from:d.from||'',to:d.to||'',notes:d.notes||'',flights:d.flights||'',custom:d.custom||{},slots:Array.isArray(d.slots)?d.slots.slice():[]},
    items:(j.items||[]).map(function(i){return {id:i.id,name:i.name,qty:i.qty}}),
    quote:{crew:q.crew,hours:q.hours,kind:q.kind,driveH:q.driveH,nTrucks:q.nTrucks,truckId:q.truckId,truckName:q.truckName},
    assign:{truckId:a.truckId||'',more:(a.more||[]).slice(),crewN:(a.crew||[]).length},startedAt:j.startedAt||0};
}
// signed in as the call center (not the owner seeing it their way)
function ccDb(){return sync.mode==='shared'&&sync.identity.status==='ok'&&sync.identity.role==='callcenter'}
// the hosted call center reads the scheduled jobs from the database's copy; everyone else from the jobs
function schedFromDb(){return !!window.TALLY_SCHED&&(ccDb()||(sync.mode==='shared'&&sync.identity.status==='ok'&&ccHouse()))&&!previewing()}
// the hosted app asks before saving a job: a company's own call center person saves a quote, or a booking, through
// cc_save; a job they're on goes the usual way
window.tallyCcVia=function(id,obj){
  if(!ccHouse()||!(sync.mode==='shared'&&sync.identity.status==='ok'))return false;
  var j=obj&&obj.assign?obj:byId(id),me=viewerName();
  return !(j&&j.assign&&(j.assign.crew||[]).indexOf(me)>=0);
};
function schedRec(v){   // a copy from the database, filled out so the screens can count on its shape
  if(!v||typeof v!=='object'||!v.id)return null;
  var d=v.d||{},q=v.quote||{},a=v.assign||{};
  return {id:String(v.id),status:v.status,test:!!v.test,d:{name:d.name||'',phone:d.phone||'',email:d.email||'',moveDate:d.moveDate||'',time:d.time||'',from:d.from||'',to:d.to||'',notes:d.notes||'',flights:d.flights||'',custom:(d.custom&&typeof d.custom==='object')?d.custom:{},slots:Array.isArray(d.slots)?d.slots.filter(function(x){return typeof x==='string'}):[]},
    items:(Array.isArray(v.items)?v.items:[]).filter(function(i){return i&&i.name}),quote:q,assign:{truckId:a.truckId||'',more:Array.isArray(a.more)?a.more:[],crewN:num(a.crewN)},startedAt:num(v.startedAt)};
}
function schedRecs(){
  if(schedFromDb()){
    var have={},out=(state.sched||[]).filter(function(r){if(r&&SCHED_ST.indexOf(r.status)>=0){have[r.id]=1;return true}return false});
    return out.concat(state.jobs.filter(function(j){return SCHED_ST.indexOf(j.status)>=0&&!have[j.id]}).map(schedOf));
  }
  return state.jobs.filter(function(j){return SCHED_ST.indexOf(j.status)>=0}).map(schedOf);
}
function pullSched(snap){
  state.sched=snap.docs.map(function(d){return schedRec(d.data())}).filter(Boolean);
  if(ui.tab==='sched'||ui.tab==='quote')softRefresh();
}
// how busy a day is, by the trucks' timelines (planDay): its jobs, and how many trucks still have room for a move
// of the minimum hours. lvl: 0 nothing booked, 1 some, 2 room on half the trucks or fewer, 3 no room
function dayLoad(day,recs,skip){return dayLoadIn(day,recs||schedRecs(),state.settings,skip)}
function dayLoadIn(day,recs,card,skip){
  var P=planDay(day,recs,card,skip),fleet=P.trucks.length,need={hours:Math.max(2,num((card||{}).minHours)||2),crew:2,trucks:1,cf:0};
  var open=P.trucks.filter(function(t){for(var s0=P.cfg.start;s0+need.hours*60<=P.cfg.start+P.cfg.hours*60;s0+=30){if(laneFree(P.lanes[t.id],s0,s0+need.hours*60,P.cfg)&&(!P.movers||moversBusy(P.blocks,s0,s0+need.hours*60)+need.crew<=P.movers.n))return true}return false}).length;
  var list=P.blocks.map(function(b){return b.r}),few=!!(P.movers&&P.movers.n<need.crew);
  return {jobs:list.length,fleet:fleet,open:open,list:list,plan:P,few:few,lvl:fleet&&!open?3:!list.length?0:fleet&&open*2<=fleet?2:1};
}
function loadWords(L){
  var M=L.plan&&L.plan.movers;
  if(!L.jobs)return L.fleet&&!L.open?(L.few?(M&&M.n?'nothing booked, but only '+M.n+' mover'+(M.n===1?'':'s')+' on':'nothing booked, but no movers on'):'nothing booked, but no room'):'nothing booked yet';
  return L.jobs+' job'+(L.jobs===1?'':'s')+' booked'+(L.fleet?', '+(L.open?'room in '+L.open+' of '+L.fleet+' slot'+(L.fleet===1?'':'s'):'no room left'):'');
}
/* ---------- the day plan: each truck's timeline ----------
   Richie, Oct 25: "each truck represents a crew slot and they can book to that but then top number of movers needs to
   be in there per truck and available for dispatch"; a truck takes "as many as they can complete in like 12 hrs but
   maybe 4 tops per truck if all addresses are close and they can get them done . I feel like booking should see a
   timeline for each truck slot"; "if it can fit on a truck slot timeline for the day then it works if not than they
   should suggest another day or switch companys"; "if the job calls for 5 movers 1 truck then it should say that in
   scheduling"; the office marks days off.
   Then: "Call center doent actually assign the truck . They line up the day depending on length and distance . But the
   call center is a real person so it should be something they look and drag and drop to a slot . Dispatch selects the
   truck and crew members." and "If its a 2 truck it takes up 2 slots for that amount of time".
   Each truck is a slot (smallest first). A slot's day starts at Setup › Fleet's start (7:00 AM) and lasts its hours
   (12), with up to its moves (4) and the time between moves (60 minutes, the same as the double-booked check) around
   each. A move's block is its start time for its estimated hours (a mileage move's drive in). The person booking drags
   the move onto a slot (or taps one) and it is kept with the move (d.slots: the slots' truck ids, a move of two trucks
   in two); booking never puts a truck on the job: dispatch does, on the Board. On the plan a job sits on the trucks
   dispatch gave it, else in its slots, else in the first slots big enough and free then. The movers on a day are the
   crew list less who the office marked off (the Board's Who's off). A move fits in a slot at a time when the slot is
   big enough for its load and free then (under its moves, with the time between), and the movers busy then, with it,
   are no more than the movers on the day. `card` is a company's settings: this company's own, or another's rate card
   copy on the call center's desk (counts of movers, never names; none in an older copy: the slots alone decide). */
var TDAY={start:'07:00',hours:12,jobs:4,gap:60};
function hrsN(h){return String(Math.round(num(h)*100)/100)}
function hmMin(t){var m=/^(\d{1,2}):(\d{2})/.exec(String(t||''));return m?(+m[1])*60+(+m[2]):null}
function minHm(m){m=Math.max(0,Math.round(m));return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function dayCfg(card){
  var c=(card&&card.truckDay)||{},s0=hmMin(c.start);
  return {start:s0==null?hmMin(TDAY.start):s0,hours:num(c.hours)>0?Math.min(24,num(c.hours)):TDAY.hours,jobs:num(c.jobs)>0?Math.round(num(c.jobs)):TDAY.jobs,
    gap:c.gap!=null&&String(c.gap)!==''&&num(c.gap)>=0?num(c.gap):TDAY.gap};
}
// the movers on a day: {n, all, off, who} (who: the names, for the office), or null when the card doesn't say. A rate
// card copy has the counts (movers); the company's own settings the crew list, less who's off that day. The hosted call
// center's settings are the copy over an empty crew, so the counts come first.
function moversOn(day,card){
  var m=card&&card.movers;if(m&&typeof m==='object'&&num(m.n)>0){var o=Math.min(num(m.n),num((m.off||{})[day]));return {n:num(m.n)-o,all:num(m.n),off:o,who:[]}}
  if(card&&Array.isArray(card.crew)&&card.crew.length){var crew=card.crew,off=((card.daysOff||{})[day]||[]).filter(function(n,i,a){return crew.indexOf(n)>=0&&a.indexOf(n)===i});return {n:crew.length-off.length,all:crew.length,off:off.length,who:off}}
  return null;
}
function truckCf(card,id){var t=((card&&card.trucks)||[]).filter(function(x){return x.id===id})[0];return t?num(t.cf):0}
// what a move needs: its hours, movers, trucks, and how big each truck must be (the quoted truck's size)
function needOf(q,card){
  q=q||{};var n=Math.max(1,num(q.nTrucks)||1);
  return {hours:Math.max(0.5,num(q.hours)||3)+(q.kind==='mileage'?num(q.driveH):0),crew:Math.max(1,num(q.crew)||2),trucks:n,cf:truckCf(card,q.truckId)||Math.ceil(num(q.cf)/n)};
}
// a scheduled job as a block on its day: start and end (minutes), movers, its trucks, what it needs
function blockOf(r,card){
  var q=r.quote||{},s0=startMin(r),a=r.assign||{},need=needOf(q,card);
  return {r:r,s:s0,e:s0+Math.round(dayHours(r)*60),movers:Math.max(need.crew,num(a.crewN)||(Array.isArray(a.crew)?a.crew.length:0)),trucks:jobTrucks(r),need:need};
}
function laneFree(L,a,b,C){return (L||[]).length<C.jobs&&(L||[]).every(function(x){return b+C.gap<=x.s||x.e+C.gap<=a})}
// the most movers busy at once between a and b (minutes)
function moversBusy(blocks,a,b){
  var pts=[a];blocks.forEach(function(x){if(x.s>a&&x.s<b)pts.push(x.s)});
  return pts.reduce(function(m,t){return Math.max(m,blocks.reduce(function(n,x){return n+(x.s<=t&&t<x.e?x.movers:0)},0))},0);
}
// the day's slots: one per truck, smallest first (Richie: "each truck represents a crew slot")
function slotsOf(card){return ((card&&card.trucks)||[]).slice().sort(function(a,b){return num(a.cf)-num(b.cf)})}
function slotNo(card,id){return slotsOf(card).map(function(t){return t.id}).indexOf(id)+1}
function slotWords(card,ids){var n=(ids||[]).map(function(id){return slotNo(card,id)}).filter(Boolean).sort(function(a,b){return a-b});return n.length>1?'slots '+andList(n.map(String)):n.length?'slot '+n[0]:''}
function slotIds(r){var x=r&&r.d&&r.d.slots;return Array.isArray(x)?x.filter(function(id){return typeof id==='string'&&id}):[]}
// the day's slots, each with its jobs in order: a job on the trucks dispatch gave it, else in the slots it was lined up
// in, else in the first slots big enough that are free then (`loose` when none is)
function planDay(day,recs,card,skip){
  var C=dayCfg(card),trucks=slotsOf(card),lanes={},loose=[];
  trucks.forEach(function(t){lanes[t.id]=[]});
  var blocks=(recs||[]).filter(function(r){return r&&r.d&&r.d.moveDate===day&&r.id!==skip&&SCHED_ST.indexOf(r.status)>=0}).map(function(r){return blockOf(r,card)}).sort(function(a,b){return a.s-b.s});
  blocks.filter(function(b){return b.trucks.some(function(id){return lanes[id]})}).forEach(function(b){b.lanes=b.trucks.filter(function(id){return lanes[id]});b.lanes.forEach(function(id){lanes[id].push(b)})});
  blocks.filter(function(b){return !b.lanes&&slotIds(b.r).some(function(id){return lanes[id]})}).forEach(function(b){b.lanes=slotIds(b.r).filter(function(id,i,a){return lanes[id]&&a.indexOf(id)===i});b.slotted=true;b.lanes.forEach(function(id){lanes[id].push(b)})});
  blocks.filter(function(b){return !b.lanes}).forEach(function(b){
    var ids=trucks.filter(function(t){return num(t.cf)>=b.need.cf&&laneFree(lanes[t.id],b.s,b.e,{jobs:C.jobs,gap:0})}).slice(0,b.need.trucks).map(function(t){return t.id});
    if(ids.length<b.need.trucks){loose.push(b);return}
    b.lanes=ids;b.placed=true;ids.forEach(function(id){lanes[id].push(b)});
  });
  Object.keys(lanes).forEach(function(id){lanes[id].sort(function(a,b){return a.s-b.s})});
  return {day:day,cfg:C,trucks:trucks,lanes:lanes,loose:loose,blocks:blocks,movers:moversOn(day,card)};
}
// can a move start at s (minutes)? {ok, trucks, busy} or {ok:false, why}
function fitAt(P,need,s0){
  var C=P.cfg,e=s0+Math.round(need.hours*60);
  if(!P.trucks.length)return {ok:false,why:'notrucks'};
  var big=P.trucks.filter(function(t){return num(t.cf)>=need.cf});
  if(big.length<need.trucks)return {ok:false,why:'size'};
  if(s0<C.start)return {ok:false,why:'early'};
  if(e>C.start+C.hours*60)return {ok:false,why:'late'};
  var free=big.filter(function(t){return laneFree(P.lanes[t.id],s0,e,C)});
  if(free.length<need.trucks)return {ok:false,why:'busy'};
  var busy=moversBusy(P.blocks,s0,e);
  if(P.movers&&busy+need.crew>P.movers.n)return {ok:false,why:'movers',busy:busy};
  return {ok:true,s:s0,trucks:free.slice(0,need.trucks).map(function(t){return t.id}),busy:busy};
}
// a move put in a slot at s: does it fit there? {ok, s, trucks (its slots), busy} or {ok:false, why, lane}. A move of two
// trucks takes two slots for its time (Richie: "If its a 2 truck it takes up 2 slots for that amount of time"): the one
// it was put in and the nearest other slots big enough and free then
function fitIn(P,need,s0,ids){
  var C=P.cfg,e=s0+Math.round(need.hours*60),order=P.trucks.map(function(t){return t.id});
  var cfOf=function(id){return num((P.trucks.filter(function(t){return t.id===id})[0]||{}).cf)};
  ids=(ids||[]).filter(function(id,i,a){return P.lanes[id]&&a.indexOf(id)===i}).slice(0,need.trucks);
  if(!ids.length)return {ok:false,why:'noslot'};
  if(s0<C.start)return {ok:false,why:'early'};
  if(e>C.start+C.hours*60)return {ok:false,why:'late'};
  for(var i=0;i<ids.length;i++){
    if(cfOf(ids[i])<need.cf)return {ok:false,why:'small',lane:ids[i]};
    if(!laneFree(P.lanes[ids[i]],s0,e,C))return {ok:false,why:P.lanes[ids[i]].length>=C.jobs?'full':'taken',lane:ids[i]};
  }
  if(ids.length<need.trucks){
    var at=order.indexOf(ids[0]),near=order.slice().sort(function(a,b){return Math.abs(order.indexOf(a)-at)-Math.abs(order.indexOf(b)-at)||order.indexOf(b)-order.indexOf(a)});
    near.forEach(function(id){if(ids.length<need.trucks&&ids.indexOf(id)<0&&cfOf(id)>=need.cf&&laneFree(P.lanes[id],s0,e,C))ids.push(id)});
    if(ids.length<need.trucks)return {ok:false,why:'slots',lane:ids[0]};
  }
  var busy=moversBusy(P.blocks,s0,e);
  if(P.movers&&busy+need.crew>P.movers.n)return {ok:false,why:'movers',busy:busy};
  return {ok:true,s:s0,trucks:ids,busy:busy};
}
// every start time a move fits that day, each half hour from the day's start
function fitTimes(P,need){var out=[],C=P.cfg;for(var s0=C.start;s0+need.hours*60<=C.start+C.hours*60;s0+=30){var f=fitAt(P,need,s0);if(f.ok)out.push(f)}return out}
// the next days after `day` a move fits, the first time each: [{day, s, trucks}]
function nextRoom(day,need,recs,card,skip,n){
  var out=[];for(var i=1;i<=28&&out.length<(n||3);i++){var d0=addDays(day,i),f=fitTimes(planDay(d0,recs,card,skip),need)[0];if(f)out.push({day:d0,s:f.s,trucks:f.trucks})}

function townOf(addr){
  var s=' '+String(addr||'').toLowerCase().replace(/[^a-z ]+/g,' ').replace(/\s+/g,' ')+' ',best='';
  Object.keys(TOWNS).forEach(function(k){if(s.indexOf(' '+k+' ')>=0&&k.length>best.length)best=k});
  return best?{lat:TOWNS[best][0],lon:TOWNS[best][1],town:best}:null;

function townPart(addr){var p=String(addr||'').split(',').map(function(x){return x.trim()}).filter(Boolean);if(p.length>=3)return p[p.length-2];if(p.length===2)return /^[A-Za-z]{2}(\s+\d{5}(-\d{4})?)?$/.test(p[1])?p[0]:p[1];var t=townOf(addr);return t?titleCase(t.town):''}

function geoMiles(a,b){

}

/* The map. In the phone app: OpenStreetMap, through Leaflet (loaded the first time). Where that can't load (the

var LEAF={p:null};
function leafletLoad(){
  if(window.L&&window.L.map)return Promise.resolve(window.L);
  if(window.TALLY_ARTIFACT||!window.tallyDesk)return Promise.reject(new Error('off'));
  if(LEAF.p)return LEAF.p;
  LEAF.p=new Promise(function(res,rej){
    var s=document.createElement('script'),done=false,to=setTimeout(function(){if(!done){done=true;rej(new Error('slow'))}},9000);
    s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';s.crossOrigin='anonymous';
    s.onload=function(){if(done)return;done=true;clearTimeout(to);window.L&&window.L.map?res(window.L):rej(new Error('none'))};
    s.onerror=function(){if(done)return;done=true;clearTimeout(to);rej(new Error('load'))};
    document.head.appendChild(s);
  });
  LEAF.p.catch(function(){LEAF.p=null});
  return LEAF.p;
}

var DESK_HOME='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>';
function deskSvg(rows,geo){
  var pts=rows.filter(function(r){return r.g});
  if(!pts.length&&!geo)return '<div class="dkempty"><p class="hint">The map shows each company’s shop once it has an address'+(deskHosted()?'':' (Setup › Company)')+'.</p></div>';
  var c=geo||{lat:pts.reduce(function(s,r){return s+r.g.lat},0)/pts.length,lon:pts.reduce(function(s,r){return s+r.g.lon},0)/pts.length};
  var xy=function(g){var cl=Math.cos(c.lat*Math.PI/180);return {x:(g.lon-c.lon)*69.17*cl,y:-(g.lat-c.lat)*69.17}};
  var far=pts.reduce(function(m,r){var p=xy(r.g);return Math.max(m,Math.sqrt(p.x*p.x+p.y*p.y))},0)||5;
  var step=[1,2,5,10,15,25,50,100,250,500,1000].filter(function(s){return far/s<=4})[0]||1000,R=Math.max(step,Math.ceil(far/step)*step);
  var W=340,H=230,k=Math.min(W,H)/2/R*0.92,out='';
  if(geo){for(var ring=step;ring<=R+1e-9;ring+=step){out+='<circle cx="0" cy="0" r="'+(ring*k).toFixed(1)+'" class="dkring"/><text x="'+(ring*k*0.7071+3).toFixed(1)+'" y="'+(-ring*k*0.7071-3).toFixed(1)+'" class="dkringt">'+ring+' mi</text>'}
    out+='<g class="dkhomeg" transform="translate(-11,-11) scale(.92)"><rect x="-2" y="-2" width="28" height="28" rx="14"/><g transform="translate(2,2) scale(.84)">'+DESK_HOME.replace(/<svg[^>]*>|<\/svg>/g,'')+'</g></g>'}
  // a tap on a dot opens that company below (the list has every one too, for the keyboard and screen readers);
  // the clear ring around each dot makes it big enough to tap
  // dots closer than a tap apart are eased apart (a few pixels; the list below has the exact miles)
  var P=pts.map(function(r){var p=xy(r.g);return {r:r,x:p.x*k,y:p.y*k}}),gap=44;
  for(var it=0;it<60;it++){
    var moved=false;
    for(var i=0;i<P.length;i++)for(var j=i+1;j<P.length;j++){
      var a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>=gap)continue;
      var ux=d>0.01?dx/d:Math.cos(j*2.4),uy=d>0.01?dy/d:Math.sin(j*2.4),push=(gap-d)/2+0.5;
      a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;moved=true;
    }
    P.forEach(function(q){q.x=Math.max(-W/2+22,Math.min(W/2-22,q.x));q.y=Math.max(-H/2+22,Math.min(H/2-22,q.y))});
    if(!moved)break;
  }
  P.forEach(function(q){var r=q.r;out+='<g class="dkdot lvl'+(r.L?r.L.lvl:0)+'" data-act="desk:pick" data-co="'+esc(r.c.id)+'" transform="translate('+q.x.toFixed(1)+','+q.y.toFixed(1)+')"><circle class="dkhit" r="22"/><circle r="12"/><text y="4.5">'+r.n+'</text></g>'});
  return '<svg class="dksvg" viewBox="'+(-W/2)+' '+(-H/2)+' '+W+' '+H+'" role="img" aria-label="'+esc((geo?'How far each company is from the pickup: ':'Where the companies are: ')+pts.map(function(r){return r.n+' '+r.c.name+(r.mi!=null?', '+Math.round(r.mi)+' mi':'')}).join('; '))+'">'+out+'</svg>';
}
