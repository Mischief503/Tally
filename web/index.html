<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally: moving company software</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@400;500;700&family=Sora:wght@400;500;700&family=Lora:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --text:#141B2D; --muted:#667085; --bg:#F5F6F8; --card:#FFFFFF; --line:#E7EAF0; --line2:#F0F2F6;
  --header:#141B2D; --header-text:#F5F6F8; --field:#FFFFFF; --focus:#2563EB;
  --tape:#F5B700; --tape-edge:#D9A000; --tape-ink:#241A00;
  --ok:#16915C; --bad:#D0392B; --info:#2F6BC0; --warn:#E07A1F;
  --r:12px; --r2:9px; --rpill:99px; --bw:1px; --shadow:0 2px 8px rgba(16,24,40,.06); --shadow-lg:0 10px 40px rgba(10,15,28,.25);
  --w-strong:700; --w-mid:600;
  --fs:15px; --pad:12px 14px; --gapy:10px; --htt:none; --hls:.2px; --cardShadow:none; --tabFill:transparent;
  --tintA:14%; --tintB:20%;
  --accSoft:color-mix(in srgb, var(--tape) var(--tintA), transparent);
  --okSoft:color-mix(in srgb, var(--ok) var(--tintA), transparent);
  --badSoft:color-mix(in srgb, var(--bad) var(--tintA), transparent);
  --infoSoft:color-mix(in srgb, var(--info) var(--tintB), transparent);
  --warnSoft:color-mix(in srgb, var(--warn) var(--tintB), transparent);
  --paid:#0A7A3D; --paid-ink:#FFFFFF; --paidSoft:rgba(10,122,61,.15);
  --due:#B81C22; --due-ink:#FFFFFF; --dueSoft:rgba(184,28,34,.14);
  --focusRing:color-mix(in srgb, var(--focus) 26%, transparent);
  --hover:color-mix(in srgb, var(--text) 12%, var(--line));
  --scrim:color-mix(in srgb, #000 55%, transparent);
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{--paid:#2FD27A;--paid-ink:#04250F;--paidSoft:rgba(47,210,122,.18);--due:#FF6B60;--due-ink:#2A0603;--dueSoft:rgba(255,107,96,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:400 var(--fs)/1.45 var(--font);background:var(--bg);color:var(--text)}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:var(--w-strong);margin:0;line-height:1.15;letter-spacing:var(--hls);text-transform:var(--htt)}
h2{font-size:19px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
small{color:var(--muted)}
a{color:inherit}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.inline-sel{flex:1;min-width:0;min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--text);padding:6px 10px;font-size:15px}
.glabel{font:600 12px var(--font);color:var(--muted);margin:14px 2px 6px;letter-spacing:.2px}
#sheet .panel:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header and navigation */
.top{background:var(--header);color:var(--header-text);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.brand{font:700 24px/1 var(--display);letter-spacing:.6px}
.brand small{display:block;font:400 11px/1.2 var(--font);color:inherit;opacity:.92;margin-top:2px;letter-spacing:0}
.top select{background:transparent;color:inherit;border:1px solid color-mix(in srgb, var(--header-text) 32%, transparent);border-radius:8px;padding:4px 8px;font-size:13px;min-height:32px}
.top select option{color:#141B2D}
.tapebar{height:3px;background:var(--tape)}
.shell{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--muted);cursor:pointer;min-height:50px;position:relative;transition:color .15s}
nav.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--text);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--tabFill)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:2px;background:var(--tape);border-radius:0 0 2px 2px}
main{padding:10px 12px calc(70px + env(safe-area-inset-bottom));max-width:960px;margin:0 auto}

/* surfaces */
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--pad);margin:0 0 var(--gapy);box-shadow:var(--cardShadow)}
.card>h2{margin-bottom:8px}
.card>.sub{margin:-2px 0 8px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* a grid cell may shrink below its box's natural width (inputs are wide by default), and the boxes in a row line up at the bottom even when one label runs to two lines */
.grid2>*,.grid3>*{min-width:0}
.grid2>input,.grid2>select,.grid3>input,.grid3>select{width:100%}
.grid2>.f,.grid3>.f{justify-content:space-between}
.accpick{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
@media (min-width:560px){ .accpick{grid-template-columns:3fr 2fr} }
.colhead{margin:0 0 4px}.colhead small{font-size:12px}
.span2{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.note{background:var(--accSoft);border:var(--bw) solid var(--tape-edge);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
/* grey small print is too faint on a note's tinted box in some dark looks: it takes the note's own colour */
.note small{color:inherit}
.trkrow{margin-top:6px}
.trkrow select.need{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.drvneed{margin:4px 0 0;font-size:13px;color:var(--bad);font-weight:var(--w-mid)}
.drv{display:block;font-size:12px}.drv.no{color:var(--bad);font-weight:var(--w-mid)}
/* a Board block sits on the page colour: its red pills take the card colour behind them, which the red is worked out against (on the page's tint it fell to 4:1 in Cardboard, Denim and Newsprint) */
.block .pill.bad,.block .pill.due{background:var(--card)!important}
.clashnote{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;font:inherit;font-size:13px;color:var(--text);background:rgba(200,64,47,.14);border-color:var(--bad);cursor:pointer;min-height:44px}
.clashnote b{white-space:nowrap;font-weight:700}
.duelist{margin:4px 0 0;padding-left:20px;font-size:14px}.duelist li{margin:2px 0}
.testtag{display:inline-block;background:var(--tape);color:var(--tape-ink);border-radius:4px;padding:0 5px;font:700 10px/1.6 var(--font);letter-spacing:.8px;vertical-align:1px}
.adm-co h3{font-size:17px;margin-bottom:2px}.adm-co.is-test{border-style:dashed}
.adm-edit{border-top:1px solid var(--line2);margin-top:10px;padding-top:8px}
.member-nudge .btn{margin-top:6px}
.pulse .pbox{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:9px 10px;box-shadow:var(--cardShadow);min-height:62px}
.empty{text-align:center;padding:22px 12px;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:4px;font-size:18px}

/* form controls */
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{background:var(--field);border:var(--bw) solid var(--line);border-radius:var(--r2);padding:8px 10px;font-size:16px;color:var(--text);min-height:42px;width:100%;transition:border-color .12s,box-shadow .12s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--focusRing)}
.f textarea{min-height:64px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px;color:var(--text)}
.check input{width:20px;height:20px;accent-color:var(--tape)}
.btn{border:var(--bw) solid var(--line);background:var(--card);color:var(--text);border-radius:var(--r2);padding:8px 14px;min-height:40px;font-weight:var(--w-mid);font-size:14.5px;cursor:pointer;transition:background .12s,border-color .12s,transform .06s,filter .12s}
.btn:hover{border-color:var(--hover)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--tape);border-color:var(--tape-edge);color:var(--tape-ink)}
.btn.primary:hover{filter:brightness(.97)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn.ibtn{min-width:40px;min-height:40px;padding:0;font-size:20px;line-height:1}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips.payq{margin:-2px 0 12px}
.chip{border:var(--bw) solid var(--line);background:var(--card);color:var(--text);border-radius:var(--rpill);padding:5px 13px;min-height:36px;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s}
.chip.on{background:var(--text);color:var(--card);border-color:var(--text)}
.chip small{color:inherit;opacity:.7}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}
.pill{display:inline-block;padding:1px 8px;border-radius:var(--rpill);font-size:11.5px;font-weight:600;background:var(--line2);color:var(--text);white-space:nowrap;line-height:1.65}
.pill[data-s=lead]{color:var(--text)}
.pill[data-s=quoted]{background:var(--infoSoft);color:var(--text)}
.pill[data-s=booked]{background:var(--tape);color:var(--tape-ink)}
.pill[data-s=active]{background:var(--warnSoft);color:var(--text)}
.pill[data-s=done]{background:var(--okSoft);color:var(--text)}
.pill[data-s=paid]{background:var(--paid)!important;color:var(--paid-ink)!important;border-color:var(--paid)!important}
.pill.bad,.pill.due{background:var(--dueSoft)!important;color:var(--due)!important;border-color:var(--due)!important}
.money-paid{color:var(--paid)!important;font-weight:var(--w-mid)}
.money-due{color:var(--due)!important;font-weight:var(--w-mid)}
.kpi.paid b,.pulse button.paid b,.flow-body .kpi.paid b{color:var(--paid)!important;-webkit-text-fill-color:var(--paid)!important;background:none!important}
.kpi.due b,.pulse button.due b,.flow-body .kpi.due b{color:var(--due)!important;-webkit-text-fill-color:var(--due)!important;background:none!important}
.alert .ic.bad{background:var(--dueSoft);color:var(--due)}
.alert .ic.ok{background:var(--paidSoft);color:var(--paid)}
.pill[data-s=lost]{background:transparent;border:1px solid var(--muted);color:var(--text)}
.pill.bad{background:var(--badSoft);color:var(--bad)}
.pill.warn{background:var(--warnSoft)}

/* collapsible sections */
details.acc{border-top:1px solid var(--line2)}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 0;font-weight:600;font-size:14.5px;cursor:pointer;min-height:42px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-3px 4px 0 2px;transition:transform .18s;flex:none}
details.acc[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
details.acc>summary>span{flex:1;min-width:0}
details.acc>summary small{font-weight:400;font-size:12.5px}
.acc-body{padding:0 0 12px}
details.acc.card{padding:0 14px;margin:0 0 8px}
details.acc.card>summary{font:700 17px var(--display);padding:10px 0;min-height:46px}
details.acc.card .acc-body{padding-bottom:14px}
.grp{border-top:1px solid var(--line2);padding:0}
.grp>summary{cursor:pointer;padding:9px 0;font:700 16px var(--display);list-style:none;display:flex;justify-content:space-between;min-height:42px;align-items:center}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"+";font-size:20px;color:var(--muted);font-weight:400}
.grp[open]>summary::after{content:"−"}

/* quote */
.hero{padding:10px 14px 12px}
.truck{width:100%;height:auto;display:block;max-height:76px;margin:0 auto}
.truck .tbox{fill:none;stroke:var(--text);stroke-width:2}
.truck .cell{fill:transparent;stroke:var(--line);stroke-width:1}
.truck .cell.on{fill:var(--tape);stroke:var(--tape-edge)}
.truck .tcab,.truck .tchas{fill:var(--text)}
.truck .twin{fill:var(--card)}
.truck .twheel circle{fill:var(--text);stroke:var(--card);stroke-width:3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.stat{min-width:0}
.stat b{display:block;font:700 20px/1.05 var(--display)}
.stat span{font-size:11.5px;color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line2)}
.item[hidden]{display:none}
.item b{font-weight:500}
.item small{display:block;font-size:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:24px;text-align:center;font-weight:600}
.stepper .btn{width:36px;padding:0}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:5px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.lines td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lines tr.total td{font:700 22px var(--display);border-bottom:0;padding-top:8px}
.lines tr.sub td{font-weight:var(--w-strong);border-bottom:1px solid var(--line)}
.lines tr.sub small{font-weight:400}
.lines tr.hd td{padding:12px 0 4px;font:600 11.5px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);text-align:left;white-space:normal}
.lines tr.ref td{border-bottom:0}
/* the call center's Schedule: a month of days, coloured by how many trucks are taken */
.cal{padding:12px}
.cal-nav{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.cal-nav h2{flex:1;margin:0;font-size:18px;text-align:center}
.cal-nav .btn{min-width:44px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font:600 11px var(--font);color:var(--muted);text-align:center;padding:2px 0 4px;letter-spacing:.04em;text-transform:uppercase}
.cal-d{min-width:0;min-height:48px;border:1px solid var(--line);border-radius:var(--r2);background:var(--card);color:var(--text);padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1px;cursor:pointer;font:inherit}
.cal-d b{font-size:14px;font-weight:var(--w-mid);line-height:1.15}
.cal-d i{font-style:normal;font-size:12px;font-weight:var(--w-strong);line-height:1.2;min-height:14px}
.cal-d.lvl1,.cal-key i.lvl1{background:color-mix(in srgb, var(--ok) 26%, var(--card))}
.cal-d.lvl2,.cal-key i.lvl2{background:color-mix(in srgb, var(--warn) 32%, var(--card))}
.cal-d.lvl3,.cal-key i.lvl3{background:color-mix(in srgb, var(--bad) 30%, var(--card))}
.cal-d.today b{text-decoration:underline;text-underline-offset:3px;font-weight:var(--w-strong)}
.cal-d.on{outline:2.5px solid var(--focus);outline-offset:1px}
.cal-key{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--text)}
.cal-key span{display:inline-flex;align-items:center;gap:6px}
.cal-key i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
/* the call center's Companies screen: the customer, the map, each company's rate card */
.dkcust h2{margin:0 0 6px;font-size:17px}
.dkcust #dkNote{margin:8px 0 0}
.dkmapcard{padding:0;overflow:hidden;position:relative}
.dkmap{position:relative;height:250px;background:color-mix(in srgb, var(--line2) 55%, var(--card))}
.dkmap.leafy{height:300px;background:var(--line2)}
.dksvg{display:block;width:100%;height:100%}
.dkring{fill:none;stroke:var(--muted);stroke-opacity:.55;stroke-width:1;stroke-dasharray:3 4}
.dkringt{font:600 10.5px var(--font);fill:var(--muted)}
.dkhomeg rect{fill:var(--text)}
.dkhomeg path,.dkhome path{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dkhomeg path{stroke:var(--card)}
.dkdot{cursor:pointer}
.dkdot circle{fill:var(--card);stroke:var(--text);stroke-width:1.6}
.dkdot circle.dkhit{fill:transparent!important;stroke:none}
.dkdot text{font:700 12.5px var(--font);fill:var(--text);text-anchor:middle}
.dkdot.lvl1 circle,.dknum.lvl1{background:color-mix(in srgb, var(--ok) 40%, var(--card));fill:color-mix(in srgb, var(--ok) 40%, var(--card))}
.dkdot.lvl2 circle,.dknum.lvl2{background:color-mix(in srgb, var(--warn) 45%, var(--card));fill:color-mix(in srgb, var(--warn) 45%, var(--card))}
.dkdot.lvl3 circle,.dknum.lvl3{background:color-mix(in srgb, var(--bad) 40%, var(--card));fill:color-mix(in srgb, var(--bad) 40%, var(--card))}
.dkempty{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;text-align:center}
.dkcap{margin:0;padding:6px 12px 8px;font-size:12px;border-top:1px solid var(--line2)}
details.hcard>summary>.dknum{flex:none}
details.hcard.deskcard>summary>.hpill.dkkeep{display:inline-block}
.dknum{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:1.6px solid var(--text);background:var(--card);color:var(--text);font:700 13px var(--font);box-sizing:border-box}
.dkhome{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.dkhome svg{width:18px;height:18px}.dkhome path{stroke:var(--card)}
.dkpin{background:none;border:0;display:flex!important;align-items:center;justify-content:center}
.dkpin .dknum{box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pill.dkav.lvl1{background:color-mix(in srgb, var(--ok) 32%, var(--card))}
.pill.dkav.lvl2{background:color-mix(in srgb, var(--warn) 38%, var(--card))}
.pill.dkav.lvl3{background:color-mix(in srgb, var(--bad) 32%, var(--card))}
.dkday{margin:0 0 8px;padding:7px 10px;border-radius:var(--r2);background:var(--line2);font-weight:var(--w-mid)}
.dkday.lvl1{background:color-mix(in srgb, var(--ok) 26%, var(--card))}
.dkday.lvl2{background:color-mix(in srgb, var(--warn) 32%, var(--card))}
.dkday.lvl3{background:color-mix(in srgb, var(--bad) 30%, var(--card))}
.ratecard td:first-child{color:var(--muted)}
.ratecard td:last-child{white-space:normal;font-weight:var(--w-mid);color:var(--text)}
/* Leaflet's own layout (the map in the phone app), and its controls in the app's colours */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:1px;font:12px var(--font)}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:0}.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive{pointer-events:auto}
.leaflet-bar{border-radius:var(--r2);border:1px solid var(--line);background:var(--card);overflow:hidden}
.leaflet-bar a{display:block;width:40px;height:40px;line-height:40px;text-align:center;text-decoration:none;color:var(--text);background:var(--card);font:600 22px var(--font)}
.leaflet-bar a+a{border-top:1px solid var(--line)}
.leaflet-bar a.leaflet-disabled{color:var(--muted);cursor:default}
.leaflet-control-attribution{background:color-mix(in srgb, var(--card) 85%, transparent);margin:0;padding:1px 6px;color:var(--text);font-size:11px;line-height:1.5}
.leaflet-control-attribution a{color:var(--text)}
html[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88)}
.qcard .route{margin-top:2px}
.daynote.full{color:var(--text);font-weight:var(--w-mid)}
.tl{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.tl-row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:center}
.tl-name{min-width:0}.tl-name b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl-name small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl-name small.bad{color:var(--bad);font-weight:var(--w-mid)}
@media (max-width:600px){.tl-row{grid-template-columns:minmax(0,1fr);gap:3px}.tl-axr>span:first-child{display:none}.tl-name{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px}.tl-name b,.tl-name small{display:inline}.tl-name small+small::before{content:"· "}.tl-row+.tl-row{margin-top:4px}}
.tl-track{position:relative;height:46px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg)}
.tl-track.loose{border-style:dashed}.tl-track.tall{height:78px}
.tl-job{position:absolute;top:4px;bottom:4px;min-width:6px;border:1px solid var(--line);border-left:3px solid var(--tape);border-radius:7px;background:var(--card);padding:2px 5px;overflow:hidden;box-sizing:border-box}
.tl-job b,.tl-job small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;line-height:1.35}.tl-job b{font-weight:var(--w-mid)}.tl-job small{color:var(--muted)}
.tl-job.run{border-left-color:var(--ok)}.tl-job.clash{border-left-color:var(--bad)}
.tl-job.tl-new{border:1.5px dashed var(--focus);background:color-mix(in srgb, var(--focus) 12%, var(--card))}
.tl-job.tl-new.bad{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 12%, var(--card))}
.tl-drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.tl-lift{opacity:.35}
.tl-ghost{box-shadow:var(--shadow-lg);opacity:.95;cursor:grabbing}
.tl-track[data-lane]{cursor:copy}.tl-tray .tl-track{border-style:dashed;background:transparent}
.tl-prev{position:absolute;top:4px;bottom:4px;border:2px dashed var(--ok);border-radius:7px;background:color-mix(in srgb, var(--ok) 14%, transparent);font-size:11px;font-weight:var(--w-mid);padding:2px 5px;pointer-events:none;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.tl-prev.bad{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 14%, transparent)}
.dp-msg .linkbtn{background:none;border:0;padding:0 2px;margin-left:4px;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.tl-axr{align-items:end}.tl-ax{position:relative;height:16px}.tl-ax span{position:absolute;bottom:0;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.tl-ax span:first-child{transform:none}.tl-ax span:last-child{transform:translateX(-100%)}
.tl-cells{display:grid;gap:2px}.tl-cells span{font-size:11px;text-align:center;padding:3px 0;border-radius:5px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.tl-cells span.n{background:color-mix(in srgb, var(--focus) 14%, var(--card));color:var(--text)}.tl-cells span.over{background:color-mix(in srgb, var(--bad) 22%, var(--card));color:var(--text);font-weight:var(--w-strong)}
.dp-msg{margin:6px 0;padding:8px 10px;border-radius:var(--r2);font-size:14px}.dp-msg.ok{background:color-mix(in srgb, var(--ok) 14%, var(--card))}.dp-msg.no{background:color-mix(in srgb, var(--bad) 13%, var(--card))}
.saved{font-weight:var(--w-mid)}
.qbar{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));z-index:10;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg)}
.qbar .tot{font:700 22px/1 var(--display)}
.qbar small{display:block;font-size:12px;white-space:nowrap}

/* job lists, dispatch */
.job{display:block;width:100%;text-align:left;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:8px;cursor:pointer;box-shadow:var(--cardShadow);transition:border-color .12s,box-shadow .12s,transform .06s}
.job:active{transform:scale(.995)}
.job:hover{border-color:var(--hover);box-shadow:var(--shadow)}
.job .t{font:700 17px/1.15 var(--display)}
.job .r{font:700 17px/1.15 var(--display);text-align:right}
/* the when-and-where line wraps to a second line on a narrow phone instead of being cut off */
.job .route{color:var(--muted);font-size:13px;margin:3px 0 6px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:break-word}
.week{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.week>*{min-width:0}
.day.slim{padding:9px 12px}
.day.slim h3{font-size:15px}
.day{min-width:0;overflow:hidden;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--cardShadow)}
.day.today{border-color:var(--tape-edge);box-shadow:inset 0 2px 0 var(--tape)}
.day h3{margin-bottom:1px}
.day .cap{font-size:12px;color:var(--muted);margin-bottom:6px}
.block{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--tape);background:var(--bg);border-radius:9px;padding:7px 9px;margin-bottom:6px;cursor:pointer;transition:border-color .12s}
.block.tent{border-left-style:dashed;border-left-color:var(--info)}
.block.clash{border-left-color:var(--bad)}
.block .tm{font-weight:600;font-size:14px}
.block small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.who{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)}
.who:first-child{border-top:0}

/* reports */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--cardShadow)}
.kpi b{display:block;font:700 22px/1.05 var(--display)}
.kpi span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;overflow-x:auto;padding-top:8px}
.bar{flex:0 0 44px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--tape);border-radius:5px 5px 0 0;min-height:2px}
.bar em{font-style:normal;color:var(--text);font-weight:600;font-size:11px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{font-weight:600;text-align:left;color:var(--muted);font-size:12px;padding:3px 6px 3px 0}
table.tbl td{padding:6px 6px 6px 0;border-top:1px solid var(--line2)}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
table.tbl td.n{white-space:nowrap}
.cin{width:66px;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--field);color:var(--text);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.cin:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--focusRing)}
table.tbl.cat td{vertical-align:middle;padding-top:4px;padding-bottom:4px}
@media (max-width:360px){ .cin{width:56px} table.tbl.cat td{padding-right:4px} }
.tblwrap table.tbl td:first-child{min-width:7em}

/* job sheet */
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:40}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;background:var(--bg);border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
#sheet .panel::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 14px 10px;background:transparent;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:21px}
.sheet-body{overflow-y:auto;padding:8px 14px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sec{margin:0 0 10px}
.sec>h3{margin-bottom:6px}
.sheet-body details.acc{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:0 12px;margin:0 0 8px}
.sheet-body details.acc>summary{font:700 16px var(--display);min-height:44px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos figure{margin:0;width:88px}
.photos img{width:88px;height:88px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
.photos figcaption{font-size:11px;color:var(--muted)}
.phold{width:88px;height:88px;border:1px dashed var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center}
.tally-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line2)}
.tally-row>span:first-child{flex:1;min-width:0}
.tally-row .row{flex-wrap:nowrap;flex:none;gap:6px}
.tally-row .btn{min-width:44px}
.tally-row .btn.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));background:var(--text);color:var(--card);padding:9px 16px;border-radius:99px;font-size:13.5px;z-index:60;max-width:90vw;box-shadow:var(--shadow-lg)}
.toast[hidden]{display:none}
.toast .tundo{background:none;border:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:9px 6px;margin:-9px -6px -9px 12px;min-height:40px;cursor:pointer}

/* crew view */
.crewcard{padding:12px 14px}
.cc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cc-head h3{font-size:20px}
.cc-sub{color:var(--muted);font-size:13px;margin-top:2px}
.cc-route{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.cc-route small{display:block;font-size:11.5px}
.cc-route a{display:block;padding:4px 0 7px;font-size:14px;font-weight:500;overflow-wrap:anywhere;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:4px;min-height:36px}
.cc-actions{display:flex;gap:8px;margin:2px 0 6px}
.cc-actions .btn{flex:1;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.crewcard .big{min-height:44px;font-size:16px;flex:2}
.crewcard a{font-weight:600}
textarea.code{width:100%;min-height:110px;font:12.5px/1.35 ui-monospace,Menlo,Consolas,monospace;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px;color:var(--text)}
.clock{border-left:3px solid var(--tape)}
.clock.on{border-left-color:var(--ok)}
.clock .elapsed{font:700 30px/1 var(--display)}
.clock textarea{width:100%;min-height:52px;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:16px;margin-top:6px;color:var(--text)}
.clock textarea.need{border-color:var(--bad);box-shadow:0 0 0 3px var(--badSoft)}

/* signing and payment overlay */
#flow{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#flow[hidden]{display:none}
.flow-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--header);color:var(--header-text);border-bottom:3px solid var(--tape)}
.flow-head small{color:inherit;opacity:.92}
.flow-head .btn{background:transparent;color:inherit;border-color:color-mix(in srgb, var(--header-text) 38%, transparent)}
.flow-body{overflow-y:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;width:100%}
.formbox{background:#fff;color:#141a26;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:44vh;overflow:auto;margin:10px 0}
.formbox img{width:100%;display:block;margin-bottom:8px}
.formtext{white-space:pre-wrap;font-size:15px;line-height:1.55}
.sigpad{width:100%;height:150px;background:#fff;border:2px dashed var(--muted);border-radius:10px;touch-action:none;display:block;margin:6px 0 10px}
.bigbtn{width:100%;min-height:48px;font-size:16px;margin-top:8px}
.methods{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pick{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;min-height:46px}
.pick input{width:20px;height:20px;accent-color:var(--tape)}

/* chat */
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--card);font:700 10.5px/17px var(--font);font-style:normal;text-align:center}
.thread{display:flex;align-items:center;gap:8px;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:4px 10px;margin-bottom:8px}
.thread .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;min-height:46px}
.thread .open b{display:block;font:700 17px/1.15 var(--display)}
.thread .open small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.dot{background:var(--bad);color:var(--card);border-radius:99px;font-size:11.5px;font-weight:700;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.msgs{display:flex;flex-direction:column;gap:6px;padding:6px 0;min-height:160px}
.msg{max-width:84%;align-self:flex-start;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r) var(--r) var(--r) 4px;padding:7px 11px}
.msg.me{align-self:flex-end;background:var(--tape);border-color:var(--tape-edge);color:var(--tape-ink);border-radius:var(--r) var(--r) 4px var(--r)}
.msg.me small,.msg.me a{color:var(--tape-ink)}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tag{font:700 13px/1.1 var(--display)}
.msg .who-n{display:block;font-weight:600;font-size:12.5px}
.composer{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;background:var(--field);border:var(--bw) solid var(--line);border-radius:var(--r);padding:9px 12px;min-height:42px;max-height:120px;color:var(--text);font-size:16px;resize:none}

/* sign-in gate */
#gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#gate[hidden]{display:none}
#gate h2{margin-bottom:8px;font-size:22px}
/* owner preview mode */
#pvBar{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--text);color:var(--card);font-size:13.5px;box-shadow:var(--shadow-lg)}
#pvBar[hidden]{display:none}
#pvBar b{font-weight:var(--w-mid)}
#pvBar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pvBar button{flex:none;background:var(--card);color:var(--text);border:0;border-radius:99px;padding:5px 14px;min-height:36px;font-weight:var(--w-mid);font-size:13px;cursor:pointer}
body.previewing main{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
@media (min-width:900px){ #pvBar{bottom:0} body.previewing .fab{bottom:84px} body.previewing main{padding-bottom:84px} }
.pvrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line2)}
.pvrow .who-n{flex:1;min-width:0}

/* home */
.hero-day{padding:2px 2px 10px}
.hero-day h1{font:700 30px/1.05 var(--display);letter-spacing:var(--hls);text-transform:var(--htt)}
.hero-day .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.pulse{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pulse button{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:9px 10px;text-align:left;cursor:pointer;box-shadow:var(--cardShadow);min-height:62px}
.pulse b{display:block;font:700 22px/1.05 var(--display)}
.pulse span{font-size:11.5px;color:var(--muted)}
.secline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 2px 7px}
.secline h2{font-size:17px}
.secline a,.secline button{background:none;border:0;color:var(--muted);font-size:13.5px;cursor:pointer;padding:11px 8px;margin:-11px -6px -11px 0;min-height:42px}
.live{border-left:3px solid var(--warn)}
.live .el{font:700 26px/1 var(--display)}
.alert{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;cursor:pointer;box-shadow:var(--cardShadow)}
.alert .ic{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.alert .ic.warn{background:var(--warnSoft);color:var(--text)}
.alert .ic.bad{background:var(--dueSoft);color:var(--due)}
.alert .ic.ok{background:var(--paidSoft);color:var(--paid)}
.alert .tx{flex:1;min-width:0}
.alert .tx b{display:block;font-size:14.5px;font-weight:var(--w-mid)}
.alert .tx small{color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:break-word}
.alert .go{color:var(--muted);flex:none}
/* nav with a centre action */
/* the round New quote button sits in the middle of the bottom bar, inside it, so it never covers what is on the screen */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(3px + env(safe-area-inset-bottom));z-index:25;width:46px;height:46px;border-radius:99px;border:var(--bw) solid var(--tape-edge);background:var(--tape);color:var(--tape-ink);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.fab[aria-current="page"]{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--tape-edge)}
.fab[hidden]{display:none}

/* dispatch board lanes */
.daystrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}

.lane{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;box-shadow:var(--cardShadow)}

/* quote steps */

/* more sheet */

@media (min-width:900px){ .fab{left:auto;right:28px;bottom:28px;transform:none;width:56px;height:56px} nav.tabs.has-fab button.spacer{display:none} }
.icon-btn{background:transparent;border:1px solid color-mix(in srgb, var(--header-text) 32%, transparent);color:inherit;border-radius:9px;min-height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 6px}
#pick[hidden]{display:none}

.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.tcard{position:relative;text-align:left;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.tcard.on{outline:2px solid var(--focus);outline-offset:1px}
.tcard .swatch{height:46px;display:flex;align-items:flex-end;gap:4px;padding:6px 8px}
.tcard .swatch i{display:block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.14)}
.tcard .lbl{padding:6px 9px 9px}
.tcard .lbl b{display:block;font:700 15px/1.2 var(--display)}
.tcard .lbl small{font-size:11.5px;line-height:1.25;display:block}
.tcard .tick{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:99px;background:var(--focus);color:var(--card);font-size:12px;line-height:20px;text-align:center;font-weight:700}
@media (min-width:640px){ .tgrid{grid-template-columns:repeat(3,1fr)} #pick .panel{left:50%;transform:translateX(-50%);width:640px;border-radius:calc(var(--r) + 6px)} }

/* employee profiles */
#emp[hidden]{display:none}
#emp{position:fixed;inset:0;z-index:45}
#emp .scrim{position:absolute;inset:0;background:var(--scrim)}
#emp .panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;background:var(--bg);border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}

.emprow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r2);padding:10px 12px;margin:0 0 8px;color:var(--text);min-height:56px;font:inherit;cursor:pointer}

.empst{font-size:14px;line-height:1.4;padding:9px 11px;border-radius:var(--r2);background:var(--card);border:var(--bw) solid var(--line);margin:8px 0 10px}
.empst.ok{border-color:var(--ok)}
.empst.warn{border-color:var(--warn)}
.empst.off{border-color:var(--bad)}
.empsec{margin:16px 0 6px;font-size:15px}
.sides{display:flex;flex-direction:column;border:var(--bw) solid var(--line);border-radius:var(--r2);background:var(--card)}
.sidesw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;min-height:52px;cursor:pointer}
.sidesw+.sidesw{border-top:var(--bw) solid var(--line)}.sidesw>span:first-child{display:flex;flex-direction:column;min-width:0}
.sidesw small{color:var(--muted);font-size:12.5px}.sw input:disabled{cursor:default}.sw input:disabled+span{opacity:.55}
.seg{display:inline-flex;border:var(--bw) solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.seg label{position:relative;cursor:pointer}.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label span{display:block;padding:8px 13px;font-size:14px;min-width:44px;text-align:center}.seg label+label span{border-left:var(--bw) solid var(--line)}

/* the customer side */

.cm-route b{display:block;font-weight:var(--w-mid);font-size:15px;overflow-wrap:anywhere}
.cm-price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:10px 0 0}

.cm-price span{color:var(--muted);font-size:13px}
.cm-steps{list-style:none;margin:2px 0 0;padding:0}
.cm-steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line2)}

.cm-steps .tx{flex:1;min-width:0}
.cm-steps .tx b{display:block;font-weight:var(--w-mid);font-size:15px;overflow-wrap:anywhere}
.cm-steps .tx small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.cm-steps .tx .btn{margin-top:9px}
.cm-steps li.later .tx b{color:var(--muted);font-weight:500}
.cm-det>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none;font:700 17px var(--display);min-height:30px}
.cm-det>summary::-webkit-details-marker{display:none}

.cm-det[open]>summary{margin-bottom:8px}
.cm-det h4{margin:12px 0 2px;font-size:14px}
.cm-h3{margin:14px 2px 6px;font-size:16px}
.cm-center{text-align:center}
.cm-moves .navrow[aria-current="true"]{background:var(--bg)}

.cm-email{margin-top:10px}.cm-email small{display:block;color:var(--muted);font-size:12px}.cm-email b{font-weight:var(--w-mid);overflow-wrap:anywhere}
.cm-sum{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px}.cm-sum b{font:700 22px/1.1 var(--display)}.cm-sum span{color:var(--muted);font-size:14px}
.cm-tips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.cm-tips .chip{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:var(--r2);padding:4px 2px;font-weight:var(--w-mid)}

.cm-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-weight:var(--w-mid)}

.cm-total b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}

function membersToDoc(m){return {uid:m.user_id,staff:m.staff,role:m.role,email:m.email,ts:m.ts}}
function reqToDoc(r){return {uid:r.user_id,email:r.email,ts:r.ts}}

/* ---------- live updates: refetch the affected collection, debounced ---------- */
var watchers={};   // key -> {fetch, cbs:[]}
function bump(key){var w=watchers[key];if(!w)return;clearTimeout(w.t);w.t=setTimeout(function(){w.run()},120)}
var channel=null;
function ensureChannel(){
  if(channel)return;
  channel=sb.channel('tally-'+ORG)
   .on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'org_id=eq.'+ORG},function(p){
      var c=(p.new&&p.new.collection)||(p.old&&p.old.collection)||'';
      if(c==='ratecard'&&me.role==='callcenter')c='org';   // the call center's settings are the rate card's copy
      Object.keys(watchers).forEach(function(k){if(k.indexOf(c+'|')===0||(c==='sched'&&me.role==='callcenter'&&k.indexOf('jobs|')===0))bump(k)});
   })
   .on('postgres_changes',{event:'*',schema:'public',table:'members',filter:'org_id=eq.'+ORG},function(){Object.keys(watchers).forEach(function(k){if(k.indexOf('users|')===0)bump(k)});refreshMe()})
   .on('postgres_changes',{event:'*',schema:'public',table:'access_requests',filter:'org_id=eq.'+ORG},function(){Object.keys(watchers).forEach(function(k){if(k.indexOf('requests|')===0)bump(k)})})
   .subscribe();
}
function watch(key,run){
  ensureChannel();
  var w=watchers[key]||(watchers[key]={run:run,t:null,n:0});
  w.run=run;w.n++;run();
  return function(){w.n--;if(w.n<=0){clearTimeout(w.t);delete watchers[key]}};
}

/* ---------- queries ---------- */
function build(collection,filters,order,lim){
  var q=sb.from('docs').select('doc_id,data,collection').eq('org_id',ORG).eq('collection',collection);
  filters.forEach(function(f){
    // PostgREST takes a JSON key bare (data->>t); quotes would be read as part of the key
    if(f[1]==='==')q=q.filter("data->>"+f[0],'eq',String(f[2]));
    else if(f[1]==='<')q=q.filter("data->"+f[0],'lt',f[2]);
    else if(f[1]==='>')q=q.filter("data->"+f[0],'gt',f[2]);
  });
  if(order)q=q.order("data->"+order[0],{ascending:order[1]!=='desc'});
  if(lim)q=q.limit(lim);
  return q;
}
function collectionRef(collection){
  function make(filters,order,lim){
    var api={
      where:function(f,op,v){return make(filters.concat([[f,op,v]]),order,lim)},
      orderBy:function(f,dir){return make(filters,[f,dir||'asc'],lim)},
      limit:function(n){return make(filters,order,n)},
      get:function(){
        if(collection==='users')return sb.from('members').select('*').eq('org_id',ORG).then(function(r){return snapMany((r.data||[]).map(function(m){return {doc_id:m.user_id,data:membersToDoc(m)}}))});
        if(collection==='requests')return sb.from('access_requests').select('*').eq('org_id',ORG).then(function(r){return snapMany((r.data||[]).map(function(x){return {doc_id:x.user_id,data:reqToDoc(x)}}))});
        return build(collection,filters,order,lim).then(function(r){if(r.error)throw r.error;return snapMany(r.data||[])});
      },
      onSnapshot:function(next,err){
        var key=collection+'|'+JSON.stringify([filters,order,lim]);
        return watch(key,function(){api.get().then(next).catch(function(e){if(err)err(e)})});
      },
      doc:function(id){return docRef(collection+'/'+id)}
    };
    return api;
  }
  return make([],null,null);
}
function docRef(path){
  var parts=split(path),collection=parts[0],id=parts[1];
  function readOne(){
    // Tally's call center team isn't one of the company's people: who they are comes from the team list
    if(collection==='users'&&me.role==='callcenter'&&id===me.id)return Promise.resolve(snapOne(path,{data:{uid:me.id,staff:me.staff,role:'callcenter',email:me.email,ts:0}}));
    if(path==='org/settings'&&me.role==='callcenter')return sb.from('docs').select('data').eq('org_id',ORG).eq('path','ratecard/main').maybeSingle().then(function(r){if(r.error)throw r.error;return snapOne(path,r.data)});
    if(collection==='users')return sb.from('members').select('*').eq('org_id',ORG).eq('user_id',id).maybeSingle().then(function(r){return snapOne(path,r.data?{data:membersToDoc(r.data)}:null)});
    if(collection==='requests')return sb.from('access_requests').select('*').eq('org_id',ORG).eq('user_id',id).maybeSingle().then(function(r){return snapOne(path,r.data?{data:reqToDoc(r.data)}:null)});
    return sb.from('docs').select('data').eq('org_id',ORG).eq('path',path).maybeSingle().then(function(r){if(r.error)throw r.error;return snapOne(path,r.data)});
  }
  return {
    id:id,path:path,
    get:readOne,
    set:function(obj){
      if(collection==='jobs'&&(me.role==='callcenter'||(window.tallyCcVia&&window.tallyCcVia(id,obj))))return ccSave(path,obj,null);
      if(collection==='users')return sb.from('members').upsert({org_id:ORG,user_id:id,email:obj.email||'',staff:obj.staff||'',role:obj.role||'crew',ts:obj.ts||Date.now()}).then(chk);
      if(collection==='requests')return sb.from('access_requests').upsert({org_id:ORG,user_id:id,email:obj.email||me.email,ts:obj.ts||Date.now()}).then(chk);
      return sb.from('docs').upsert({org_id:ORG,path:path,collection:collection,doc_id:id,data:obj,updated_at:new Date().toISOString()}).then(chk);
    },
    update:function(patch){
      if(collection==='jobs'&&(me.role==='callcenter'||(window.tallyCcVia&&window.tallyCcVia(id,null))))return ccSave(path,null,patch);
      if(collection==='users')return sb.from('members').update(patch).eq('org_id',ORG).eq('user_id',id).then(chk);
      // merged on the server in one step, so two phones (or a payment the server records) can't undo
      // each other; a database without doc_patch yet falls back to read, merge, write
      if(patchRpc!==false)return sb.rpc('doc_patch',{o:ORG,p:path,patch:patch}).then(function(r){
        if(r&&r.error){if(noFunction(r.error)){patchRpc=false;return mergeWrite()}throw r.error}
        patchRpc=true;
        if(!r||r.data!==true)throw new Error('missing');
        return r;
      });
      return mergeWrite();
      function mergeWrite(){
        return readOne().then(function(s){
          if(!s.exists)throw new Error('missing');
          var merged=deepMerge(s.data(),patch);
          return sb.from('docs').upsert({org_id:ORG,path:path,collection:collection,doc_id:id,data:merged,updated_at:new Date().toISOString()}).then(chk);
        });
      }
    },
    delete:function(){
      if(collection==='users')return sb.from('members').delete().eq('org_id',ORG).eq('user_id',id).then(chk);
      if(collection==='requests')return sb.from('access_requests').delete().eq('org_id',ORG).eq('user_id',id).then(chk);
      return sb.from('docs').delete().eq('org_id',ORG).eq('path',path).then(chk);
    },
    onSnapshot:function(next,err){
      var key=collection+'|doc|'+id;
      return watch(key,function(){readOne().then(next).catch(function(e){if(err)err(e)})});
    }
  };
}
function chk(r){if(r&&r.error)throw r.error;return r}
// The call center saves jobs only through cc_save (supabase-callcenter.sql), which checks what it saves. A
// quote booked or closed by someone else meanwhile is no longer theirs: that comes back as e.closed.
function ccSave(path,doc,patch){
  return sb.rpc('cc_save',{o:ORG,p:path,doc:doc,patch:patch}).then(function(r){
    if(r&&r.error)throw r.error;
    if(r&&r.data==='ok')return r;
    var e=new Error(r&&r.data==='closed'?'closed':'missing');if(r&&r.data==='closed')e.closed=true;throw e;
  });
}
var patchRpc=null;   // null: not tried yet; false: this database has no doc_patch yet
function noFunction(e){return e.code==='PGRST202'||/could not find the function/i.test(e.message||'')}

/* ---------- who am I ---------- */
function refreshMe(){
  if(!me.id)return Promise.resolve(me);
  return sb.from('members').select('*').eq('org_id',ORG).eq('user_id',me.id).maybeSingle().then(function(r){
    var m=r.data;
    me.role=m?m.role:'';me.staff=m?m.staff:'';
    me.isOwner=!!(m&&m.role==='owner');me.canEdit=me.isOwner;
    // Tally's call center team, in a company with the service (supabase-callcenter.sql): not a member
    if(!m&&window.tallyOrg&&window.tallyOrg.role==='callcenter')return sb.rpc('cc_me').then(function(x){me.role='callcenter';me.staff=(x&&x.data)||'Call center';return me});
    return me;
  }).catch(function(){return me});
}

var db={doc:docRef,collection:function(c){return Object.assign(collectionRef(c),{doc:function(id){return docRef(c+'/'+id)}})}};
var user={
  me:function(){return Promise.resolve({id:me.id,name:me.email,isOwner:me.isOwner,canEdit:me.canEdit})},
  id:function(){return Promise.resolve(me.id)},
  isOwner:function(){return Promise.resolve(me.isOwner)},
  canEdit:function(){return Promise.resolve(me.canEdit)},
  profiles:function(ids){
    ids=[].concat(ids);
    return sb.rpc('people',{o:ORG}).then(function(r){
      var out={};(r.data||[]).forEach(function(p){out[p.user_id]={id:p.user_id,name:p.email,avatarUrl:''}});
      ids.forEach(function(i){if(!out[i])out[i]={id:i,name:'',avatarUrl:''}});
      return out;
    }).catch(function(){var o={};ids.forEach(function(i){o[i]={id:i,name:'',avatarUrl:''}});return o});
  }
};

    if(c.length!==6){pick.msg='Company codes are 6 letters and numbers.';pick.kind='bad';return renderPicker()}
    pick.busy=true;renderPicker();
    sb.rpc('request_join',{code:c}).then(function(r){pick.busy=false;
      if(r.error||!r.data){pick.msg='No company has that code. Check it with the owner.';pick.kind='bad';return renderPicker()}
      pick.msg='Request sent to '+r.data+'. The owner needs to approve you.';pick.kind='ok';pick.mode='list';loadOrgs()});
  };
  var f=q('input');if(f)setTimeout(function(){try{f.focus()}catch(e){}},30);
}
function loadOrgs(){
  return sb.rpc('my_orgs').then(function(r){pick.orgs=r.data||[];return pick.orgs}).catch(function(){pick.orgs=[];return []}).then(function(list){renderPicker();return list});
}

/* ---------- boot ---------- */
function onSession(session){
  if(!session||!session.user){me={id:'',email:'',role:'',staff:'',isOwner:false,canEdit:false};showLogin();return}
  me.id=session.user.id;me.email=session.user.email||'';
  if(window.__tallyBooted){reload();return}   // a different person signed in on this device: start clean
  // a profile the owner set up with this email links now, so the person walks straight in
  // and a company Tally's admin added for this email becomes theirs
  sb.rpc('claim_invites').then(function(){},function(){}).then(function(){return sb.rpc('claim_company_invites')}).then(function(){},function(){}).then(function(){return sb.rpc('claim_cc_team')}).then(function(r){pick.agent=!!(r&&r.data===true)},function(){}).then(function(){return sb.rpc('my_orgs')}).then(function(r){
    var list=r.data||[],hit=list.filter(function(o){return o.id===ORG})[0],ready=list.filter(function(o){return !o.pending});
    // a customer (no company of their own), or someone who asked for their own moves: the customer side
    var wantCust=false;try{wantCust=sessionStorage.getItem('tally.cust')==='1'}catch(e){}
    if(!hit&&!pick.agent&&(wantCust||!list.length))return custStart(list).then(function(ok){
      if(ok)return;
      try{sessionStorage.removeItem('tally.cust')}catch(e){}
      if(!ORG&&ready.length===1){useOrg(ready[0].id);return}
      pick.orgs=list;pick.mode='list';pick.msg='';pick.noMove=!list.length;hideLoginOnly();renderPicker();
    });
    if(!hit&&!ORG&&ready.length===1){useOrg(ready[0].id);return}
    // the call center team: any of its companies opens the Companies screen, where they pick the one on the call
    if(!hit&&ready.length&&ready.every(function(o){return o.role==='callcenter'})){useOrg(ready[0].id);return}
    if(!hit){pick.orgs=list;pick.mode='list';pick.msg='';hideLoginOnly();renderPicker();return}
    window.tallyOrg={id:hit.id,name:hit.name,role:hit.role,join_code:hit.join_code,pending:hit.pending,plan:hit.plan};
    hideLogin();
    return Promise.all([refreshMe(),commsApi.refresh()]).then(function(){window.__tallyBooted=true;readyGo();custPeek()});
  }).catch(function(){hideLoginOnly();renderPicker()});
}
/* ---------- the customer side (Oct 28): a customer's moves, through the Edge Function (they are none of a company's
   people, so the database's rules give them nothing directly). The app's customer screens read window.tallyCust. ---------- */
window.tallyCust={on:false,email:'',name:'',phone:'',moves:[],orgs:[],has:false,
  refresh:function(){return commsPost({action:'cust_list'}).then(function(r){var C=window.tallyCust;if(r&&r.ok){C.moves=r.moves||[];C.name=r.name||C.name;C.phone=r.phone||C.phone}return r})},
  act:function(kind,org,id,extra){return commsPost(Object.assign({action:'cust_'+kind,org:org,jobId:id,back:location.origin+location.pathname},extra||{}))},
  saveProfile:function(p){
    var up=sb.auth.updateUser?sb.auth.updateUser({data:{name:p.name,phone:p.phone}}).catch(function(){}):Promise.resolve();
    return up.then(function(){return commsPost({action:'cust_profile',name:p.name,phone:p.phone})}).then(function(r){if(r&&r.ok){window.tallyCust.name=p.name;window.tallyCust.phone=p.phone}return r});
  },
  // someone who works for a company and has a move of their own: their moves, then back to work
  mine:function(){try{sessionStorage.setItem('tally.cust','1');localStorage.removeItem(ORG_KEY)}catch(e){}reload()},
  work:function(){try{sessionStorage.removeItem('tally.cust')}catch(e){}reload()}
};
function custStart(list){
  return commsPost({action:'cust_list'}).then(function(r){
    if(!r||!r.ok||!(r.moves||[]).length)return false;
    var C=window.tallyCust;C.on=true;C.email=me.email;C.name=r.name||'';C.phone=r.phone||'';C.moves=r.moves;C.orgs=(list||[]).filter(function(o){return !o.pending});
    window.tallyOrg=null;hideLogin();window.__tallyBooted=true;readyGo();
    if(window.tallyCustGo)window.tallyCustGo();

}
// at work: are there moves of their own too (More › My moves)
function custPeek(){commsPost({action:'cust_list'}).then(function(r){if(r&&r.ok&&(r.moves||[]).length){window.tallyCust.has=true;if(window.tallyMoreRedraw)window.tallyMoreRedraw()}}).catch(function(){})}
/* ---------- the call center's Companies screen: every company with the service, from the database ----------
   companies(): [{id,name,here,card}] (card: the rate card copy); sched(ids): {org: [schedule copies]};
   open(id,pre): that company, with the quote (or its schedule) to open once it's loaded. */
window.tallyDesk={
  companies:function(){
    return sb.rpc('my_orgs').then(function(r){
      if(r.error)throw r.error;
      var cc=(r.data||[]).filter(function(o){return o.role==='callcenter'}),ids=cc.map(function(o){return o.id});
      if(!ids.length)return [];
      return sb.from('docs').select('org_id,data').eq('path','ratecard/main').in('org_id',ids).then(function(x){
        if(x.error)throw x.error;
        var by={};(x.data||[]).forEach(function(d){by[d.org_id]=d.data});
        return cc.map(function(o){return {id:o.id,name:o.name,here:o.id===ORG,card:by[o.id]||{company:o.name}}});

  sched:function(ids){
    if(!ids.length)return Promise.resolve({});

      if(x.error)throw x.error;
      var by={};(x.data||[]).forEach(function(d){(by[d.org_id]=by[d.org_id]||[]).push(d.data)});return by;

};

/* ---------- texts and calls through the company line (Twilio, via the tally-twilio Edge Function) ---------- */
var commsLine='';
function commsPost(body){
  return sb.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;if(!s)return {ok:false,message:'Sign in again.'};
    var raw=JSON.stringify(Object.assign({org:ORG},body));   // keepalive only for small posts: a phone drops a bigger one (64 KB) as the page closes
    return fetch(CFG.url.replace(/\/+$/,'')+'/functions/v1/tally-twilio/app',{method:'POST',keepalive:raw.length<60000,
      headers:{'Content-Type':'application/json',apikey:CFG.anonKey,Authorization:'Bearer '+s.access_token},
      body:raw}).then(function(res){return res.json().catch(function(){return {ok:false,message:'The server did not answer. Try again.'}})});
  }).catch(function(){return {ok:false,message:'Could not reach the server. Check your connection.'}});
}
var commsApi={
  number:function(){return commsLine},
  refresh:function(){
    if(!ORG)return Promise.resolve('');
    return sb.from('comm_lines').select('phone_number,enabled').eq('org_id',ORG).maybeSingle()
      .then(function(r){commsLine=(r&&r.data&&r.data.enabled)?r.data.phone_number:'';return commsLine})
      .catch(function(){commsLine='';return ''});
  },
  job:function(id){return commsPost({action:'job',jobId:id})},

/* ---------- employee profiles (owner only), my own profile, and documents in a private bucket ---------- */
var EMP_COLS='id,name,role,email,user_id,active,info,notes,updated_at',DOCS='employee-docs';

window.tallyPeople={

  mine:function(){return sb.rpc('my_profile',{o:ORG}).then(empRow)},

  docs:function(id){return sb.storage.from(DOCS).list(ORG+'/'+id,{limit:200}).then(function(r){if(r.error)throw r.error;
    return (r.data||[]).filter(function(f){return f&&f.id&&f.name}).map(function(f){return {name:f.name,path:ORG+'/'+id+'/'+f.name,size:(f.metadata&&f.metadata.size)||0}})})},
  upload:function(id,file,name){var path=ORG+'/'+id+'/'+name;return sb.storage.from(DOCS).upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false}).then(function(r){if(r.error)throw r.error;return path})},
  url:function(path){return sb.storage.from(DOCS).createSignedUrl(path,600).then(function(r){if(r.error)throw r.error;return r.data.signedUrl})},
  removeDoc:function(path){return sb.storage.from(DOCS).remove([path]).then(function(r){if(r.error)throw r.error})},
  uid:function(){return me.id}
};

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

function fmtMoneyField(t){var d=t.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,10);t.value=fmtCents(d?parseInt(d,10):0);try{t.setSelectionRange(t.value.length,t.value.length)}catch(x){}}
var fmtInt=function(n){return Math.round(n||0).toLocaleString('en-US')};

function parseISO(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}

/* ---------- defaults ---------- */
var CATS=['Living room','Bedroom','Dining','Kitchen & laundry','Office','Boxes','Specialty'];
function defaultSettings(){return {
  company:'Your Moving Co.',
  rates:{r2:140,r3:195,r4:250},
  minHours:3,prod:45,mph:30,shopAddress:'',shopTravel:true,lateMins:30,activities:['Job day','Warehouse','Dump run','Truck and shop upkeep','Other'],truckFee:45,includedMiles:20,mileRate:1.5,stairFee:25,packPerBox:8,taxPct:0,depositPct:25,ntePct:15,crewCost:24,
  trucks:[{id:'t26',name:'Box 1 (26 ft)',cf:1700},{id:'t20',name:'Box 2 (20 ft)',cf:1000},{id:'t16',name:'Van (16 ft)',cf:800}],
  crew:['Marcus','Dee','Luis','Tanya','Andre','Kim'],ccStaff:[],
  sources:['Google','Referral','Yelp','Facebook','Repeat customer','Other'],
  customFields:[{id:'cf1',label:'Elevator reserved',type:'yesno'},{id:'cf2',label:'Parking notes',type:'text'}],

/* ---------- pricing engine ----------
   Two kinds of move, decided by the company's radius (Setup › Rate card, `includedMiles`), in
   driving miles from the shop:
   - Local: pickup and delivery both inside it. Charged by the hour, the drive included, and no
     mileage.
   - Mileage: either end outside it. Charged per mile for the whole drive, plus loading and
     unloading time only.
   With no shop address (or before the drives from it are known) the move's own distance decides.
   The office can set the kind on a quote by hand (d.moveKind). The quote estimates the hours and
   the miles; the final bill uses what really happened (clockBill). */
function moveKind(d,S){
  if(d.moveKind==='local'||d.moveKind==='mileage')return d.moveKind;
  return moveKindAuto(d,S).kind;
}
function moveKindAuto(d,S){
  var r=num(S.includedMiles),shop=!!String(S.shopAddress||'').trim(),has=function(k){return String(d[k]==null?'':d[k]).trim()!==''};
  if(!opt('mileage',S))return {kind:'local',why:'off'};   // Options › Mileage moves is off: every move by the hour
  if(!(r>0))return {kind:'local',why:'none'};
  if(shop&&(has('milesOut')||has('milesBack'))){
    var out=has('milesOut')?num(d.milesOut):null,back=has('milesBack')?num(d.milesBack):null,mv=has('miles')?num(d.miles):null;
    // a drive from the shop that isn't in yet is at least the move's length less the other drive
    var outLo=out!=null?out:mv!=null?Math.max(0,mv-back):null,backLo=back!=null?back:mv!=null?Math.max(0,mv-out):null;
    return {kind:(outLo||0)>r||(backLo||0)>r?'mileage':'local',why:'shop',out:out,back:back,outLo:outLo,backLo:backLo,r:r};
  }

}
// the quote screen's line about the kind of move, and why
function kindLine(d,S){
  var a=moveKindAuto(d,S),k=moveKind(d,S),r=num(S.includedMiles),R=fmtMi(r)+'-mile';
  var head='<b>'+(k==='mileage'?'Mileage move':'Local move')+'</b>',what=k==='mileage'?'per mile for the drive, plus loading and unloading time':'by the hour with the drive included, no mileage';
  if(d.moveKind==='local'||d.moveKind==='mileage')return head+', set by hand: '+what+'.'+(r>0&&a.why!=='unknown'&&a.kind!==k?' By your '+R+' radius it would be a '+a.kind+' move.':'');
  if(a.why==='off')return head+': '+what+'. Mileage moves are off in Setup \u203a Options, so every move is local.';
  if(a.why==='none')return head+': '+what+'. No local radius is set in Setup \u203a Rate card, so every move is local.';
  if(a.why==='unknown')return '';

    if(k==='mileage'){var far=[];if(a.outLo!=null&&a.outLo>r)far.push('the pickup is '+(a.out==null?'at least ':'')+fmtMi(a.outLo)+' mi');if(a.backLo!=null&&a.backLo>r)far.push('the delivery is '+(a.back==null?'at least ':'')+fmtMi(a.backLo)+' mi');why=far.join(' and ')+' from the shop, past your '+R+' radius.'}
    else why=(a.out!=null?'the pickup is '+fmtMi(a.out)+' mi':'')+(a.out!=null&&a.back!=null?' and ':'')+(a.back!=null?'the delivery is '+fmtMi(a.back)+' mi':'')+' from the shop, inside your '+R+' radius.'+(a.out==null||a.back==null?' Waiting on the drive '+(a.out==null?'from the shop to the pickup':'from the delivery back to the shop')+'.':'');
  }else why='the move is '+fmtMi(a.move)+' mi, '+(k==='mileage'?'past':'inside')+' your '+R+' radius.'+(String(S.shopAddress||'').trim()?' The miles from the shop decide it once they\u2019re in.':' Add the shop address in Setup \u203a Company to measure from the shop.');

function calc(d,S){
  var cf=0,count=0,boxes=0,fees=0;
  S.catalog.forEach(function(it){var q=d.items[it.id]||0;if(!q)return;cf+=q*it.cf;count+=q;if(it.cat==='Boxes')boxes+=q;if(it.fee)fees+=q*it.fee});
  var shopTravel=!!S.shopAddress&&S.shopTravel!==false;
  var moveMi=num(d.miles),legMi=shopTravel?num(d.milesOut)+num(d.milesBack):0,miles=moveMi+legMi,flights=num(d.flights);
  var kind=moveKind(d,S),mileage=kind==='mileage';
  var crew=parseInt(d.crew,10)||(cf<350?2:cf<1000?3:4);
  // loading and unloading, from the inventory; a local move adds the drive, a mileage move charges it by the mile
  var raw=cf?cf/(crew*S.prod)+(mileage?0:miles/S.mph):0;
  var hours=cf?Math.max(S.minHours,Math.ceil(raw*2)/2):0;
  if(num(d.hoursOverride)>0)hours=num(d.hoursOverride);
  var trucks=S.trucks.slice().sort(function(a,b){return a.cf-b.cf});
  var truck=trucks.find(function(t){return t.id===d.truckId})||trucks.find(function(t){return cf*1.08<=t.cf})||trucks[trucks.length-1]||{id:'',name:'No truck',cf:1};
  var nTrucks=Math.max(1,Math.ceil(cf*1.08/truck.cf));
  var pct=cf?Math.min(1,cf/(nTrucks*truck.cf)):0;
  var lines=[],rate=S.rates['r'+crew]||0,mileRate=num(S.mileRate),fixed=0,billMi=Math.round(miles*100)/100;
  var add=function(label,amt,k){lines.push({label:label,amt:amt,k:k});if(k==='fixed')fixed+=amt};
  if(cf){
    add(crew+' movers, '+hours+' hr'+(mileage?' loading and unloading':'')+' at '+money(rate)+'/hr',Math.round(rate*hours),'hours');
    if(opt('truckFee',S))add((nTrucks>1?nTrucks+' trucks':'Truck')+' and fuel',Math.round(S.truckFee*nTrucks),'fixed');
    if(mileage&&miles>0)add('Mileage: '+fmtMi(miles)+' mi'+(legMi?' from the shop and back':'')+' at '+money(mileRate)+'/mi',Math.round(billMi*mileRate),'miles');
    if(flights>0&&opt('stairs',S))add('Stairs: '+flights+' flight'+(flights===1?'':'s'),Math.round(flights*S.stairFee),'fixed');
    if(d.pack&&boxes>0&&opt('packing',S))add('Packing and materials: '+boxes+' boxes',Math.round(boxes*S.packPerBox),'fixed');
    if(fees>0)add('Specialty items',Math.round(fees),'fixed');
    if(num(d.discount)>0)add('Discount',-Math.round(num(d.discount)),'fixed');
  }
  var subtotal=lines.reduce(function(a,l){return a+l.amt},0);
  var taxPct=opt('tax',S)?num(S.taxPct):0,tax=Math.round(subtotal*taxPct/100);
  if(tax>0)lines.push({label:'Tax ('+taxPct+'%)',amt:tax,k:'tax'});
  var total=Math.max(0,subtotal+tax);
  return {cf:cf,count:count,lbs:cf*7,crew:crew,hours:hours,truckId:truck.id,truckName:truck.name,truckCf:truck.cf,nTrucks:nTrucks,pct:pct,lines:lines,total:total,nte:Math.ceil(total*(1+S.ntePct/100)/5)*5,deposit:opt('deposit',S)?Math.ceil(total*S.depositPct/100):0,
    // what the final bill is worked out from (clockBill)
    kind:kind,rate:rate,miles:mileage?billMi:0,mileRate:mileRate,fixed:fixed,taxPct:taxPct,minHours:num(S.minHours),
    // Options › Final bill by the clock off: a flat price, and the bill is the quote
    flat:!opt('byClock',S),
    shopTravel:shopTravel,backH:shopTravel&&S.mph>0?Math.round(num(d.milesBack)/S.mph*100)/100:0,capNte:S.nteCap!==false,
    // the drive a mileage quote's hours leave out, so the day's length on the board is still right
    driveH:mileage&&S.mph>0?Math.round(miles/S.mph*100)/100:0};
}
/* ---------- the final bill, from what really happened ----------
   A job quoted as a local or mileage move is billed by the clock when it finishes:
   - local: from Start job (or from Start loading, when the drive from the shop isn't counted) to
     Done unloading, plus the quoted drive back to the shop when it is;
   - mileage: loading plus unloading time, and the miles driven (the lead can enter them from the
     odometer; otherwise the quote's miles).
   At least the minimum hours, in 15-minute steps. The quote's not-to-exceed price is a guide, not a cap
   (Richie, Oct 24: "The not to exceed amount is a suggestion not a rule"): the bill is the time it took,
   even past it, and the job sheet says when it went past. A bill made before Oct 24 (billOld) was held to
   it, and still is. The difference from the quote is one line on the bill (extra 'clock'), worked out again
   when the office corrects the hours or miles (j.clockFix). Jobs quoted before move kinds keep
   their quoted price.
   The hours are billed by the movers on the bill (Richie, Oct 21: "the bill should show the quote,
   then it should show the 1.5 hours as 2 man and 1.25 hours as a 3 man", and "Since its a 3 hour
   minimum then you charge the 2 man for the beginning time then when the extra man gets there to
   the 3 hour minimum. So the 3 men might of got it done in 1.25 hours but the company will charge
   1.50 hours for those 3 guys"): each stretch with a different crew is its own row at that crew's
   rate, a change of crew counts from the nearest quarter hour and the end goes up to the next one,
   and the minimum (or the hours the office set) fills in, or comes off, at the end. The line keeps
   the bill's rows (rows), so every screen shows the quote and then what the bill is made of.
   The movers on the bill are the people put on the job, not the quote's crew (Richie, Oct 24: "When a job is
   booked as a 2 man move and the office decides to put 3 people on the job the bill should reflect the people put

function clockBill(j){

  var p=j.phases||{},fix=j.clockFix||{},mileage=q.kind==='mileage',h=null,parts=null,wins=[],backMs=0;
  if(mileage){
    if(p.loadStart&&p.loadEnd&&p.unloadStart&&p.unloadEnd){var ld=Math.max(0,p.loadEnd-p.loadStart),ul=Math.max(0,p.unloadEnd-p.unloadStart);h=(ld+ul)/36e5;parts={load:ld,unload:ul};wins=[[p.loadStart,p.loadEnd,'l'],[p.unloadStart,p.unloadEnd,'u']]}

    var end=p.unloadEnd||j.finishedAt,start=q.shopTravel?(j.startedAt||p.loadStart):(p.loadStart||j.startedAt),back=q.shopTravel?(crewBack?Math.max(0,num(j.back.mins))/60:num(q.backH)):0;

  var billed=setH?num(fix.hours):Math.max(num(q.minHours),Math.ceil(h*4-1e-6)/4);
  var driven=j.milesDriven!=null&&j.milesDriven!=='';
  var miles=mileage?(setMi?num(fix.miles):driven?num(j.milesDriven):num(q.miles)):0;
  // the hours, by the movers on the bill, each at its crew's rate (the quote's crew at the quote's rate)
  var qc=num(q.crew)||2,segs=billHours(j,h,wins,backMs,billed),hoursAmt=0;
  segs.forEach(function(s){s.rate=s.n===qc?num(q.rate):mvRate(j,s.n);s.amt=Math.round(s.rate*s.h);hoursAmt+=s.amt});
  var milesAmt=mileage?Math.round(miles*num(q.mileRate)):0,tp=num(q.taxPct);

  // before Oct 24 was held to it, as if the quote's crew did all the hours, with the time with more movers on top

  var c={worked:h,parts:parts,billed:billed,miles:miles,total:total,capped:capped,capAmt:capAmt,over:!capped&&nte>0&&total>nte+0.004,adj:Math.round((total-q.total)*100)/100,setH:setH,setMi:setMi,driven:driven,segs:segs,qc:qc};
  c.rows=billRows(j,c,milesAmt,tax,sub+tax<0?-(sub+tax):0);

}
// the time on the clock, cut where the movers on the bill changed: [{n, from, to, ms, w}] in order; w: the
// mileage move's windows in it ('l' loading, 'u' unloading)
function billSegs(j,wins){
  var A=crewAdjs(j),out=[];
  wins.forEach(function(w){
    if(!(w[1]>w[0]))return;
    var cuts=[w[0]].concat(A.map(function(e){return e.ts}).filter(function(t){return t>w[0]&&t<w[1]})).concat([w[1]]);
    for(var i=0;i<cuts.length-1;i++){
      var a=cuts[i],b=cuts[i+1];if(b<=a)continue;
      var n=billCrewAt(j,a),last=out[out.length-1];

// the billed hours of each stretch: {n, h, from, to, ms, back, w, fill (the minimum, or the office's hours, added
// at the end), cut (the office's hours, taken off the end), set (no times: the office's hours)}
function billHours(j,h,wins,backMs,billed){
  // no times: the movers at the start (a job that never started: its crew, with every change put in)
  var n0=billCrewAt(j,j.startedAt||(billOld(j)?0:Infinity));
  if(h==null)return [{n:n0,h:billed,ms:0,set:true}];
  var segs=billSegs(j,wins);
  if(!segs.length)segs=[{n:n0,from:0,to:0,ms:Math.max(0,h*36e5-backMs),w:''}];
  if(backMs>0)segs[segs.length-1].back=backMs;   // the drive back to the shop goes with the crew at the end
  var end4=Math.ceil(h*4-1e-6)/4,C=0,R=0;
  segs.forEach(function(s,i){C+=s.ms+(s.back||0);var r=i===segs.length-1?end4:Math.min(end4,Math.max(R,Math.round(C/36e5*4)/4));s.h=r-R;R=r});
  var d=billed-end4;

// the bill's rows: the hours by the movers on the bill, the miles, the quote's fees, tax, and the not-to-exceed price
function billRows(j,c,milesAmt,tax,floor){

        :fmtClock(s.from)+' to '+fmtClock(s.to)+' ('+fmtDur(s.ms)+')');

    }
    if(s.set||(c.setH&&(s.fill||s.cut)))t.push('hours set by the office');
    else if(s.fill)t.push('the '+num(q.minHours)+'-hour minimum');
    rows.push({k:'hours',label:s.n+' mover'+(s.n===1?'':'s')+', '+(Math.round(s.h*100)/100)+' hr'+(mileage&&!multi?' loading and unloading':'')+' at '+money(s.rate)+'/hr',sub:t.join(' · '),amt:s.amt});
  });

// "2 movers 1.5 h, then 3 movers 1.5 h", when the crew changed during the job; "3 movers 5 h" for another crew than the quote's

function segOther(c){return !!c&&!!c.qc&&(c.segs||[]).some(function(x){return x.h>1e-9&&x.n!==c.qc})}

function bidActual(j){var p=j.phases||{};if(j.quote&&j.quote.kind==='mileage')return p.loadStart&&p.loadEnd&&p.unloadStart&&p.unloadEnd?Math.round(((p.loadEnd-p.loadStart)+(p.unloadEnd-p.unloadStart))/36e5*10)/10:0;return j.actualHours||0}

    :!mileage&&pt.backSet?fmtDur(pt.span)+' on the job'+(pt.back>0?' + '+fmtDur(pt.back)+' back to the shop':'')+', billed '+fmtHrs(c.billed)
